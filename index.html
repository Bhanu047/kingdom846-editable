<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: without it the page stops at the safe area, so on a
       notched iPhone held sideways the entrance is letterboxed between two black
       bars down the left and right. The welcome screen already asked for cover;
       this page, which hosts it, did not. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06152b" />
  <meta name="description" content="The official portal of Kingdom 846 — alliances, events, guides, rankings, and kingdom management. We don't wait for glory. We take it." />
  <title>Kingdom 846 — We Take What's Ours</title>
  <!-- One canonical URL. The portal is hash-routed, so every #/route a
       visitor lands on is this same document to a crawler; saying so
       stops any of them being treated as a duplicate. -->
  <link rel="canonical" href="https://kingdom846.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kingdom 846 — We Take What's Ours" />
  <meta property="og:description" content="The official portal of Kingdom 846 — alliances, events, guides, rankings, and kingdom management." />
  <meta property="og:url" content="https://kingdom846.com/" />
  <!-- The share card is the kingdom's own crest on a navy field, built to
       the 1.91:1 ratio the platforms crop to, so nothing is cut off. JPEG
       rather than WebP on purpose: WebP previews are unreliable on LinkedIn
       and some chat clients. Absolute URL on purpose too -- scrapers do not
       resolve a relative one. Regenerate with tools/make-share-card.py. -->
  <meta property="og:image" content="https://kingdom846.com/assets/kingdom846-share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Kingdom 846 crest — gold lions and a crowned blue shield — beside the words Kingdom 846, We Take What's Ours" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kingdom 846 — We Take What's Ours" />
  <meta name="twitter:description" content="The official portal of Kingdom 846 — alliances, events, guides, rankings, and kingdom management." />
  <meta name="twitter:image" content="https://kingdom846.com/assets/kingdom846-share.jpg" />
  <meta name="twitter:image:alt" content="The Kingdom 846 crest — gold lions and a crowned blue shield — beside the words Kingdom 846, We Take What's Ours" />
  <!-- Critical paint. Without this the document is unstyled until the JS bundle
       injects the CSS, and an unstyled document paints WHITE. Every hard
       navigation into the site flashed white before the realm appeared -- most
       visibly straight after ENTER THE REALM, which navigates here from the
       welcome screen. The welcome screen was already fading to black correctly;
       the white belonged to this page, arriving. -->
  <style>html,body{background:#060810;color:#EFE6CF;margin:0}#root{background:#060810;min-height:100vh}
  /* The welcome screen only exists once React has mounted and its iframe has
     painted. Until then nothing covers this page, so the app underneath is what
     a visitor can catch -- the dashboard appearing first and the entrance
     arriving on top of it a moment later. This veil ships in the HTML itself, so
     it is on screen from the first paint, before a line of JS has run, and it
     comes down only when the entrance is actually ready to be seen.
     The timeout below is a safety line: if the iframe never loads, the veil
     must not strand the site behind a dark rectangle forever. */
  #boot-veil{position:fixed;inset:0;background:#060810;z-index:10000;pointer-events:none}
  #boot-veil.gone{display:none}
  /* On the website the veil wears the hall the entrance is about to open in.
     It was a flat #060810 rectangle, and since the entrance is an iframe inside
     the React bundle -- it cannot paint until the bundle has landed AND the
     iframe has loaded -- that rectangle was the whole wait. Reported from an
     iPhone as a black screen at kingdom846.com with nothing on it.
     The image is the same file the entrance itself uses, so this costs no extra
     bytes: the iframe finds it already fetched. */
  html[data-hall] #boot-veil{background:#060810 var(--k846-hall) center/cover no-repeat}
  html[data-hall] #boot-veil::after{content:'';position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 40%,transparent 0%,rgba(6,8,16,.55) 70%,rgba(6,8,16,.85) 100%)}

  /* The welcome screen, in the page itself.
     It used to be a React component, which meant it could not appear until 370
     kB of JS and CSS had arrived -- and after every deploy those files are
     newly named, so nothing is cached and the phone fetches them from Oregon
     before a single pixel of it exists. Reported three times as "black screen,
     white screen, then the home page, no welcome screen": the screen was real,
     it just could not be drawn yet. Here it is markup and inline CSS, on screen
     in the first frame, before a line of JS runs. React only takes it away.

     The app's, and only the app's. The website has its own front door -- the
     nine halls -- and putting a crest in front of it would be a second welcome
     screen for a site that already has one. What the website needs while that
     door loads is its own room: see #boot-veil above. */
  #k846-launch{position:fixed;inset:0;height:100vh;height:100dvh;z-index:10001;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:.85rem;
    background:radial-gradient(120% 80% at 50% 38%,#141d33 0%,#0a0e1c 58%,#060810 100%);
    transition:opacity .42s ease;opacity:1}
  html[data-app-launch] #k846-launch{display:flex}
  #k846-launch.gone{opacity:0;pointer-events:none}
  #k846-launch img{width:min(38vw,148px);height:auto;filter:drop-shadow(0 10px 32px rgba(0,0,0,.75));
    animation:k846-rise .9s cubic-bezier(.16,1,.3,1) both}
  #k846-launch .k846-word{font-family:'Cinzel',Georgia,serif;font-weight:800;
    font-size:clamp(1.15rem,6vw,1.7rem);letter-spacing:.18em;color:#E8C766;
    animation:k846-rise .9s cubic-bezier(.16,1,.3,1) .08s both}
  #k846-launch .k846-rule{width:min(46vw,190px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,199,102,.75),transparent);
    animation:k846-rise .9s cubic-bezier(.16,1,.3,1) .16s both}
  #k846-launch .k846-foot{position:absolute;bottom:max(2.2rem,env(safe-area-inset-bottom));
    font-family:'Montserrat',system-ui,sans-serif;font-size:.625rem;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:rgba(232,199,102,.5)}
  @keyframes k846-rise{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#k846-launch img,#k846-launch .k846-word,
    #k846-launch .k846-rule{animation:none}}</style>
  <script>
    // Before the stylesheets, deliberately.
    //
    // A script does not run while a stylesheet earlier in the document is still
    // loading -- the browser assumes it might read styles, so it waits. This
    // script was originally in the body, after the font links, and so it waited
    // on Google Fonts and on the 128 kB CSS bundle before it could reveal the
    // welcome screen. On the first open after a deploy, when neither is cached,
    // that is several seconds of nothing: the exact "black screen, white
    // screen, then the home page" that was reported three times.
    //
    // The welcome screen belongs to the installed app; the website has its own
    // entrance, so it stays hidden there.
    try {
      var k846Standalone = window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches
        || window.navigator.standalone === true
        || /[?&]appmode=1/.test(window.location.search);
      if (!k846Standalone) {
        try { k846Standalone = sessionStorage.getItem('k846-app-mode-override') === '1' } catch (e) {}
      }
      if (k846Standalone) document.documentElement.setAttribute('data-app-launch', '');

      // The website's cover is the hall of the week -- the same room the
      // entrance is about to open in, chosen the same way it chooses it
      // (royal-welcome-2/index.html, the K846_HALL block). Duplicated rather
      // than shared because that file is the front door's own document and
      // this has to run before anything of ours has loaded; the rotation is a
      // date and a list, and both read the same list.
      if (!k846Standalone) {
        var halls = ['sapphire', 'coronation', 'moonlit', 'embers', 'cathedral',
                     'storm', 'dragongate', 'warcamp', 'celestial'];
        var asked = new URLSearchParams(window.location.search).get('theme');
        var hall = (asked && halls.indexOf(asked) !== -1) ? asked : null;
        if (!hall) {
          // Monday 24 Aug 2026 -- the week the rotation started, on Sapphire.
          var week = Math.floor((Date.now() - Date.UTC(2026, 7, 24)) / 604800000);
          hall = halls[((week % halls.length) + halls.length) % halls.length];
        }
        var src = '/royal-welcome-2/assets/hall-' + hall + '.webp';
        document.documentElement.style.setProperty('--k846-hall', "url('" + src + "')");
        document.documentElement.setAttribute('data-hall', hall);
        // No preload link here. There used to be one, injected on the very next
        // line after the two above -- but those two lines are what put the hall
        // on #boot-veil, so the fetch is already under way by the time a
        // preload for the same URL could be appended. All it did was ask for
        // the same 280 kB a second time, in parallel, on the first screen.
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded without blocking the first paint.
       A plain stylesheet link holds the whole page back until it resolves, so
       on a slow connection nothing at all is drawn until Google answers -- the
       app sits on the web view's white default, which is exactly what an
       installed app must never do. media="print" makes the browser fetch it at
       low priority without waiting for it; onload promotes it to the real
       stylesheet the moment it lands. The faces already carry display=swap, so
       the words appear in the fallback stack and change to Cinzel a beat
       later, rather than the page waiting to show any words at all. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <!-- Installable app. The manifest carries the icons, name and standalone
       display mode; the apple-* tags below are Safari's older equivalent, which
       iOS still requires to open full screen from the Home Screen. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kingdom 846" />
  <meta name="application-name" content="Kingdom 846" />
  <!-- iOS launch images. A home-screen web app on iOS shows a blank WHITE
       frame between the tap and the first paint unless a startup image exists
       for that device's exact resolution. There is no way to style that frame
       and no fallback: a size missing from this list is a white flash on that
       phone. Each is the app's own background, so the tap leads straight into
       the ink instead of through white. -->
  <link rel="apple-touch-startup-image" href="/ios-splash/640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1488x2266.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/ios-splash/2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
</head>
<body>
  <div id="boot-veil" aria-hidden="true"></div>
  <div id="k846-launch" aria-label="Kingdom 846 starting">
    <!-- The 448px crest. This renders at min(38vw,148px) -- 444 device
         pixels on a 3x phone -- and the full 600x900 plate was 227 kB for it.
         It is precached by the service worker (SHELL_URLS in public/sw.js), so
         on an installed app it is already local when this screen is drawn. -->
    <img src="/assets/crest-846-md.webp" alt="" width="148" height="222" />
    <div class="k846-word">KINGDOM 846</div>
    <div class="k846-rule"></div>
    <div class="k846-foot">One Crown &middot; Four Alliances</div>
  </div>
  <script>
    // Never let the veil outlive its purpose, whatever happens to the iframe.
    window.__k846DropVeil = () => { const v = document.getElementById('boot-veil'); if (v) v.classList.add('gone'); };
    setTimeout(window.__k846DropVeil, 8000);

    // React removes the welcome screen when the app is ready. Whether to show
    // it at all was decided in the head, above the stylesheets, so that this
    // script -- which cannot run until they have loaded -- is never what the
    // first paint is waiting for. If React never arrives -- a
    // broken bundle, a dead connection -- the screen must not strand the app
    // behind a crest forever.
    window.__k846DismissLaunch = function () {
      var el = document.getElementById('k846-launch');
      if (!el) return;
      el.classList.add('gone');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 460);
      document.documentElement.removeAttribute('data-app-launch');
    };
    setTimeout(window.__k846DismissLaunch, 6000);
  </script>
  <div id="root"></div>
  <script src="/battle-lab-fresh-session.js"></script>
  <script type="module" src="/src/main.jsx"></script>

  <script src="/hunt-impact-import.js?v=77ef855" defer></script>

  <script src="/hunt-impact-drag-drop.js?v=3e9545c" defer></script>

  <script src="/mystic-pvp-share-tools.js?v=1128d1e" defer></script>
  <script src="/hunt-impact-export-guard.js?v=7038499" defer></script>
  <script src="/hunt-impact-export-layout-fix.js?v=3b11fe3" defer></script>
  <script src="/hunt-impact-command-dashboard-v4.js?v=446e022" defer></script>
  <script src="/bear-share-tools.js?v=c26054d" defer></script>
  <script src="/army-report-upload.js?v=77ef855" defer></script>
  <script>
    (() => {
      const entranceImpact = new Audio('./assets/enter-sound.wav')
      const royalFanfare = new Audio('./assets/fanfare.wav')
      // Half a megabyte of uncompressed WAV, and it used to be preload='auto'
      // -- so the two of them were downloading in parallel with the entrance's
      // own artwork, on the first paint, for a sound nobody can trigger until
      // they press a button that is still animating in. On a phone that is
      // half a megabyte of contention against the images the visitor is
      // actually waiting to see.
      //
      // They are fetched once the page has finished loading instead. The
      // entrance runs several seconds of animation before ENTER THE REALM can
      // be pressed, so the audio is still there in time; it just no longer
      // competes for the bandwidth that decides how fast the door appears.
      entranceImpact.preload = 'none'
      royalFanfare.preload = 'none'
      const warmAudio = () => {
        entranceImpact.preload = 'auto'
        royalFanfare.preload = 'auto'
        entranceImpact.load()
        royalFanfare.load()
      }
      if (document.readyState === 'complete') setTimeout(warmAudio, 400)
      else window.addEventListener('load', () => setTimeout(warmAudio, 400), { once: true })
      entranceImpact.volume = 0.52
      royalFanfare.volume = 0.28
      entranceImpact.playsInline = true
      royalFanfare.playsInline = true
      const audioState = { entranceImpact, royalFanfare, playing: false, fadeTimer: null }
      window.__k846WelcomeAudio = audioState
      document.addEventListener('pointerdown', (event) => {
        const button = event.target?.closest?.('button')
        if (!button || !/enter\s+the\s+realm/i.test(button.textContent || '') || audioState.playing) return
        audioState.playing = true
        royalFanfare.volume = 0.28
        entranceImpact.currentTime = 0
        royalFanfare.currentTime = 0
        entranceImpact.play().catch(() => {})
        setTimeout(() => royalFanfare.play().catch(() => {}), 70)
        setTimeout(() => {
          clearInterval(audioState.fadeTimer)
          audioState.fadeTimer = setInterval(() => {
            royalFanfare.volume = Math.max(0, royalFanfare.volume - 0.025)
            if (royalFanfare.volume <= 0.01 || royalFanfare.ended) {
              clearInterval(audioState.fadeTimer)
              royalFanfare.pause()
              royalFanfare.volume = 0.28
            }
          }, 120)
        }, 1500)
      }, true)
    })()
  </script>
</body>
