<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06152b" />
  <meta name="description" content="The official portal of Kingdom 846 — alliances, events, guides, rankings, and kingdom management. We don't wait for glory. We take it." />
  <title>Kingdom 846 — We Take What's Ours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="./favicon.png" />
</head>
<body>
  <!-- Fanfare audio: starts muted autoplay before React loads, then unmutes -->
  <audio id="fanfare-audio" autoplay muted preload="auto">
    <source src="./assets/fanfare.wav" type="audio/wav" />
  </audio>
  <script>
    // Aggressive unmute: try to unmute at multiple points for max success rate
    (function() {
      var audio = document.getElementById('fanfare-audio');
      if (!audio) return;
      audio.volume = 0.7;
      
      var unmuted = false;
      function tryUnmute() {
        if (unmuted) return;
        if (!audio.paused) {
          audio.muted = false;
          unmuted = true;
        }
      }
      
      // Try unmuting at multiple intervals
      audio.addEventListener('playing', tryUnmute);
      audio.addEventListener('timeupdate', tryUnmute);
      setTimeout(tryUnmute, 50);
      setTimeout(tryUnmute, 200);
      setTimeout(tryUnmute, 500);
      setTimeout(tryUnmute, 1000);
      requestAnimationFrame(tryUnmute);
      
      // If muted autoplay was blocked, try playing unmuted directly
      audio.play().catch(function() {
        audio.muted = false;
        audio.play().catch(function() {
          // Last resort: play on first interaction
          function playNow() {
            audio.muted = false;
            audio.currentTime = 0;
            audio.play().catch(function(){});
          }
          document.addEventListener('click', playNow, { once: true });
          document.addEventListener('touchstart', playNow, { once: true, passive: true });
          document.addEventListener('keydown', playNow, { once: true });
        });
      });
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
