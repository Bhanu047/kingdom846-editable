<title>Kingdom 846 — Royal Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg:#060810; --gold:#D4AF37; --gold-bright:#E8C766; --gold-pale:#F3E8CC; --gold-deep:#9C7A24; --gold-dark:#6B5414; --crimson:#8C2B3A; }
html,body{height:100%;width:100%;overflow:hidden} body{background:var(--bg);color:var(--gold-pale);font-family:'Spectral',serif;position:relative}
.bg-photo{position:fixed;inset:0;background:url('/assets/royal-bg.jpg') center center/cover no-repeat;z-index:0;animation:bg-zoom 20s ease-in-out infinite alternate}@keyframes bg-zoom{0%{transform:scale(1)}100%{transform:scale(1.08)}}
.bg-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,16,.3) 0%,rgba(6,8,16,.75) 70%,rgba(6,8,16,.92) 100%);z-index:1}
.bg-rays{position:fixed;top:-10%;left:50%;transform:translateX(-50%);width:100%;height:70%;background:conic-gradient(from 180deg at 50% 0%,transparent 0deg,rgba(212,175,55,.05) 8deg,transparent 16deg,rgba(212,175,55,.03) 24deg,transparent 32deg,rgba(212,175,55,.05) 40deg,transparent 48deg,rgba(212,175,55,.03) 56deg,transparent 64deg,rgba(212,175,55,.04) 72deg,transparent 80deg,rgba(212,175,55,.03) 88deg,transparent 96deg,rgba(212,175,55,.05) 104deg,transparent 112deg,rgba(212,175,55,.03) 120deg,transparent 128deg,rgba(212,175,55,.04) 136deg,transparent 144deg,rgba(212,175,55,.03) 152deg,transparent 160deg,rgba(212,175,55,.05) 168deg,transparent 176deg);animation:rays-rotate 60s linear infinite;z-index:2;pointer-events:none;opacity:.6}@keyframes rays-rotate{to{transform:translateX(-50%) rotate(360deg)}}
.gold-frame{position:fixed;inset:16px;border:1px solid rgba(212,175,55,.2);border-radius:6px;z-index:15;pointer-events:none;animation:frame-glow 5s ease-in-out infinite}.gold-frame::before{content:'';position:absolute;inset:5px;border:1px solid rgba(212,175,55,.08);border-radius:3px}@keyframes frame-glow{0%,100%{border-color:rgba(212,175,55,.15);box-shadow:0 0 20px rgba(212,175,55,.03)}50%{border-color:rgba(212,175,55,.3);box-shadow:0 0 30px rgba(212,175,55,.06)}}
.corner-orn{position:fixed;width:70px;height:70px;pointer-events:none;z-index:16;opacity:.3}.corner-orn.tl{top:16px;left:16px}.corner-orn.tr{top:16px;right:16px;transform:scaleX(-1)}.corner-orn.bl{bottom:16px;left:16px;transform:scaleY(-1)}.corner-orn.br{bottom:16px;right:16px;transform:scale(-1)}
.ember{position:absolute;border-radius:50%;pointer-events:none}@keyframes ember-rise{0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}10%{opacity:var(--max-op,.8)}80%{opacity:calc(var(--max-op,.4)*.5)}100%{opacity:0;transform:translateY(-100vh) translateX(var(--drift,0px)) scale(.2)}}
.welcome{position:relative;z-index:10;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:2rem}.crest-wrap{position:relative;display:flex;align-items:center;justify-content:center}.crest-halo{position:absolute;width:25vh;height:25vh;max-width:250px;max-height:250px;background:radial-gradient(circle,rgba(212,175,55,.2) 0%,rgba(140,43,58,.05) 40%,transparent 65%);animation:halo-pulse 5s ease-in-out infinite;pointer-events:none}@keyframes halo-pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.15)}}
.crest-ring{position:absolute;width:28vh;height:28vh;max-width:280px;max-height:280px;border:1px solid rgba(212,175,55,.12);border-radius:50%;animation:ring-spin 25s linear infinite;pointer-events:none}.crest-ring::before{content:'';position:absolute;inset:15px;border:1px solid rgba(212,175,55,.06);border-radius:50%}@keyframes ring-spin{to{transform:rotate(360deg)}}
.crest-img{height:auto;width:auto;max-height:35vh;max-width:70vw;object-fit:contain;filter:drop-shadow(0 10px 35px rgba(0,0,0,.9)) drop-shadow(0 0 25px rgba(212,175,55,.2));animation:crest-float 7s ease-in-out infinite;position:relative;z-index:2}@keyframes crest-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title-block{text-align:center;margin-top:.5rem}.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:.5rem;text-shadow:0 0 12px rgba(212,175,55,.4)}.title{font-family:'Cinzel Decorative',serif;font-size:clamp(2.5rem,6.5vw,4.5rem);font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,#6B5414 0%,#9C7A24 12%,#D4AF37 28%,#E8C766 42%,#F3E8CC 50%,#E8C766 58%,#D4AF37 72%,#9C7A24 88%,#6B5414 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gold-flow 5s linear infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}@keyframes gold-flow{to{background-position:200% center}}
.divider{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.6rem 0}.divider-line{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent)}.divider-ornament{color:var(--gold);opacity:.5;font-size:11px;animation:ornament-glow 3s ease-in-out infinite;text-shadow:0 0 8px rgba(212,175,55,.4)}@keyframes ornament-glow{0%,100%{opacity:.3}50%{opacity:.7}}.tagline{font-family:'Spectral',serif;font-style:italic;font-size:clamp(.85rem,2vw,1.1rem);color:var(--gold);opacity:.65;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.enter-btn{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0a0e1a;background:linear-gradient(135deg,#6B5414 0%,#9C7A24 15%,#D4AF37 30%,#E8C766 45%,#F3E8CC 50%,#E8C766 55%,#D4AF37 70%,#9C7A24 85%,#6B5414 100%);background-size:200% auto;border:none;padding:15px 44px;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 5px 22px rgba(212,175,55,.35),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.15);animation:btn-shimmer 4s linear infinite;transition:transform .3s,box-shadow .3s}@keyframes btn-shimmer{to{background-position:200% center}}.enter-btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 32px rgba(212,175,55,.45),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.15)}.enter-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-15deg);animation:btn-shine 4s cubic-bezier(.16,1,.3,1) infinite}@keyframes btn-shine{0%{left:-100%}60%,100%{left:200%}}.enter-btn::after{content:'';position:absolute;inset:2px;border:1px solid rgba(255,255,255,.15);border-radius:4px;pointer-events:none}
.loading-dots{display:flex;gap:8px;margin-top:.8rem}.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot-pulse 1.5s ease-in-out infinite;box-shadow:0 0 8px rgba(212,175,55,.4)}.loading-dots span:nth-child(2){animation-delay:.2s}.loading-dots span:nth-child(3){animation-delay:.4s}@keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(1)}40%{opacity:1;transform:scale(1.5)}}
@media(max-width:768px){.crest-img{max-height:28vh;max-width:65vw}.crest-halo{width:22vh;height:22vh;max-width:200px;max-height:200px}.crest-ring{width:24vh;height:24vh;max-width:220px;max-height:220px}.corner-orn{width:45px;height:45px}.gold-frame{inset:10px}.divider-line{width:50px}.welcome{gap:.4rem;padding:1.5rem}}@media(max-width:480px){.crest-img{max-height:22vh;max-width:60vw}.crest-halo{width:18vh;height:18vh;max-width:160px;max-height:160px}.crest-ring{width:20vh;height:20vh;max-width:180px;max-height:180px}.corner-orn{width:35px;height:35px}.enter-btn{padding:12px 32px;font-size:11px}.title{font-size:clamp(1.8rem,8vw,2.5rem)}.welcome{gap:.3rem;padding:1rem}}
</style></head><body>
<div class="bg-photo"></div><div class="bg-overlay"></div><div class="bg-rays"></div><div class="gold-frame"></div>
<div class="corner-orn tl"><svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="M0,35 Q0,0 35,0 M0,20 Q0,0 20,0" stroke-width="2"/><path d="M8,8 Q8,28 28,28 Q28,8 8,8" stroke-width="1"/><circle cx="12" cy="12" r="3" fill="#D4AF37" opacity=".5"/><circle cx="12" cy="12" r="1.5" fill="#E8C766"/></svg></div><div class="corner-orn tr"><svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="M0,35 Q0,0 35,0 M0,20 Q0,0 20,0" stroke-width="2"/><path d="M8,8 Q8,28 28,28 Q28,8 8,8" stroke-width="1"/><circle cx="12" cy="12" r="3" fill="#D4AF37" opacity=".5"/><circle cx="12" cy="12" r="1.5" fill="#E8C766"/></svg></div><div class="corner-orn bl"><svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="M0,35 Q0,0 35,0 M0,20 Q0,0 20,0" stroke-width="2"/><path d="M8,8 Q8,28 28,28 Q28,8 8,8" stroke-width="1"/><circle cx="12" cy="12" r="3" fill="#D4AF37" opacity=".5"/><circle cx="12" cy="12" r="1.5" fill="#E8C766"/></svg></div><div class="corner-orn br"><svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="M0,35 Q0,0 35,0 M0,20 Q0,0 20,0" stroke-width="2"/><path d="M8,8 Q8,28 28,28 Q28,8 8,8" stroke-width="1"/><circle cx="12" cy="12" r="3" fill="#D4AF37" opacity=".5"/><circle cx="12" cy="12" r="1.5" fill="#E8C766"/></svg></div>
<div id="embers" style="position:fixed;inset:0;pointer-events:none;z-index:3;"></div>
<div class="welcome"><div class="crest-wrap"><div class="crest-ring"></div><div class="crest-halo"></div><img class="crest-img" src="/perplexity-welcome/crest-846.png" alt="Kingdom 846 Royal Crest"></div><div class="title-block"><div class="eyebrow">One Crown · Four Alliances</div><h1 class="title">KINGDOM 846</h1><div class="divider"><span class="divider-line"></span><span class="divider-ornament">✦ ◆ ✦</span><span class="divider-line"></span></div><p class="tagline">Where legends are forged in fire and crowned in gold</p></div><button class="enter-btn" onclick="enterRealm()">Enter the Realm</button><div class="loading-dots"><span></span><span></span><span></span></div></div>
<audio autoplay id="fanfareAudio"><source src="/assets/fanfare.wav" type="audio/wav"></audio>
<script>const ec=document.getElementById('embers');for(let i=0;i<30;i++){const e=document.createElement('div');e.className='ember';const size=2+Math.random()*4;e.style.width=size+'px';e.style.height=size+'px';e.style.left=Math.random()*100+'%';e.style.bottom='-10px';e.style.background=Math.random()>.3?'#E8C766':'#D4AF37';e.style.boxShadow=`0 0 ${4+size}px rgba(212,175,55,.5)`;e.style.animation=`ember-rise ${8+Math.random()*14}s linear infinite`;e.style.animationDelay=Math.random()*12+'s';e.style.setProperty('--drift',(Math.random()*120-60)+'px');e.style.setProperty('--max-op',(.4+Math.random()*.5));ec.appendChild(e)}const fanfareAudio=document.getElementById('fanfareAudio');if(fanfareAudio){fanfareAudio.volume=.7;fanfareAudio.play().catch(()=>{const playOnInteract=()=>{fanfareAudio.play().catch(()=>{});['mousemove','touchstart','touchmove','keydown','click','scroll','pointermove'].forEach(ev=>document.removeEventListener(ev,playOnInteract))};['mousemove','touchstart','touchmove','keydown','click','scroll','pointermove'].forEach(ev=>document.addEventListener(ev,playOnInteract,{passive:true,once:true}))})}function enterRealm(){document.body.style.transition='opacity .8s ease, filter .8s ease';document.body.style.opacity='0';document.body.style.filter='blur(8px)';setTimeout(()=>{window.parent.postMessage({type:'k846-enter-realm'},window.location.origin)},800)}</script></body></html>
