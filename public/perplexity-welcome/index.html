<style>

.gold-frame{position:fixed;inset:16px;border:1px solid rgba(212,175,55,.2);border-radius:6px;z-index:15;pointer-events:none;animation:frame-glow 5s ease-in-out infinite}.gold-frame::before{content:'';position:absolute;inset:5px;border:1px solid rgba(212,175,55,.08);border-radius:3px}@keyframes frame-glow{0%,100%{border-color:rgba(212,175,55,.15);box-shadow:0 0 20px rgba(212,175,55,.03)}50%{border-color:rgba(212,175,55,.3);box-shadow:0 0 30px rgba(212,175,55,.06)}}

.ember{position:absolute;border-radius:50%;pointer-events:none}@keyframes ember-rise{0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}10%{opacity:var(--max-op,.8)}80%{opacity:calc(var(--max-op,.4)*.5)}100%{opacity:0;transform:translateY(-100vh) translateX(var(--drift,0px)) scale(.2)}}

.title-block{text-align:center;margin-top:.5rem}.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:.5rem;text-shadow:0 0 12px rgba(212,175,55,.4)}.title{font-family:'Cinzel Decorative',serif;font-size:clamp(2.5rem,6.5vw,4.5rem);font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,#6B5414 0%,#9C7A24 12%,#D4AF37 28%,#E8C766 42%,#F3E8CC 50%,#E8C766 58%,#D4AF37 72%,#9C7A24 88%,#6B5414 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gold-flow 5s linear infinite;filter:drop-shadow(0 4px 14px rgba(0,0,0,.7))}@keyframes gold-flow{to{background-position:200% center}}
.divider{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.6rem 0}.divider-line{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent)}.divider-ornament{color:var(--gold);opacity:.5;font-size:11px;animation:ornament-glow 3s ease-in-out infinite;text-shadow:0 0 8px rgba(212,175,55,.4)}@keyframes ornament-glow{0%,100%{opacity:.3}50%{opacity:.7}}.tagline{font-family:'Spectral',serif;font-style:italic;font-size:clamp(.85rem,2vw,1.1rem);color:var(--gold);opacity:.65;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.enter-btn{font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#0a0e1a;background:linear-gradient(135deg,#6B5414 0%,#9C7A24 15%,#D4AF37 30%,#E8C766 45%,#F3E8CC 50%,#E8C766 55%,#D4AF37 70%,#9C7A24 85%,#6B5414 100%);background-size:200% auto;border:none;padding:15px 44px;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 5px 22px rgba(212,175,55,.35),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.15);animation:btn-shimmer 4s linear infinite;transition:transform .3s,box-shadow .3s}@keyframes btn-shimmer{to{background-position:200% center}}.enter-btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 32px rgba(212,175,55,.45),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.15)}.enter-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-15deg);animation:btn-shine 4s cubic-bezier(.16,1,.3,1) infinite}@keyframes btn-shine{0%{left:-100%}60%,100%{left:200%}}.enter-btn::after{content:'';position:absolute;inset:2px;border:1px solid rgba(255,255,255,.15);border-radius:4px;pointer-events:none}
.loading-dots{display:flex;gap:8px;margin-top:.8rem}.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot-pulse 1.5s ease-in-out infinite;box-shadow:0 0 8px rgba(212,175,55,.4)}.loading-dots span:nth-child(2){animation-delay:.2s}.loading-dots span:nth-child(3){animation-delay:.4s}@keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(1)}40%{opacity:1;transform:scale(1.5)}}
@media(max-width:768px){.crest-img{max-height:28vh;max-width:65vw}.crest-halo{width:22vh;height:22vh;max-width:200px;max-height:200px}.crest-ring{width:24vh;height:24vh;max-width:220px;max-height:220px}.corner-orn{width:45px;height:45px}.gold-frame{inset:10px}.divider-line{width:50px}.welcome{gap:.4rem;padding:1.5rem}}@media(max-width:480px){.crest-img{max-height:22vh;max-width:60vw}.crest-halo{width:18vh;height:18vh;max-width:160px;max-height:160px}.crest-ring{width:20vh;height:20vh;max-width:180px;max-height:180px}.corner-orn{width:35px;height:35px}.enter-btn{padding:12px 32px;font-size:11px}.title{font-size:clamp(1.8rem,8vw,2.5rem)}.welcome{gap:.3rem;padding:1rem}}

/* Aurora behind the hall, matching the motion language the rest of the site
   now uses. It sits UNDER the photo overlay so it tints the room rather than
   floating in front of it -- the hall stays the subject. */
.aurora{position:fixed;inset:-18vmax;z-index:1;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
.aurora .a1{width:60vmax;height:44vmax;top:-6vmax;left:-8vmax;background:radial-gradient(circle,rgba(212,175,55,.34),transparent 70%);animation:au-a 36s ease-in-out infinite alternate}
.aurora .a2{width:66vmax;height:50vmax;top:6vmax;right:-12vmax;background:radial-gradient(circle,rgba(58,102,190,.30),transparent 72%);animation:au-b 46s ease-in-out infinite alternate}
.aurora .a3{width:52vmax;height:36vmax;bottom:-12vmax;left:32%;background:radial-gradient(circle,rgba(232,199,102,.22),transparent 70%);animation:au-c 40s ease-in-out infinite alternate}
@keyframes au-a{0%{translate:0 0;scale:1;opacity:.40}50%{translate:6vmax 4vmax;scale:1.18;opacity:.60}100%{translate:3vmax 8vmax;scale:1.06;opacity:.44}}
@keyframes au-b{0%{translate:0 0;scale:1.06;opacity:.38}50%{translate:-8vmax 5vmax;scale:1;opacity:.58}100%{translate:-4vmax -5vmax;scale:1.2;opacity:.42}}
@keyframes au-c{0%{translate:0 0;scale:1.1;opacity:.28}50%{translate:-5vmax -4vmax;scale:1;opacity:.46}100%{translate:5vmax -7vmax;scale:1.14;opacity:.32}}

/* The title arrives a letter at a time instead of as one block. Each glyph
   rotates up out of the floor of its own line, so the words assemble rather
   than fade in. --i is set per character by the script below. */
/* The gold gradient has to live on each CHARACTER, not on .title.
   Splitting the title puts every glyph inside an inline-block that carries its
   own transform, and a transformed descendant establishes its own stacking
   context -- so the parent's background-clip:text no longer paints through it.
   With -webkit-text-fill-color:transparent still inherited, the whole title
   rendered invisible. Each span now carries the same ramp and keeps the
   gold-flow shimmer, so the letters stay gold and stay alive. */
.title span.ch{display:inline-block;white-space:pre;transform-origin:50% 100%;
  background:linear-gradient(135deg,#6B5414 0%,#9C7A24 12%,#D4AF37 28%,#E8C766 42%,#F3E8CC 50%,#E8C766 58%,#D4AF37 72%,#9C7A24 88%,#6B5414 100%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:ch-rise .78s cubic-bezier(.2,1,.3,1) both, gold-flow 5s linear infinite;
  animation-delay:calc(.62s + var(--i) * 42ms), 0s}
@keyframes ch-rise{
  from{opacity:0;transform:translateY(.55em) rotateX(-72deg) scale(.94)}
  to  {opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .aurora i{animation:none!important}
  .title{animation:none!important}
  .title span.ch{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}
}

/* ===== STAGED ARRIVAL ==================================================== */
/* The screen used to present itself complete, with every element already in
   place and only ambient loops running. Now it ARRIVES: the hall lifts out of
   black, a shaft of light opens, the crest drops in and rings, and the wordmark
   assembles under it. It reads as a curtain going up rather than a page load.
   Timings are cumulative and deliberately tight -- the whole sequence is done
   in ~1.9s, and the hall is already visible by ~0.3s -- a visitor should never
   sit looking at a black rectangle wondering whether it loaded. */

/* 1 -- the hall, from black */
.bg-photo{animation:bg-zoom 20s ease-in-out infinite alternate, hall-in 1.35s cubic-bezier(.22,1,.36,1) both}
@keyframes hall-in{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:scale(1)}}

/* 2 -- the shaft of light widens as if the doors opened */
.bg-rays{animation:rays-rotate 60s linear infinite, shaft-open 1.9s cubic-bezier(.22,1,.36,1) .1s both}
@keyframes shaft-open{from{opacity:0;transform:scaleX(.35)}to{opacity:1;transform:scaleX(1)}}

/* 3 -- the crest descends and settles, with a ring that flares outward on
       impact. The overshoot is what gives it weight; without it the crest
       just appears at a smaller size. */
.crest-wrap{animation:crest-descend 1.25s cubic-bezier(.2,1.25,.3,1) .22s both}
@keyframes crest-descend{
  0%{opacity:0;transform:translateY(-46px) scale(.72)}
  62%{opacity:1;transform:translateY(6px) scale(1.05)}
  100%{opacity:1;transform:none}}
.crest-flare{position:absolute;left:50%;top:50%;width:22vh;height:22vh;max-width:230px;max-height:230px;
  translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:1;
  border:1px solid rgba(232,199,102,.75);
  animation:crest-flare 1.4s cubic-bezier(.16,1,.3,1) .8s both}
@keyframes crest-flare{
  0%{opacity:0;scale:.3}
  22%{opacity:.95}
  100%{opacity:0;scale:2.5}}

/* 4-7 -- the wordmark block, then the rule, then the promise, then the door.
   Each waits for the crest to land rather than racing it. */
.eyebrow{animation:rise-in .8s cubic-bezier(.22,1,.36,1) .82s both}
.divider{animation:rule-draw .9s cubic-bezier(.22,1,.36,1) 1.28s both}
.tagline{animation:rise-in .8s cubic-bezier(.22,1,.36,1) 1.42s both}
.enter-btn{animation:btn-shimmer 4s linear infinite, door-in .9s cubic-bezier(.2,1.3,.3,1) 1.58s both}
.loading-dots{animation:rise-in .7s ease 1.9s both}
@keyframes rise-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rule-draw{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes door-in{
  0%{opacity:0;transform:translateY(20px) scale(.94)}
  70%{opacity:1;transform:translateY(-3px) scale(1.02)}
  100%{opacity:1;transform:none}}

/* The frame draws itself in rather than being present from frame one. */
.gold-frame{animation:frame-glow 4s ease-in-out infinite, frame-in 1.5s cubic-bezier(.22,1,.36,1) .3s both}
@keyframes frame-in{from{opacity:0;clip-path:inset(46% 46% 46% 46%)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.corner-orn{animation:ornament-glow 5s ease-in-out infinite, orn-in 1s cubic-bezier(.2,1.3,.3,1) 1.05s both}
@keyframes orn-in{from{opacity:0;scale:.4;rotate:-18deg}to{opacity:.85;scale:1;rotate:0deg}}

/* The enter control leans toward the pointer before it is reached. */
.enter-btn{will-change:transform}
.enter-wrap{position:relative;display:inline-block;
  transform:translate3d(calc(var(--mgx,0) * 1px), calc(var(--mgy,0) * 1px), 0);
  transition:transform .5s cubic-bezier(.16,1,.3,1)}
.enter-wrap.near{transition:transform .18s cubic-bezier(.22,1,.36,1)}

/* A vignette keeps the eye in the centre where the crest is. Pure CSS, over
   the photo but under the content. */
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 85% at 50% 42%, transparent 34%, rgba(3,5,12,.55) 76%, rgba(2,3,8,.88) 100%)}

@media(prefers-reduced-motion:reduce){
  .bg-photo,.bg-rays,.crest-wrap,.eyebrow,.divider,.tagline,.enter-btn,
  .loading-dots,.gold-frame,.corner-orn{animation:none!important;opacity:1!important;
    transform:none!important;clip-path:none!important;scale:1!important;rotate:0deg!important}
  .crest-flare{display:none}
}
</style></head><body>
