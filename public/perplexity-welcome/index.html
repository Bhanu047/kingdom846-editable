<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom 846 — Royal Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   THE APPROACH
   ---------------------------------------------------------------------------
   Two earlier attempts got this wrong in opposite directions. The first was
   the hall photograph fading in -- nothing happened, so it read as a page
   load. The second put gates in front of it, which was worse: it hid the hall,
   and the hall was the only genuinely beautiful thing on the screen.

   The hall IS the asset, so nothing covers it. Instead the screen behaves like
   a camera in a room: a slow push that never resolves, light shafts that sweep
   and breathe, dust drifting through them, and five planes moving at different
   depths under the pointer. The crest descends into that room and lands.
   Entering pushes the camera THROUGH the arch.

   Nothing here is a static frame with animation applied on top -- every layer
   is always moving, which is the difference between a shot and a slideshow.
   ======================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --gold:#D4AF37; --gold-lit:#F7E8B8; --gold-pale:#FFF8E2; }
html, body { height: 100%; width: 100%; overflow: hidden; background: #04060C; }
body {
  color: var(--gold-lit);
  font-family: 'Spectral', Georgia, serif;
  --px: 0; --py: 0;   /* pointer parallax, -1..1 */
}

/* --- Layer 1: the room ---------------------------------------------------- */
/* The push never resolves. A camera that arrives and stops is a slideshow; one
   still creeping forward after thirty seconds is a shot. */
.room {
  position: fixed; inset: -8%;
  background: url('/assets/royal-bg.jpg') center 40%/cover no-repeat;
  transform: translate3d(calc(var(--px) * -18px), calc(var(--py) * -12px), 0);
  animation: room-in 2.6s cubic-bezier(.16,1,.3,1) both,
             room-push 42s ease-in-out 2.6s infinite alternate;
  will-change: transform;
}
@keyframes room-in   { from { opacity: 0; scale: 1.20 } to { opacity: 1; scale: 1.04 } }
@keyframes room-push { from { scale: 1.04 } to { scale: 1.15 } }

/* Warmth graded over the photograph so the room reads as candlelit rather
   than as a stock image. */
.grade {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(66% 52% at 50% 34%, rgba(255,226,158,.28), transparent 62%),
    linear-gradient(180deg, rgba(4,6,12,.62) 0%, rgba(4,6,12,.08) 34%, rgba(4,6,12,.28) 62%, rgba(3,4,10,.88) 100%);
}

/* --- Layer 2: the light --------------------------------------------------- */
/* Volumetric shafts from the high windows, two sets at different angles and
   speeds so the light never repeats a pattern you can catch. */
.shafts, .shafts-2 {
  position: fixed; inset: -30%; pointer-events: none; mix-blend-mode: screen;
  transform: translate3d(calc(var(--px) * 26px), calc(var(--py) * 14px), 0);
}
.shafts {
  background: repeating-linear-gradient(74deg,
    transparent 0 62px, rgba(255,232,176,.055) 62px 96px, transparent 96px 168px);
  animation: shaft-a 26s ease-in-out infinite alternate;
}
.shafts-2 {
  background: repeating-linear-gradient(101deg,
    transparent 0 90px, rgba(255,240,200,.04) 90px 130px, transparent 130px 240px);
  animation: shaft-b 37s ease-in-out infinite alternate;
}
@keyframes shaft-a { from { opacity:.55; translate:-3% -1% } to { opacity:1; translate:4% 2% } }
@keyframes shaft-b { from { opacity:.75; translate:3% 1% } to { opacity:.35; translate:-4% -2% } }

/* A slow bloom swelling behind the arch, like a fire out of frame. This is the
   single thing that makes the room feel occupied. */
.bloom {
  position: fixed; left: 50%; top: 34%; width: 74vmin; height: 74vmin;
  margin: -37vmin 0 0 -37vmin; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,224,150,.32), rgba(255,196,96,.09) 42%, transparent 70%);
  animation: bloom 9s ease-in-out infinite;
}
@keyframes bloom { 0%,100% { opacity:.5; scale:1 } 50% { opacity:1; scale:1.14 } }

/* --- Layer 3: the air ----------------------------------------------------- */
.motes { position: fixed; inset: 0; pointer-events: none; }
.mote {
  position: absolute; border-radius: 50%;
  background: rgba(255,236,186,.9); box-shadow: 0 0 6px rgba(255,220,150,.7);
  animation: mote linear infinite;
}
@keyframes mote {
  0%   { transform: translateY(0) translateX(0) scale(.6); opacity: 0 }
  14%  { opacity: var(--op) }
  86%  { opacity: var(--op) }
  100% { transform: translateY(-108vh) translateX(var(--drift)) scale(1.15); opacity: 0 }
}

/* --- Layer 4: the frame --------------------------------------------------- */
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(128% 92% at 50% 40%, transparent 26%, rgba(3,4,10,.55) 70%, rgba(2,3,7,.94) 100%);
  animation: vig 11s ease-in-out infinite;
}
@keyframes vig { 0%,100% { opacity:.94 } 50% { opacity:1 } }
.bar { position: fixed; left: 0; right: 0; height: 5vh; pointer-events: none; z-index: 20; }
.bar.t { top: 0;    background: linear-gradient(180deg, rgba(2,3,7,.9), transparent); }
.bar.b { bottom: 0; background: linear-gradient(0deg,   rgba(2,3,7,.92), transparent); }

/* Two gilt hairlines that draw in -- the only ornament, because the room is
   already ornate and anything more competes with it. */
.hair {
  position: fixed; left: 6vw; right: 6vw; height: 1px; z-index: 21; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.5) 22%, rgba(255,248,226,.82) 50%, rgba(212,175,55,.5) 78%, transparent);
  animation: hair 1.5s cubic-bezier(.22,1,.36,1) both;
}
.hair.t { top: 3.4vh; animation-delay: 1.15s }
.hair.b { bottom: 3.4vh; animation-delay: 1.3s }
@keyframes hair { from { opacity:0; transform: scaleX(0) } to { opacity:1; transform:none } }

/* --- The stage ------------------------------------------------------------ */
.stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5vh 5vw; text-align: center;
  transform: translate3d(calc(var(--px) * 6px), calc(var(--py) * 4px), 0);
}

/* The crest descends into the room and lands. The overshoot is the weight --
   without it the crest simply appears at a different size. */
.crest-wrap { position: relative; display: grid; place-items: center; }
.crest {
  position: relative; z-index: 2;
  height: 30vh; max-height: 300px; width: auto;
  filter: drop-shadow(0 18px 40px rgba(0,0,0,.95)) drop-shadow(0 0 26px rgba(255,214,130,.5));
  animation: crest-land 1.6s cubic-bezier(.2,1.2,.28,1) .3s both,
             crest-float 8s ease-in-out 1.9s infinite;
}
@keyframes crest-land {
  0%   { opacity: 0; transform: translateY(-16vh) scale(.5) }
  64%  { opacity: 1; transform: translateY(1.4vh) scale(1.06) }
  100% { opacity: 1; transform: none }
}
@keyframes crest-float { 0%,100% { translate: 0 0 } 50% { translate: 0 -10px } }

.halo {
  position: absolute; width: 46vh; height: 46vh; max-width: 440px; max-height: 440px;
  border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,226,150,.30), rgba(212,175,55,.09) 44%, transparent 70%);
  animation: halo 5.4s ease-in-out infinite;
}
@keyframes halo { 0%,100% { opacity:.55; scale:1 } 50% { opacity:1; scale:1.1 } }
.flare {
  position: absolute; width: 34vh; height: 34vh; max-width: 340px; max-height: 340px;
  border-radius: 50%; pointer-events: none; border: 2px solid rgba(255,248,226,.85);
  animation: flare 1.5s cubic-bezier(.16,1,.3,1) 1.28s both;
}
@keyframes flare { 0% { opacity:0; scale:.34 } 22% { opacity:.95 } 100% { opacity:0; scale:2.5 } }

/* --- Type ----------------------------------------------------------------- */
.eyebrow {
  font-family: 'Cinzel', Georgia, serif;
  font-size: clamp(9px, 1.5vw, 11.5px); letter-spacing: .56em; text-transform: uppercase;
  color: rgba(255,232,170,.78); margin: 2.6vh 0 .7rem; text-indent: .56em;
  animation: up 1s cubic-bezier(.22,1,.36,1) 1.5s both;
}
.wordmark {
  font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
  font-weight: 900; line-height: .95;
  font-size: clamp(2.7rem, 9vw, 6.2rem); letter-spacing: .03em;
}
/* Each glyph carries its own ramp: a parent background-clip cannot paint
   through per-character transforms, which is what made an earlier version of
   this title render completely invisible. */
.wordmark .ch {
  display: inline-block; white-space: pre;
  background: linear-gradient(172deg, #7A5C13 0%, #C9A238 16%, #F7E8B8 38%, #FFFDF4 50%, #EBCE76 62%, #C9A238 80%, #6E5412 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,.92));
  animation: strike .95s cubic-bezier(.16,1.1,.28,1) both;
  animation-delay: calc(1.62s + var(--i) * 52ms);
}
@keyframes strike {
  0%   { opacity: 0; transform: translateY(-.5em) scale(1.7) rotateX(62deg) }
  60%  { opacity: 1; transform: translateY(.05em) scale(.98) rotateX(0) }
  100% { opacity: 1; transform: none }
}
.rule {
  display: flex; align-items: center; justify-content: center; gap: 1rem;
  margin: 1.2rem auto .9rem; width: min(72%, 460px);
  animation: ruleIn 1.2s cubic-bezier(.22,1,.36,1) 2.35s both;
}
.rule i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.75)); }
.rule i + i { background: linear-gradient(270deg, transparent, rgba(212,175,55,.75)); }
.rule span { color: rgba(255,232,170,.9); font-size: 12px; letter-spacing: .34em; }
@keyframes ruleIn { from { opacity:0; transform: scaleX(.15) } to { opacity:1; transform:none } }

.tagline {
  font-style: italic; font-size: clamp(.9rem, 2vw, 1.16rem);
  color: rgba(255,232,170,.72); letter-spacing: .03em;
  text-shadow: 0 2px 14px rgba(0,0,0,.9);
  animation: up 1s cubic-bezier(.22,1,.36,1) 2.55s both;
}
@keyframes up { from { opacity:0; transform: translateY(16px) } to { opacity:1; transform:none } }

/* --- The way in ----------------------------------------------------------- */
.enter-wrap {
  margin-top: 2.4rem; display: inline-block; position: relative;
  animation: doorIn 1.1s cubic-bezier(.2,1.3,.3,1) 2.75s both;
  transform: translate3d(calc(var(--mgx,0) * 1px), calc(var(--mgy,0) * 1px), 0);
  transition: transform .5s cubic-bezier(.16,1,.3,1);
}
.enter-wrap.near { transition: transform .16s cubic-bezier(.22,1,.36,1); }
@keyframes doorIn { 0% { opacity:0; transform: translateY(24px) scale(.92) } 70% { opacity:1; transform: translateY(-3px) scale(1.02) } 100% { opacity:1; transform:none } }
.enter {
  position: relative; cursor: pointer; border: 0; overflow: hidden;
  display: inline-flex; align-items: center; gap: .9rem;
  padding: 17px 46px; border-radius: 999px;
  font-family: 'Cinzel', Georgia, serif; font-size: clamp(11px, 1.7vw, 13.5px);
  font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #150F02;
  background:
    linear-gradient(180deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.06) 26%, rgba(255,255,255,0) 48%, rgba(0,0,0,0) 54%, rgba(0,0,0,.22) 100%),
    linear-gradient(96deg, #8A6A1C 0%, #D4AF37 18%, #F7E8B8 42%, #FFFDF2 52%, #E8C766 64%, #C9A238 84%, #8A6A1C 100%);
  background-size: auto, 230% auto;
  box-shadow: 0 0 0 1px rgba(90,68,14,.9), 0 2px 0 rgba(255,255,255,.34) inset, 0 6px 14px -4px rgba(0,0,0,.7), 0 16px 30px -14px rgba(0,0,0,.85);
  animation: sheen 6s ease-in-out infinite;
  transition: box-shadow .35s ease, filter .35s ease;
}
@keyframes sheen { 0%,100% { background-position: 0 0, 0% center } 50% { background-position: 0 0, 100% center } }
.enter:hover  { filter: brightness(1.06); box-shadow: 0 0 0 1px rgba(120,92,20,.95), 0 2px 0 rgba(255,255,255,.42) inset, 0 10px 20px -5px rgba(0,0,0,.72), 0 22px 40px -18px rgba(0,0,0,.9); transform: translateY(-1px); }
.enter:active { transform: translateY(1px) scale(.985); }
.enter .ring  { width: 21px; height: 21px; border-radius: 50%; border: 2.5px solid rgba(21,15,2,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.enter:focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 4px; }

/* --- Entering ------------------------------------------------------------- */
/* The camera pushes THROUGH the arch: the room rushes past, the light blooms
   out to white-gold, the stage falls away. It reads as walking in rather than
   as a page dissolving. */
body.entering .room     { animation: none; scale: 1.9; transition: scale 2.2s cubic-bezier(.55,0,.2,1); }
body.entering .shafts,
body.entering .shafts-2 { animation: none; opacity: 0; transition: opacity 1.2s ease; }
body.entering .bloom    { animation: none; scale: 5; opacity: 1; transition: scale 2.2s cubic-bezier(.55,0,.2,1), opacity 1.6s ease; }
body.entering .stage    { opacity: 0; scale: 1.35; transition: opacity .85s ease, scale 1.9s cubic-bezier(.55,0,.2,1); }
body.entering .vignette { opacity: 0; transition: opacity 1.3s ease; }
body.entering .hair,
body.entering .bar      { opacity: 0; transition: opacity .7s ease; }
.whiteout {
  position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 38%, #FFF6DC, #FFE6A8 34%, rgba(255,214,130,0) 72%);
}
body.entering .whiteout { opacity: 1; transition: opacity 1.5s ease .7s; }

@media (max-width: 620px) {
  .crest { height: 22vh }
  .enter { padding: 15px 34px; letter-spacing: .2em }
  .hair  { left: 4vw; right: 4vw }
}

@media (prefers-reduced-motion: reduce) {
  .room, .shafts, .shafts-2, .bloom, .vignette, .halo, .flare, .crest,
  .eyebrow, .wordmark .ch, .rule, .tagline, .enter-wrap, .enter, .hair {
    animation: none !important; opacity: 1 !important; transform: none !important; scale: 1 !important;
  }
  .wordmark .ch { -webkit-text-fill-color: #EBCE76; color: #EBCE76; background: none; filter: none }
  .flare, .motes { display: none }
  body.entering .room, body.entering .bloom, body.entering .stage { transition-duration: .01ms !important }
}
</style>
</head>
<body>

<div class="room"     aria-hidden="true"></div>
<div class="grade"    aria-hidden="true"></div>
<div class="shafts"   aria-hidden="true"></div>
<div class="shafts-2" aria-hidden="true"></div>
<div class="bloom"    aria-hidden="true"></div>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="bar t"  aria-hidden="true"></div>
<div class="bar b"  aria-hidden="true"></div>
<div class="hair t" aria-hidden="true"></div>
<div class="hair b" aria-hidden="true"></div>

<div class="stage">
  <div class="crest-wrap">
    <div class="halo"  aria-hidden="true"></div>
    <div class="flare" aria-hidden="true"></div>
    <img class="crest" src="/assets/crest-846.png" alt="Kingdom 846 royal crest">
  </div>
  <div class="eyebrow">One Crown &middot; Four Alliances</div>
  <h1 class="wordmark" id="wordmark">KINGDOM 846</h1>
  <div class="rule" aria-hidden="true"><i></i><span>&#10022;</span><i></i></div>
  <p class="tagline">Where legends are forged in fire and crowned in gold</p>
  <span class="enter-wrap" id="enterWrap">
    <button class="enter" id="enter" type="button"><span class="ring" aria-hidden="true"></span>Enter the Realm</button>
  </span>
</div>

<div class="whiteout" aria-hidden="true"></div>
<audio id="toll" preload="auto"><source src="/assets/gate-toll.wav" type="audio/wav"></audio>

<script>
(function () {
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Wordmark: one span per glyph, indexed so the CSS can stagger the strike. */
  (function () {
    var el = document.getElementById('wordmark');
    if (!el) return;
    var text = el.textContent;
    el.textContent = '';
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.style.setProperty('--i', i);
      s.textContent = text[i];
      el.appendChild(s);
    }
    el.setAttribute('aria-label', text);
  })();

  /* Dust in the shafts. 34 divs on CSS animations -- no rAF loop, so this
     costs nothing on a phone. */
  (function () {
    if (reduced) return;
    var host = document.getElementById('motes');
    for (var i = 0; i < 34; i++) {
      var m = document.createElement('div');
      var size = 1.4 + Math.random() * 3.4;
      m.className = 'mote';
      m.style.width = m.style.height = size.toFixed(1) + 'px';
      m.style.left = (Math.random() * 100).toFixed(2) + '%';
      m.style.bottom = '-14px';
      m.style.setProperty('--drift', (Math.random() * 150 - 75).toFixed(0) + 'px');
      m.style.setProperty('--op', (0.22 + Math.random() * 0.55).toFixed(2));
      m.style.animationDuration = (13 + Math.random() * 17).toFixed(1) + 's';
      m.style.animationDelay = (-Math.random() * 24).toFixed(1) + 's';
      host.appendChild(m);
    }
  })();

  /* Parallax. One listener writing two custom properties; every layer reads
     them at its own depth, so five planes move for the cost of one handler
     and nothing re-renders. */
  (function () {
    if (reduced || matchMedia('(hover: none)').matches) return;
    var frame = 0, x = 0, y = 0;
    addEventListener('pointermove', function (e) {
      x = (e.clientX / innerWidth - 0.5) * 2;
      y = (e.clientY / innerHeight - 0.5) * 2;
      if (frame) return;
      frame = requestAnimationFrame(function () {
        frame = 0;
        document.body.style.setProperty('--px', x.toFixed(3));
        document.body.style.setProperty('--py', y.toFixed(3));
      });
    }, { passive: true });
  })();

  /* The control leans toward the cursor before it is reached. */
  (function () {
    var w = document.getElementById('enterWrap');
    if (!w || reduced || matchMedia('(hover: none)').matches) return;
    var frame = 0, px = 0, py = 0;
    addEventListener('pointermove', function (e) {
      px = e.clientX; py = e.clientY;
      if (frame) return;
      frame = requestAnimationFrame(function () {
        frame = 0;
        var r = w.getBoundingClientRect();
        var dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        var d = Math.hypot(dx, dy), reach = 135 + r.width / 2;
        if (d < reach) {
          var k = (1 - d / reach) * 0.3;
          w.classList.add('near');
          w.style.setProperty('--mgx', (dx * k).toFixed(2));
          w.style.setProperty('--mgy', (dy * k).toFixed(2));
        } else {
          w.classList.remove('near');
          w.style.setProperty('--mgx', '0'); w.style.setProperty('--mgy', '0');
        }
      });
    }, { passive: true });
  })();

  /* The toll fires on the click rather than on load: browsers block autoplay
     until the visitor interacts, so a load-time sound is either swallowed or
     arrives late over a screen that has already settled. */
  var toll = document.getElementById('toll');
  var entered = false;
  function enterRealm() {
    if (entered) return;
    entered = true;
    if (toll) {
      try { toll.currentTime = 0; } catch (e) {}
      toll.volume = 0.6;
      var pr = toll.play();
      if (pr && pr.catch) pr.catch(function () {});
    }
    document.body.classList.add('entering');
    setTimeout(function () {
      parent.postMessage({ type: 'k846-enter-realm' }, location.origin);
    }, reduced ? 120 : 2000);
  }

  document.getElementById('enter').addEventListener('click', enterRealm);
  addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterRealm(); }
  });
})();
</script>
</body>
</html>
