<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom 846 — Royal Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   THE GATES
   ---------------------------------------------------------------------------
   The previous welcome screen was a photograph that faded in. However much
   ornament sat on top of it, nothing HAPPENED -- and a fade is the one
   transition every website already uses, so it reads as a page load rather
   than as an arrival.

   This is built around a single event instead: the realm is behind closed
   gates, and entering opens them. The gates are real objects -- they have
   thickness, filigree, rivets and a lit meeting edge -- and they swing on
   their outer hinges in 3D, so the light from behind widens across the room
   as they part. The crest is the seal that holds them shut, and it breaks
   before they move.

   Everything is drawn in CSS and inline SVG. The only external asset is the
   crest and the hall photograph, both already in the project.
   ======================================================================== */

* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold:      #D4AF37;
  --gold-lit:  #F7E8B8;
  --gold-deep: #8A6A1C;
  --gold-dark: #4A3A10;
  --iron:      #12100C;
  --iron-lit:  #2A2419;
}
html, body { height: 100%; width: 100%; overflow: hidden; background: #05070E; }
body {
  color: var(--gold-lit);
  font-family: 'Spectral', Georgia, serif;
  perspective: 1700px;
  perspective-origin: 50% 46%;
}

/* --- What lies beyond ---------------------------------------------------- */
/* The hall sits behind the gates and is only ever glimpsed until they open,
   so it is deliberately over-bright: it has to read as light SOURCE, not as a
   background image. */
.beyond {
  position: fixed; inset: 0; z-index: 0;
  background: url('/assets/royal-bg.jpg') center 38%/cover no-repeat;
  transform: scale(1.16);
  filter: brightness(1.5) saturate(1.15);
}
.beyond-wash {
  position: fixed; inset: 0; z-index: 1;
  background:
    radial-gradient(58% 46% at 50% 44%, rgba(255,238,190,.60), rgba(255,214,130,.16) 42%, transparent 70%),
    linear-gradient(180deg, rgba(5,7,14,.55), rgba(5,7,14,.20) 40%, rgba(5,7,14,.80));
}
/* The shaft that spills through the opening join. Scales with the gates. */
.seam-light {
  position: fixed; left: 50%; top: 0; bottom: 0; width: 46vw; z-index: 2;
  translate: -50% 0; pointer-events: none;
  background: radial-gradient(closest-side at 50% 44%, rgba(255,240,200,.85), rgba(255,220,150,.28) 34%, transparent 72%);
  opacity: 0; transform: scaleX(.06);
  transition: opacity 1.5s ease, transform 2.4s cubic-bezier(.7,0,.2,1);
}
body.opening .seam-light { opacity: 1; transform: scaleX(1); }

/* --- The gates ----------------------------------------------------------- */
/* First attempt made these SOLID dark panels, and that was the mistake: it hid
   the hall completely, so the screen lost everything that made the old one
   feel rich and became a dark fence with a badge on it.
   Real palace gates are OPENWORK -- gilded bars with air between them -- and
   the light behind is the whole point. These are transparent between the bars,
   so the hall glows through the gate and the gold is lit from behind rather
   than painted on black. */
.gates { position: fixed; inset: 0; z-index: 5; transform-style: preserve-3d; }
.gate {
  position: absolute; top: 0; bottom: -2%; width: 50.4%;
  /* Gilded vertical bars on a 58px pitch. Every stop between bars is fully
     transparent -- that is what lets the hall through. Each bar is built from
     five stops so it reads as a round rod catching light down one side. */
  background-image: repeating-linear-gradient(90deg,
      transparent 0 40px,
      rgba(0,0,0,.6)       40px 41px,
      #6B5414              41px 43px,
      #C9A238              43px 46px,
      #FFF6DA              46px 48px,
      #A8842A              48px 51px,
      #4A3A10              51px 53px,
      rgba(0,0,0,.55)      53px 54px,
      transparent          54px 92px);
  will-change: transform;
  transition: transform 2.5s cubic-bezier(.62,.02,.2,1), filter 2.5s ease;
}
.gate-l { left: 0;  transform-origin: left center;  }
.gate-r { right: 0; transform-origin: right center; }
.gate-l { transform: rotateY(2.2deg); }
.gate-r { transform: rotateY(-2.2deg); }
body.opening .gate-l { transform: rotateY(-104deg); filter: brightness(.4); }
body.opening .gate-r { transform: rotateY(104deg);  filter: brightness(.4); }

/* Spear-point finials along the top rail. Same pitch as the bars so every
   point sits on one. */
.finials {
  position: absolute; left: 0; right: 0; top: 0; height: 34px;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 22px,
      transparent 22px 23px, transparent 23px 36px, transparent 36px 58px);
}
.finial {
  position: absolute; top: 0; width: 14px; height: 30px;
  translate: -50% 0;
  background: linear-gradient(180deg, #FFF6DA 0%, #E8C766 26%, #C9A238 58%, #6B5414 100%);
  clip-path: polygon(50% 0%, 100% 42%, 74% 42%, 74% 100%, 26% 100%, 26% 42%, 0 42%);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.75));
}

/* The lit meeting edge -- the single detail that sells these as metal. */
.gate-edge { position: absolute; top: 0; bottom: 0; width: 16px; }
.gate-l .gate-edge {
  right: 0;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.42) 34%, #E8C766 74%, #FFF8E2 100%);
}
.gate-r .gate-edge {
  left: 0;
  background: linear-gradient(270deg, transparent, rgba(212,175,55,.42) 34%, #E8C766 74%, #FFF8E2 100%);
}

/* Heavy rails. Solid gold across the openwork, which is what braces a real
   gate and gives the eye somewhere to rest between the bars. */
.brace {
  position: absolute; left: 0; right: 0; height: 3vh; min-height: 20px;
  background: linear-gradient(180deg,
    #FFF6DA 0%, #E8C766 16%, #C9A238 44%, #8A6A1C 74%, #3E3009 100%);
  box-shadow: 0 3px 10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.4);
}
.brace.b1 { top: 15%; }
.brace.b2 { top: 46%; }
.brace.b3 { top: 88%; }
.rivet {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #FFFBEC, #E8C766 44%, #6B5414 100%);
  box-shadow: 0 1px 3px rgba(0,0,0,.85);
  top: 50%; translate: 0 -50%;
}

/* Scrollwork, one flourish per gate, mirrored. Bright now rather than a dim
   line, because it is gilding catching the light from behind. */
.gate-orn {
  position: absolute; top: 50%; width: 48%; aspect-ratio: 1; translate: 0 -50%;
  opacity: .92; pointer-events: none;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,.8));
}
.gate-l .gate-orn { right: 5%; }
.gate-r .gate-orn { left: 5%; transform: scaleX(-1); }

/* --- The seal ------------------------------------------------------------ */
/* The crest straddles the join and reads as what is holding the gates shut.
   It breaks BEFORE they move, so the opening has a cause. */
.seal {
  position: fixed; left: 50%; top: 40%; z-index: 8;
  translate: -50% -50%;
  display: grid; place-items: center;
  transition: transform 1.05s cubic-bezier(.6,-0.4,.3,1.5), opacity .9s ease;
}
.seal-ring {
  position: absolute; width: 38vh; height: 38vh; max-width: 372px; max-height: 372px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,.5);
  box-shadow: 0 0 40px rgba(212,175,55,.28), inset 0 0 30px rgba(212,175,55,.18);
  animation: seal-turn 34s linear infinite;
}
.seal-ring::before {
  content: ""; position: absolute; inset: 7%;
  border-radius: 50%; border: 1px dashed rgba(232,199,102,.32);
}
@keyframes seal-turn { to { rotate: 360deg } }
.seal-glow {
  position: absolute; width: 50vh; height: 50vh; max-width: 480px; max-height: 480px;
  border-radius: 50%; pointer-events: none;
  /* Dark core under the warm halo: the crest has to sit on something, or the
     bars behind it read straight through the shield. */
  background:
    radial-gradient(circle, rgba(4,6,12,.90) 0%, rgba(4,6,12,.55) 30%, transparent 56%),
    radial-gradient(circle, rgba(255,226,150,.40) 12%, rgba(212,175,55,.13) 48%, transparent 74%);
  animation: seal-breathe 4.6s ease-in-out infinite;
}
@keyframes seal-breathe { 0%,100% { opacity:.6; scale:1 } 50% { opacity:1; scale:1.09 } }
.crest {
  position: relative; z-index: 2;
  height: 31vh; max-height: 310px; width: auto;
  filter: drop-shadow(0 14px 30px rgba(0,0,0,.95)) drop-shadow(0 0 18px rgba(232,199,102,.45));
  animation: crest-hover 7s ease-in-out infinite;
}
@keyframes crest-hover { 0%,100% { translate: 0 0 } 50% { translate: 0 -9px } }
/* The break: the seal flares, lifts and dissolves. */
body.opening .seal { transform: translateY(-16px) scale(1.14); opacity: 0; }
.seal-crack {
  position: absolute; width: 38vh; height: 38vh; max-width: 372px; max-height: 372px;
  border-radius: 50%; border: 2px solid rgba(255,244,214,.9); pointer-events: none;
  opacity: 0;
}
body.opening .seal-crack { animation: seal-crack .85s cubic-bezier(.16,1,.3,1) both; }
@keyframes seal-crack { 0% { opacity:.95; scale:1 } 100% { opacity:0; scale:2.6 } }

/* --- The plate ----------------------------------------------------------- */
/* Wordmark and controls sit on the gates, below the seal, so they belong to
   the object rather than floating over a photograph. */
.plate::before {
  content: ""; position: absolute; inset: -8% -12% -14% -12%; z-index: -1;
  border-radius: 50%;
  /* Text over openwork is unreadable -- the bars run straight through the
     letterforms. This is the shadow the gate would cast behind a mounted
     plate, and it gives the wordmark a ground to sit on without adding a
     visible box. */
  background: radial-gradient(58% 52% at 50% 46%, rgba(4,6,12,.94), rgba(4,6,12,.72) 52%, transparent 78%);
}
.plate {
  position: fixed; left: 50%; top: 70%; z-index: 9;
  translate: -50% 0; width: min(92vw, 720px);
  text-align: center;
  transition: opacity .7s ease, transform .9s cubic-bezier(.6,0,.3,1);
}
body.opening .plate { opacity: 0; transform: translateY(26px); }

.eyebrow {
  font-family: 'Cinzel', Georgia, serif;
  font-size: clamp(9px, 1.5vw, 11px); letter-spacing: .52em; text-transform: uppercase;
  color: rgba(212,175,55,.72); margin-bottom: .85rem;
  animation: fade-up .9s cubic-bezier(.22,1,.36,1) .55s both;
}
.wordmark {
  font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
  font-weight: 900; line-height: .96;
  font-size: clamp(2.6rem, 8.2vw, 5.6rem);
  letter-spacing: .04em;
}
/* Each letter is struck separately so the wordmark assembles rather than
   fades, and each carries its own gold ramp -- a parent background-clip would
   not paint through the per-character transforms. */
.wordmark .ch {
  display: inline-block; white-space: pre;
  background: linear-gradient(168deg, #7C5F16 0%, #C9A238 18%, #F7E8B8 42%, #FFFDF2 50%, #EBCE76 60%, #C9A238 76%, #6E541296 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 3px 10px rgba(0,0,0,.85));
  animation: strike .8s cubic-bezier(.18,1.15,.3,1) both;
  animation-delay: calc(.72s + var(--i) * 48ms);
}
@keyframes strike {
  0%   { opacity: 0; transform: translateY(-.42em) scale(1.5) rotateX(52deg); }
  62%  { opacity: 1; transform: translateY(.04em) scale(.985) rotateX(0); }
  100% { opacity: 1; transform: none; }
}
.rule {
  display: flex; align-items: center; justify-content: center; gap: .9rem;
  margin: 1.05rem auto .8rem; width: min(80%, 420px);
  animation: rule-open 1.1s cubic-bezier(.22,1,.36,1) 1.5s both;
}
.rule i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.65)); }
.rule i + i { background: linear-gradient(270deg, transparent, rgba(212,175,55,.65)); }
.rule span { color: rgba(232,199,102,.85); font-size: 11px; letter-spacing: .3em; }
@keyframes rule-open { from { opacity:0; transform: scaleX(.2) } to { opacity:1; transform: none } }

.tagline {
  font-style: italic; font-size: clamp(.86rem, 1.9vw, 1.08rem);
  color: rgba(232,199,102,.62); letter-spacing: .03em;
  animation: fade-up .9s cubic-bezier(.22,1,.36,1) 1.72s both;
}
@keyframes fade-up { from { opacity: 0; transform: translateY(15px) } to { opacity: 1; transform: none } }

/* --- The handle ---------------------------------------------------------- */
/* A ring pull rather than a rectangle: it is the thing you would actually
   take hold of to open a gate. */
.handle-wrap {
  margin-top: 1.9rem; display: inline-block; position: relative;
  animation: fade-up 1s cubic-bezier(.2,1.3,.3,1) 1.95s both;
  transform: translate3d(calc(var(--mgx,0) * 1px), calc(var(--mgy,0) * 1px), 0);
  transition: transform .5s cubic-bezier(.16,1,.3,1);
}
.handle-wrap.near { transition: transform .16s cubic-bezier(.22,1,.36,1); }
.handle {
  position: relative; cursor: pointer; border: 0; background: none;
  display: inline-flex; align-items: center; gap: .85rem;
  padding: 15px 40px 15px 22px;
  font-family: 'Cinzel', Georgia, serif;
  font-size: clamp(11px, 1.6vw, 13px); font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase; color: #150F02;
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.44) 0%, rgba(255,255,255,.06) 26%, rgba(255,255,255,0) 48%, rgba(0,0,0,0) 54%, rgba(0,0,0,.20) 100%),
    linear-gradient(96deg, #8A6A1C 0%, #D4AF37 20%, #F7E8B8 44%, #FFFDF2 52%, #E8C766 64%, #C9A238 82%, #8A6A1C 100%);
  background-size: auto, 220% auto;
  box-shadow:
    0 2px 0 rgba(255,255,255,.28) inset,
    0 10px 26px -8px rgba(212,175,55,.75),
    0 3px 10px rgba(0,0,0,.6);
  animation: handle-sheen 5.5s ease-in-out infinite;
  transition: box-shadow .35s ease, filter .35s ease;
}
@keyframes handle-sheen { 0%,100% { background-position: 0 0, 0% center } 50% { background-position: 0 0, 100% center } }
.handle:hover { filter: brightness(1.07); box-shadow: 0 2px 0 rgba(255,255,255,.34) inset, 0 16px 38px -8px rgba(212,175,55,.9), 0 3px 10px rgba(0,0,0,.6); }
.handle:active { transform: translateY(1px) scale(.986); }
.handle .ring {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2.5px solid rgba(21,15,2,.62);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
}
.handle:focus-visible { outline: 2px solid #FFF3CE; outline-offset: 4px; }

/* --- Atmosphere ---------------------------------------------------------- */
.motes { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.mote {
  position: absolute; border-radius: 50%;
  background: rgba(255,232,170,.85);
  animation: mote-rise linear infinite;
}
@keyframes mote-rise {
  0%   { transform: translateY(0) translateX(0); opacity: 0 }
  12%  { opacity: var(--op) }
  88%  { opacity: var(--op) }
  100% { transform: translateY(-104vh) translateX(var(--drift)); opacity: 0 }
}
/* A vignette keeps the eye on the seal. */
.vignette {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(122% 88% at 50% 44%, transparent 30%, rgba(2,3,8,.62) 74%, rgba(1,2,5,.94) 100%);
}

/* The whole scene pushes back very slightly as the gates open, which reads as
   the viewer stepping through rather than the gates flying off. */
.scene { transition: transform 2.5s cubic-bezier(.62,.02,.2,1), opacity .7s ease 1.9s; }
body.opening .scene { transform: translateZ(190px); opacity: 0; }

@media (max-width: 620px) {
  .crest { height: 22vh }
  .plate { top: 66% }
  .gate-orn { display: none }
  .handle { padding: 13px 30px 13px 18px; letter-spacing: .2em }
}

@media (prefers-reduced-motion: reduce) {
  .gate, .seal, .plate, .scene, .seam-light { transition-duration: .01ms !important }
  .seal-ring, .seal-glow, .crest, .handle, .mote,
  .eyebrow, .wordmark .ch, .rule, .tagline, .handle-wrap { animation: none !important; opacity: 1 !important; transform: none !important }
  .wordmark .ch { -webkit-text-fill-color: #E8C766; color: #E8C766; background: none }
}
</style>
</head>
<body>

<div class="beyond" aria-hidden="true"></div>
<div class="beyond-wash" aria-hidden="true"></div>
<div class="seam-light" aria-hidden="true"></div>

<div class="scene">
  <div class="gates" aria-hidden="true">
    <div class="gate gate-l">
      <div class="finials"></div>
      <div class="brace b1"></div><div class="brace b2"></div><div class="brace b3"></div>
      <svg class="gate-orn" viewBox="0 0 200 200" fill="none" stroke="url(#gilt)" stroke-linecap="round"><defs><linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF6DA"/><stop offset="38%" stop-color="#E8C766"/><stop offset="70%" stop-color="#C9A238"/><stop offset="100%" stop-color="#8A6A1C"/></linearGradient></defs>
        <path d="M100 18 C58 18 30 52 30 96 C30 140 60 176 100 182" stroke-width="2" opacity=".55"/>
        <path d="M100 40 C70 40 50 66 50 96 C50 128 72 154 100 160" stroke-width="1.2" opacity=".4"/>
        <path d="M100 96 C76 96 64 82 64 70 C64 58 74 52 82 56 C90 60 88 72 78 74" stroke-width="1.5" opacity=".6"/>
        <path d="M100 96 C76 96 64 110 64 122 C64 134 74 140 82 136 C90 132 88 120 78 118" stroke-width="1.5" opacity=".6"/>
        <circle cx="100" cy="96" r="7" stroke-width="1.6" opacity=".7"/>
        <circle cx="100" cy="96" r="2.6" fill="#FFF8E2" stroke="none" opacity=".95"/>
      </svg>
      <div class="gate-edge"></div>
    </div>
    <div class="gate gate-r">
      <div class="finials"></div>
      <div class="brace b1"></div><div class="brace b2"></div><div class="brace b3"></div>
      <svg class="gate-orn" viewBox="0 0 200 200" fill="none" stroke="url(#gilt)" stroke-linecap="round">
        <path d="M100 18 C58 18 30 52 30 96 C30 140 60 176 100 182" stroke-width="2" opacity=".55"/>
        <path d="M100 40 C70 40 50 66 50 96 C50 128 72 154 100 160" stroke-width="1.2" opacity=".4"/>
        <path d="M100 96 C76 96 64 82 64 70 C64 58 74 52 82 56 C90 60 88 72 78 74" stroke-width="1.5" opacity=".6"/>
        <path d="M100 96 C76 96 64 110 64 122 C64 134 74 140 82 136 C90 132 88 120 78 118" stroke-width="1.5" opacity=".6"/>
        <circle cx="100" cy="96" r="7" stroke-width="1.6" opacity=".7"/>
        <circle cx="100" cy="96" r="2.6" fill="#FFF8E2" stroke="none" opacity=".95"/>
      </svg>
      <div class="gate-edge"></div>
    </div>
  </div>

  <div class="motes" id="motes" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="seal">
    <div class="seal-glow" aria-hidden="true"></div>
    <div class="seal-ring" aria-hidden="true"></div>
    <div class="seal-crack" aria-hidden="true"></div>
    <img class="crest" src="/assets/crest-846.png" alt="Kingdom 846 royal crest">
  </div>

  <div class="plate">
    <div class="eyebrow">One Crown &middot; Four Alliances</div>
    <h1 class="wordmark" id="wordmark">KINGDOM 846</h1>
    <div class="rule" aria-hidden="true"><i></i><span>&#10022;</span><i></i></div>
    <p class="tagline">Where legends are forged in fire and crowned in gold</p>
    <span class="handle-wrap" id="handleWrap">
      <button class="handle" id="enter" type="button">
        <span class="ring" aria-hidden="true"></span>
        Open the Gates
      </button>
    </span>
  </div>
</div>

<audio id="toll" preload="auto"><source src="/assets/gate-toll.wav" type="audio/wav"></audio>

<script>
(function () {
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Wordmark: one span per character, indexed so the CSS can stagger them. */
  (function () {
    var el = document.getElementById('wordmark');
    if (!el) return;
    var text = el.textContent;
    el.textContent = '';
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.style.setProperty('--i', i);
      s.textContent = text[i];
      el.appendChild(s);
    }
    el.setAttribute('aria-label', text);
  })();

  /* Rivets on the rails, and a spear point on top of every bar. Both are
     generated rather than hand-placed so they stay aligned to the 58px bar
     pitch at any viewport width -- hand-placed ornament drifts out of
     register the moment the window is resized. */
  (function () {
    if (reduced) return;
    var braces = document.querySelectorAll('.brace');
    for (var b = 0; b < braces.length; b++) {
      for (var k = 1; k <= 6; k++) {
        var r = document.createElement('span');
        r.className = 'rivet';
        r.style.left = (k * 100 / 7).toFixed(2) + '%';
        braces[b].appendChild(r);
      }
    }
    var PITCH = 92, OFFSET = 47;
    document.querySelectorAll('.finials').forEach(function (rail) {
      var w = rail.getBoundingClientRect().width || innerWidth / 2;
      rail.innerHTML = '';
      for (var x = OFFSET; x < w; x += PITCH) {
        var f = document.createElement('span');
        f.className = 'finial';
        f.style.left = x + 'px';
        rail.appendChild(f);
      }
    });
  })();

  /* Dust in the light. Cheap: 26 divs on CSS animations, no rAF loop. */
  (function () {
    if (reduced) return;
    var host = document.getElementById('motes');
    for (var i = 0; i < 26; i++) {
      var m = document.createElement('div');
      var size = 1.5 + Math.random() * 3;
      m.className = 'mote';
      m.style.width = m.style.height = size.toFixed(1) + 'px';
      m.style.left = (Math.random() * 100).toFixed(2) + '%';
      m.style.bottom = '-12px';
      m.style.setProperty('--drift', (Math.random() * 130 - 65).toFixed(0) + 'px');
      m.style.setProperty('--op', (0.25 + Math.random() * 0.5).toFixed(2));
      m.style.animationDuration = (11 + Math.random() * 15).toFixed(1) + 's';
      m.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
      host.appendChild(m);
    }
  })();

  /* The handle leans toward the cursor before it is reached. */
  (function () {
    var w = document.getElementById('handleWrap');
    if (!w || reduced || matchMedia('(hover: none)').matches) return;
    var frame = 0, px = 0, py = 0;
    addEventListener('pointermove', function (e) {
      px = e.clientX; py = e.clientY;
      if (frame) return;
      frame = requestAnimationFrame(function () {
        frame = 0;
        var r = w.getBoundingClientRect();
        var dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
        var d = Math.hypot(dx, dy), reach = 130 + r.width / 2;
        if (d < reach) {
          var k = (1 - d / reach) * 0.3;
          w.classList.add('near');
          w.style.setProperty('--mgx', (dx * k).toFixed(2));
          w.style.setProperty('--mgy', (dy * k).toFixed(2));
        } else {
          w.classList.remove('near');
          w.style.setProperty('--mgx', '0');
          w.style.setProperty('--mgy', '0');
        }
      });
    }, { passive: true });
  })();

  /* The toll. Deliberately tied to the gates OPENING rather than played on
     load: browsers block autoplay until the visitor interacts, so a load-time
     sound is either silently swallowed or fires late over a screen that has
     already settled. Firing it on the click means it always lands, and it
     lands on the thing it is describing.

     The sound itself is a synthesised bronze bell -- two strikes a fifth
     apart -- over a D major brass swell, with a short metallic transient at
     the very top so it starts with a mechanism rather than fading up out of
     nothing. */
  var toll = document.getElementById('toll');
  function playToll() {
    if (!toll) return;
    try { toll.currentTime = 0; } catch (e) {}
    toll.volume = 0.6;
    var p = toll.play();
    if (p && p.catch) p.catch(function () {});
  }

  /* Opening. The seal breaks, then the gates swing, then the parent is told to
     take over. The timeout matches the gate transition so the handover happens
     as the light peaks rather than part-way through the swing. */
  var opened = false;
  function openGates() {
    if (opened) return;
    opened = true;
    playToll();
    document.body.classList.add('opening');
    setTimeout(function () {
      parent.postMessage({ type: 'k846-enter-realm' }, location.origin);
    }, reduced ? 120 : 2100);
  }

  document.getElementById('enter').addEventListener('click', openGates);
  /* Enter/Space anywhere is a reasonable second affordance for a screen whose
     only job is "continue". */
  addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGates(); }
  });
})();
</script>
</body>
</html>
