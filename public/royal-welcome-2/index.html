<!-- ============ LIVE BACKGROUND SHADER ============ -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform sampler2D uTex;
uniform vec2  uRes;
uniform vec2  uTexRes;
uniform vec2  uMouse;
uniform float uTime;
uniform float uExposure;   // 0 = black, 1 = fully lit
uniform float uBlur;       // 1 = soft dream blur (opening)
uniform float uZoom;       // camera push
uniform float uFire;       // strength of flame animation
uniform float uMist;       // ground mist amount
uniform float uRain;       // rain curtain strength
uniform float uStorm;      // lightning strength
uniform float uAurora;     // celestial aurora strength
uniform vec3  uRayCol;     // colour of the light shafts
uniform float uRayAmt;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){
    v += a * noise(p);
    p *= 2.03;
    a *= 0.5;
  }
  return v;
}

/* cover-fit the texture to the viewport */
vec2 coverUV(vec2 uv){
  float ta = uTexRes.x / uTexRes.y;
  float sa = uRes.x / uRes.y;
  if (sa > ta) uv.y = (uv.y - 0.5) * (ta / sa) + 0.5;
  else         uv.x = (uv.x - 0.5) * (sa / ta) + 0.5;
  return uv;
}

vec3 grab(vec2 uv){ return texture2D(uTex, clamp(uv, 0.001, 0.999)).rgb; }

/* soft blur used during the opening reveal */
vec3 grabBlur(vec2 uv, float r){
  if (r < 0.001) return grab(uv);
  vec3 c = vec3(0.0);
  c += grab(uv + vec2( r,  0.0));
  c += grab(uv + vec2(-r,  0.0));
  c += grab(uv + vec2(0.0,  r));
  c += grab(uv + vec2(0.0, -r));
  c += grab(uv + vec2( r,  r) * 0.7);
  c += grab(uv + vec2(-r,  r) * 0.7);
  c += grab(uv + vec2( r, -r) * 0.7);
  c += grab(uv + vec2(-r, -r) * 0.7);
  return c / 8.0;
}

/* how "flame-like" a pixel is: warm + bright */
float warmMask(vec3 c){
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  float warm = clamp((c.r - c.b) * 1.9, 0.0, 1.0);
  return warm * smoothstep(0.18, 0.72, l);
}

void main(){
  vec2 frag = gl_FragCoord.xy / uRes;
  float t = uTime;

  /* --- living camera: slow push + breathing drift + parallax --- */
  vec2 uv = coverUV(frag);
  vec2 drift = vec2(sin(t * 0.045) * 0.004, cos(t * 0.037) * 0.003);
  uv = (uv - 0.5) / uZoom + 0.5 + drift + uMouse * 0.012;

  /* --- atmospheric warp: haze breathing through the hall --- */
  vec2 w = vec2(fbm(uv * 3.1 + vec2(t * 0.035, -t * 0.05)),
                fbm(uv * 3.4 + 7.3 + vec2(-t * 0.04, t * 0.033))) - 0.5;
  vec2 uvw = uv + w * 0.0035;

  /* --- heat shimmer rising off the flames --- */
  vec3 probe = grab(uvw);
  float wm = warmMask(probe);
  float below = warmMask(grab(uvw - vec2(0.0, 0.06)));
  float heat = max(wm, below * 0.9);
  float shimmer = sin(uv.x * 190.0 + t * 5.0) * 0.5 + fbm(vec2(uv.x * 24.0, uv.y * 12.0 - t * 1.6)) - 0.5;
  uvw += vec2(shimmer * 0.0022, abs(shimmer) * 0.0016) * heat * uFire;

  /* --- base plate --- */
  vec3 col = grabBlur(uvw, uBlur * 0.010);

  /* subtle chromatic separation towards the edges (anamorphic feel) */
  float edge = length(frag - 0.5);
  float ca = 0.0016 * edge * edge;
  col.r = grabBlur(uvw + vec2(ca, 0.0), uBlur * 0.010).r;
  col.b = grabBlur(uvw - vec2(ca, 0.0), uBlur * 0.010).b;

  /* --- LIVE FIRE: flicker + bloom on every warm pixel --- */
  float m = warmMask(col);
  float flick = fbm(vec2(uv.x * 7.0, uv.y * 3.0 - t * 2.4)) * 0.9
              + fbm(vec2(uv.x * 21.0, -t * 5.2)) * 0.5
              + sin(t * 11.0 + uv.x * 30.0) * 0.10;
  flick = (flick - 0.72);
  col += vec3(1.0, 0.52, 0.16) * m * flick * 0.85 * uFire;

  /* warm bloom bleeding into the air around the flames */
  float bloom = 0.0;
#ifdef LOW_TIER
  for (int i = 0; i < 4; i++){
    float a = float(i) * 1.5707963;
    bloom += warmMask(grab(uvw + vec2(cos(a), sin(a)) * 0.022));
  }
  bloom /= 4.0;
#else
  for (int i = 0; i < 8; i++){
    float a = float(i) * 0.7853981;
    bloom += warmMask(grab(uvw + vec2(cos(a), sin(a)) * 0.022));
  }
  bloom /= 8.0;
#endif
  col += vec3(1.0, 0.55, 0.20) * bloom * (0.22 + 0.16 * flick) * uFire;

  /* --- LIVE GOD RAYS drifting across the hall --- */
  float shafts = fbm(vec2(uv.x * 5.0 - t * 0.035, uv.y * 0.8 + t * 0.02));
  shafts = pow(max(shafts - 0.34, 0.0), 1.6) * 3.2;
  shafts *= smoothstep(0.05, 0.85, 1.0 - frag.y) * (0.65 + 0.35 * sin(t * 0.4));
  col += uRayCol * shafts * uRayAmt;

  /* --- LIVE GROUND MIST rolling forward --- */
  float mist = fbm(vec2(uv.x * 2.3 - t * 0.025, uv.y * 5.0 + t * 0.05));
  mist *= smoothstep(0.42, 0.0, frag.y) * uMist;
  col = mix(col, col * 0.75 + vec3(0.36, 0.44, 0.60) * 0.55, clamp(mist * 0.55, 0.0, 0.55));

  /* --- STORM PROFILE: diagonal rain + intermittent lightning --- */
  vec2 rp = frag * vec2(uRes.x / max(uRes.y, 1.0), 1.0);
  rp.x += rp.y * 0.32;
  float rainCell = hash(vec2(floor(rp.x * 180.0), floor((rp.y + t * 1.8) * 90.0)));
  float rainLine = smoothstep(0.945, 1.0, rainCell) * smoothstep(0.0, 0.16, fract((rp.y + t * 1.8) * 90.0));
  col += vec3(0.48, 0.64, 0.82) * rainLine * uRain * 0.7;
  float strike = pow(max(sin(t * 0.43 - 1.1), 0.0), 40.0) + 0.5 * pow(max(sin(t * 1.17 + 2.5), 0.0), 80.0);
  col += vec3(0.66, 0.78, 1.0) * strike * uStorm;

  /* --- CELESTIAL PROFILE: living violet-blue aurora ribbons --- */
  float ribbon = sin(uv.x * 8.0 + fbm(vec2(uv.x * 2.0 - t * 0.025, t * 0.035)) * 5.0 + t * 0.12);
  ribbon = pow(max(ribbon * 0.5 + 0.5 - uv.y * 0.22, 0.0), 3.0);
  ribbon *= smoothstep(0.32, 0.95, frag.y) * uAurora;
  col += mix(vec3(0.12,0.48,0.82), vec3(0.52,0.20,0.82), fbm(uv * 2.0 + t * 0.02)) * ribbon * 0.55;

  /* --- dark-to-light cinematic reveal --- */
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum) * 0.35, col, clamp(uExposure * 1.15, 0.0, 1.0));
  col *= mix(0.12, 1.0, uExposure);
  col = pow(max(col, 0.0), vec3(mix(1.35, 1.0, uExposure)));

  /* filmic contrast + gentle vignette (the CSS layer adds the rest) */
  col = (col - 0.5) * 1.06 + 0.5;
  col *= 1.0 - 0.35 * edge * edge;

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
/* ===== themes ===== */
const CONFIG = {
  theme: window.K846_HALL,    // the hall of the week -- chosen in the head, see there
  enterUrl: '/',              // only used when opened standalone (gallery / ?preview=1);
                              // inside the app's splash iframe the handoff is a postMessage
  skipIntroOnReturn: true,    // returning visitors in the same tab get the fast open
  showThemeSwitcher: false    // always on when the URL has ?preview=1
};

const THEMES = {
  sapphire:   {label:'SAPPHIRE HALL',    src:'assets/hall-sapphire.webp',   ray:[0.58,0.74,1.00], rayAmt:.85, fire:.85, mist:.55, rain:0,   storm:0,   aurora:0},
  coronation: {label:'CORONATION',        src:'assets/hall-coronation.webp', ray:[1.00,0.84,0.58], rayAmt:.45, fire:1.35,mist:.40, rain:0,   storm:0,   aurora:0},
  moonlit:    {label:'MOONLIT REALM',     src:'assets/hall-moonlit.webp',    ray:[0.72,0.84,1.00], rayAmt:.70, fire:.55, mist:.85, rain:0,   storm:0,   aurora:0},
  embers:     {label:'EMBER THRONE',      src:'assets/hall-embers.webp',     ray:[1.00,0.42,0.12], rayAmt:.20, fire:1.80,mist:.62, rain:0,   storm:0,   aurora:0},
  cathedral:  {label:'IVORY CATHEDRAL',   src:'assets/hall-cathedral.webp',  ray:[1.00,0.88,0.58], rayAmt:1.05,fire:.38, mist:.42, rain:0,   storm:0,   aurora:0},
  storm:      {label:'STORM FORTRESS',    src:'assets/hall-storm.webp',      ray:[0.48,0.65,1.00], rayAmt:.35, fire:.82, mist:1.00, rain:0,   storm:.22,  aurora:0},
  dragongate: {label:'DRAGON GATE',       src:'assets/hall-dragongate.webp', ray:[1.00,0.62,0.24], rayAmt:.30, fire:1.55,mist:1.12, rain:0,   storm:0,   aurora:0},
  warcamp:    {label:'ROYAL WAR CAMP',    src:'assets/hall-warcamp.webp',    ray:[1.00,0.55,0.20], rayAmt:.48, fire:1.45,mist:.72, rain:0,   storm:0,   aurora:0},
  celestial:  {label:'CELESTIAL PALACE',  src:'assets/hall-celestial.webp',   ray:[0.45,0.68,1.00], rayAmt:.62, fire:.24, mist:.52, rain:0,   storm:0,   aurora:1.0}
};

const PARAMS = new URLSearchParams(location.search);
const PREVIEW = PARAMS.has('preview');
// ?fresh=1 is what the voting page passes: play the intro every single time.
const FORCE_INTRO = PREVIEW || PARAMS.has('fresh');
if (THEMES[PARAMS.get('theme')]) CONFIG.theme = PARAMS.get('theme');
if (!THEMES[CONFIG.theme]) CONFIG.theme = 'sapphire';
if (PREVIEW) console.info('[k846] hall of the week:', CONFIG.theme);
document.body.dataset.theme = CONFIG.theme;
document.documentElement.style.setProperty('--bg-img', `url('${THEMES[CONFIG.theme].src}')`);
const preBg = document.getElementById('pre-bg'); if (preBg) preBg.href = THEMES[CONFIG.theme].src;
if (PREVIEW || CONFIG.showThemeSwitcher) document.body.classList.add('preview');
document.querySelectorAll('.theme').forEach(b => b.classList.toggle('on', b.dataset.theme === CONFIG.theme));

/* device tier — keeps phones and weak GPUs smooth */
const LOW_TIER = matchMedia('(max-width:820px)').matches
  || (navigator.hardwareConcurrency || 8) <= 4
  || matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== title letters ===== */
// A left-to-right letter cascade was the one gesture every hall shared, and it
// is what made nine rooms feel like one template. Only Celestial still reveals
// letter by letter, and there the order is scattered on purpose -- stars do not
// arrive in reading order. Everywhere else the letters share a delay, so the
// WORD lands rather than being typed out.
const REVEAL = {
  // These are the wordmark beats from each hall's script. They live here rather
  // than in CSS because the letters get an inline animation-delay, and an inline
  // style beats a stylesheet rule -- setting them in CSS looked right and did
  // nothing, which put Storm's wordmark AFTER its own door.
  sapphire:  { at: 4.85, stagger: 0 },
  coronation:{ at: 5.40, stagger: 0 },
  moonlit:   { at: 6.80, stagger: 0 },
  embers:    { at: 1.70, stagger: 0 },   // the word burns in before the crest
  cathedral: { at: 7.40, stagger: 0 },
  storm:     { at: 2.90, stagger: 0 },   // everything at once on the strike
  dragongate:{ at: 7.00, stagger: 0 },
  warcamp:   { at: 6.00, stagger: 0 },
  celestial: { at: 4.80, scatter: 1.4 },
};
(function(){
  const el = document.getElementById('title');
  const r = REVEAL[CONFIG.theme] || REVEAL.sapphire;
  el.textContent = '';
  [...'KINGDOM 846'].forEach((ch,i)=>{
    const s=document.createElement('span');
    if(ch===' '){s.className='sp';s.innerHTML='&nbsp;';} else s.textContent=ch;
    s.style.animationDelay = (r.scatter ? r.at + Math.random()*r.scatter
                                        : r.at + i*(r.stagger||0)) + 's';
    el.appendChild(s);
  });
})();

/* ===== WebGL live background ===== */
const BG = (function(){
  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});
  if (!gl){ document.body.classList.add('nogl'); return {setTheme(){}, reveal(){}, push(){}, skip(){}}; }

  function compile(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  const fsSrc = (LOW_TIER ? '#define LOW_TIER 1\n' : '') + document.getElementById('fs').textContent;
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const u = {res:U('uRes'),texRes:U('uTexRes'),mouse:U('uMouse'),time:U('uTime'),exp:U('uExposure'),
             blur:U('uBlur'),zoom:U('uZoom'),fire:U('uFire'),mist:U('uMist'),rain:U('uRain'),storm:U('uStorm'),
             aurora:U('uAurora'),ray:U('uRayCol'),rayAmt:U('uRayAmt')};

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  let texRes = [1,1], theme = THEMES.sapphire;
  const cache = {};

  function useImage(img){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    texRes = [img.naturalWidth, img.naturalHeight];
  }

  function setTheme(name){
    theme = THEMES[name];
    document.documentElement.style.setProperty('--bg-img', `url('${theme.src}')`);
    if (cache[name]) { useImage(cache[name]); return; }
    const img = new Image();
    img.onload = () => { cache[name] = img; useImage(img); };
    img.src = theme.src;
  }
  setTheme(CONFIG.theme);

  const dpr = Math.min(devicePixelRatio || 1, LOW_TIER ? 1.2 : 1.75);
  function resize(){
    canvas.width  = Math.floor(innerWidth  * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);

  let mx = 0, my = 0, tmx = 0, tmy = 0;
  // halved: enough for the hall to have depth, not enough to feel like the
  // room is being dragged around
  addEventListener('pointermove', e => {
    tmx = (e.clientX / innerWidth  - 0.5) * 1.0;
    tmy = (e.clientY / innerHeight - 0.5) * 1.0;
  });

  let t0 = performance.now() / 1000;
  // The scene used to open at 1.14 and ease back to 1.0 -- a slow crop-out on
  // load. It starts at its true framing now; only ENTER still pushes in.
  let zoomTarget = 1.0, zoom = 1.0, pushing = false;

  function reveal(){ t0 = performance.now() / 1000; zoom = 1.0; zoomTarget = 1.0; pushing = false; }
  function skip(sec){ t0 -= sec; zoom = 1.0; }
  function push(){ pushing = true; zoomTarget = 1.5; }

  (function frame(){
    const now = performance.now() / 1000;
    const el  = now - t0;

    // matches the DOM timeline: black until 1.2s, fully lit by 3.6s
    const exposure = Math.min(Math.max((el - 1.2) / 2.4, 0), 1);
    const blur = 1 - exposure;

    zoom += (zoomTarget - zoom) * (pushing ? 0.05 : 0.012);
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;

    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform2f(u.texRes, texRes[0], texRes[1]);
    gl.uniform2f(u.mouse, mx, my);
    gl.uniform1f(u.time, now - t0 + 40.0);
    gl.uniform1f(u.exp, exposure);
    gl.uniform1f(u.blur, blur);
    gl.uniform1f(u.zoom, zoom);
    gl.uniform1f(u.fire, theme.fire);
    gl.uniform1f(u.mist, theme.mist);
    gl.uniform1f(u.rain, theme.rain);
    gl.uniform1f(u.storm, theme.storm);
    gl.uniform1f(u.aurora, theme.aurora);
    gl.uniform3f(u.ray, theme.ray[0], theme.ray[1], theme.ray[2]);
    gl.uniform1f(u.rayAmt, theme.rayAmt);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  })();

  return {setTheme, reveal, push, skip};
})();

/* ===== embers + dust ===== */
(function(){
  const c = document.getElementById('dust'), ctx = c.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w, h, dust = [], embers = [];
  function resize(){
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const n = Math.round(innerWidth * innerHeight / 24000);
    dust = Array.from({length:n}, () => ({x:Math.random()*w,y:Math.random()*h,
      r:(Math.random()*1.4+.35)*dpr,s:(Math.random()*.2+.04)*dpr,d:Math.random()*6.28,a:Math.random()*.4+.1}));
    embers = Array.from({length:Math.round(n/3)}, () => ({x:Math.random()*w,y:h*(0.55+Math.random()*0.5),
      r:(Math.random()*1.6+.6)*dpr,s:(Math.random()*.5+.18)*dpr,d:Math.random()*6.28,a:Math.random()*.55+.25,life:Math.random()}));
  }
  resize(); addEventListener('resize', resize);
  function glow(p, col, t, boost){
    const tw = p.a * (0.6 + 0.4*Math.sin(t/850 + p.d*5)) * boost;
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4.5);
    g.addColorStop(0, col.replace('A', tw)); g.addColorStop(1, col.replace('A', 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4.5,0,6.2832); ctx.fill();
  }
  (function loop(t){
    ctx.clearRect(0,0,w,h);
    for (const p of dust){
      p.y -= p.s; p.x += Math.sin(t/2800 + p.d)*.2*dpr;
      if (p.y < -10){ p.y = h+10; p.x = Math.random()*w; }
      glow(p,'rgba(255,234,186,A)',t,1);
    }
    for (const p of embers){
      p.y -= p.s; p.x += Math.sin(t/1500 + p.d)*.45*dpr; p.life -= .0016;
      if (p.y < h*0.12 || p.life <= 0){
        p.y = h*(0.9+Math.random()*0.15);
        p.x = (Math.random()<.5 ? Math.random()*w*.28 : w - Math.random()*w*.28);
        p.life = 1;
      }
      glow(p,'rgba(255,168,72,A)',t,Math.max(p.life,0));
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* The whole copy block used to slide up to 9px sideways and 5px vertically as
   the pointer moved -- crest, wordmark, tagline and button together. Depth in
   the ROOM is a good effect; the type sliding around under the cursor just
   makes the words feel unmoored, and on a desktop it is the first thing you
   notice. The room still has its parallax. The words hold still. */

/* ===== cinematic score ===== */
const Score = (() => {
  let ac, master, on = true;
  const T = () => ac.currentTime;

  // How far the film is ahead of the score.
  //
  // A browser will not let a page start audio until the visitor has clicked,
  // tapped or typed. Until then the AudioContext is suspended and its clock is
  // frozen, so a beat queued for "three seconds from now" is queued against a
  // now that never arrives -- and the instant audio unblocks, the entire score
  // fires from bar one while the picture is already seconds down the timeline.
  // The strike lands after the crest instead of on it, which is the one thing
  // the scores are written not to do.
  //
  // So when audio starts late, the score starts late too: skew is the seconds
  // of film already gone, every beat is pulled forward by it, and beats whose
  // moment has passed are dropped rather than played out of place.
  let skew = 0;
  const cue = at => { const d = at - skew; return d < 0 ? null : T() + d; };
  function init(){
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  function noiseBuf(sec){
    const len = sec*ac.sampleRate, b = ac.createBuffer(1,len,ac.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function subBass(){
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001,T());
    g.gain.exponentialRampToValueAtTime(.26, T()+3.5);
    [34,51].forEach(hz=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=hz;o.connect(f);o.start();});
    const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.07; lg.gain.value=.06;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    f.connect(g); g.connect(master);
  }
  function hallAir(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(5); s.loop=true;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380; f.Q.value=.55;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,T()); g.gain.exponentialRampToValueAtTime(.03,T()+4.5);
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function torchCrackle(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(3); s.loop=true;
    const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2400;
    const g=ac.createGain(); g.gain.value=.0001;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    (function crack(){
      if (!ac) return;
      const t=T()+Math.random()*1.4+.25;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.012+Math.random()*.01,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.09);
      setTimeout(crack, 500+Math.random()*1500);
    })();
  }
  function pad(at, freqs, vol, dur){
    const t=cue(at); if (t===null) return;
    freqs.forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type = i%2 ? 'triangle':'sine'; o.frequency.value=hz; o.detune.value=Math.random()*10-5;
      f.type='lowpass'; f.frequency.value=2200;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+dur*.35);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1);
    });
  }
  function shimmer(at){
    const t=T()+at;
    [1568,2093,2637,3136].forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz;
      const s=t+i*.1;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.045,s+.13);
      g.gain.exponentialRampToValueAtTime(.0001,s+1.7);
      o.connect(g); g.connect(master); o.start(s); o.stop(s+1.9);
    });
  }
  function impact(at){
    const t=T()+at;
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(36,t+.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t+2.8);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+2.9);
    const s=ac.createBufferSource(); s.buffer=noiseBuf(2);
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(.0001,Math.max(t-1.1,T()));
    ng.gain.exponentialRampToValueAtTime(.06,t);
    ng.gain.exponentialRampToValueAtTime(.0001,t+.6);
    s.connect(f); f.connect(ng); ng.connect(master); s.start(Math.max(t-1.1,T())); s.stop(t+.7);
    pad(at,[98,196,293.66,392,587.33],.085,4.2);
  }
  /* ---------- the voices each hall is scored with ----------
     All of this is synthesised on the fly; there are no audio files to ship.
     The primitives above (pad, shimmer, impact) were one palette used nine
     times. These are the instruments that let a hall sound like itself. */

  // Brass: stacked detuned saws through a sweeping lowpass. Ceremony.
  function brass(at, freqs, vol, dur){
    const t=cue(at); if (t===null) return;
    freqs.forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=hz; o.detune.value=(i-1)*7;
      f.type='lowpass'; f.Q.value=6;
      f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur*.3);
      f.frequency.exponentialRampToValueAtTime(900,t+dur);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+.12);
      g.gain.setValueAtTime(vol,t+dur*.6);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1);
    });
  }
  // Pipe organ: a root with its fifth and octaves, square-ish, no attack.
  function organ(at, root, vol, dur){
    const t=cue(at); if (t===null) return;
    [1,1.5,2,3,4].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type = i%2 ? 'square' : 'sine'; o.frequency.value=root*m; o.detune.value=Math.random()*6-3;
      const v = vol/(1+i*.9);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+.5);
      g.gain.setValueAtTime(v,t+dur*.7);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1);
    });
  }
  // Gong: inharmonic partials with a long metallic decay.
  function gong(at, base, vol){
    const t=cue(at); if (t===null) return;
    [1,2.37,3.41,4.63,5.9,7.2].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=base*m; o.detune.value=Math.random()*14-7;
      const v = vol/(1+i*1.5), d = 7 - i*.6;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+.02+i*.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.1);
    });
  }
  // War drum. Bigger and harder than the generic struck skin: a deeper shell
  // with a longer tail, a rim crack on the front so it carries, and a touch of
  // pitch bend so successive hits do not sound like the same sample twice.
  function warDrum(at, vol, deep){
    const t=T()+at, f0 = deep ? 46 : 62;
    const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type='sine'; lp.type='lowpass'; lp.frequency.value=deep?260:420;
    o.frequency.setValueAtTime(f0*2.4,t);
    o.frequency.exponentialRampToValueAtTime(f0,t+.09);
    o.frequency.exponentialRampToValueAtTime(f0*.72,t+.55);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(vol*.3,t+.22);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t+1.2);
    const n=ac.createBufferSource(); n.buffer=noiseBuf(.5);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=deep?190:320; bp.Q.value=.8;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(vol*.7,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.16);
    n.connect(bp); bp.connect(ng); ng.connect(master); n.start(t); n.stop(t+.2);
    const c=ac.createBufferSource(); c.buffer=noiseBuf(.2);
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2600;
    const cg=ac.createGain();
    cg.gain.setValueAtTime(vol*.34,t); cg.gain.exponentialRampToValueAtTime(.0001,t+.05);
    c.connect(hp); hp.connect(cg); cg.connect(master); c.start(t); c.stop(t+.08);
  }

  // A struck skin -- pitch drops fast, body is filtered noise.
  function drum(at, hz, vol){
    const t=cue(at); if (t===null) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
    o.frequency.setValueAtTime(hz,t); o.frequency.exponentialRampToValueAtTime(hz*.4,t+.28);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.75);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.8);
    const n=ac.createBufferSource(); n.buffer=noiseBuf(.4);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    const ng=ac.createGain(); ng.gain.setValueAtTime(vol*.5,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.22);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+.3);
  }
  // A small struck bell.
  function bell(at, hz, vol){
    const t=cue(at); if (t===null) return;
    [1,2.76,5.4].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz*m;
      const v=vol/(1+i*2), d=4-i*.9;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
    });
  }
  // Thunder. `near` decides whether this is a crack overhead or a roll on the
  // horizon -- distance is mostly high frequency being lost on the way, so a
  // far strike opens dark and stays dark, and only a near one gets the snap.
  function thunder(at, vol, near){
    const t=cue(at); if (t===null) return;
    const n=ac.createBufferSource(); n.buffer=noiseBuf(5);
    const f=ac.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(near?2600:520,t);
    f.frequency.exponentialRampToValueAtTime(near?70:60,t+(near?3.2:4));
    const g=ac.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+(near?.02:.35));
    g.gain.exponentialRampToValueAtTime(vol*.4,t+(near?.35:1.2));
    g.gain.exponentialRampToValueAtTime(.0001,t+(near?3.4:4.2));
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+4.4);
    if (near) {   // the crack itself, gone in a blink
      const c=ac.createBufferSource(); c.buffer=noiseBuf(.5);
      const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
      const cg=ac.createGain();
      cg.gain.setValueAtTime(vol*.8,t); cg.gain.exponentialRampToValueAtTime(.0001,t+.16);
      c.connect(hp); hp.connect(cg); cg.connect(master); c.start(t); c.stop(t+.2);
    }
  }
  // Rain, held under everything. A flat highpassed hiss is what a noise
  // generator sounds like, not what rain sounds like: the cut sits lower so
  // there is body under the spatter, a bandpass drifts across it so the fall
  // moves, and the level breathes instead of standing still.
  function rain(vol){
    const n=ac.createBufferSource(); n.buffer=noiseBuf(6); n.loop=true;
    const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=780;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=.5;
    const sweep=ac.createOscillator(), sg=ac.createGain();
    sweep.frequency.value=.08; sg.gain.value=900; sweep.connect(sg); sg.connect(bp.frequency); sweep.start();
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,T());
    g.gain.exponentialRampToValueAtTime(vol,T()+3.5);
    const breathe=ac.createOscillator(), bg=ac.createGain();
    breathe.frequency.value=.13; bg.gain.value=vol*.32; breathe.connect(bg); bg.connect(g.gain); breathe.start();
    n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master); n.start();
  }
  // Wind, for the halls that open onto the sky.
  function wind(vol){
    const n=ac.createBufferSource(); n.buffer=noiseBuf(6); n.loop=true;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=620; f.Q.value=.7;
    const lfo=ac.createOscillator(), lg=ac.createGain();
    lfo.frequency.value=.06; lg.gain.value=260; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,T());
    g.gain.exponentialRampToValueAtTime(vol,T()+5);
    n.connect(f); f.connect(g); g.connect(master); n.start();
  }
  // A rising figure of bells -- used where the hall should feel weightless.
  function arpeggio(at, hzs, vol, step){
    hzs.forEach((hz,i)=> bell(at + i*step, hz, vol));
  }

  /* ---------- one score per hall ----------
     Same 8.6s shape every time -- a bed, a build, the impact at 6.0s where the
     crest lands, a tail -- so the picture and the sound still agree. What
     changes is what is playing. */
  const SCORES = {
    // Cold, noble, composed. Strings and glass.
    sapphire(){
      subBass(); hallAir(); torchCrackle();
      pad(1.15,[130.81,196,261.63],.05,4); shimmer(3.35);
      pad(3.95,[174.61,261.63,349.23],.045,3);
      impact(5.95); pad(6.55,[146.83,220,293.66,440],.04,6);
    },
    // A crowning: brass answering itself, then bells over the strike.
    coronation(){
      subBass(); hallAir(); torchCrackle();
      brass(0.3,[130.81,196,261.63],.055,2.2);
      brass(1.9,[164.81,246.94,329.63],.06,2.2);
      brass(3.7,[196,293.66,392],.07,1.9);
      impact(5.3); drum(5.3,72,.5);
      bell(5.4,1046.5,.09); bell(5.8,1318.5,.075);
      brass(5.5,[261.63,392,523.25],.08,4.4);
    },
    // Almost nothing: air, a far-off bell, one low breath.
    // Moonlit and Celestial were the same recipe -- air, wind, pads, bells -- and
    // sounded like it. They are now opposites. This one keeps everything LOW:
    // a drone with real weight under it, dark gongs instead of bells, and not a
    // single bright tone anywhere.
    moonlit(){
      hallAir(); subBass();
      pad(.8,[73.42,110,146.83],.045,9);
      gong(3.2,73.42,.07);
      pad(5.2,[87.31,130.81,164.81],.036,8);
      impact(6.7); gong(6.8,98,.09);
      pad(7.3,[65.41,98,130.81,164.81],.04,9);
    },
    // A forge. Low, dirty, and struck.
    embers(){
      subBass(); torchCrackle(); torchCrackle();
      drum(0,58,.34); drum(0,58,.3); drum(0.9,52,.36);
      pad(0,[65.41,98,130.81],.06,5);
      drum(2.0,49,.42); drum(2.7,49,.46);
      impact(3.4); drum(3.4,44,.6); drum(3.82,58,.34);
      pad(4.0,[73.42,110,146.83],.055,6);
    },
    // Stone and organ. Reverent, slow, enormous.
    cathedral(){
      hallAir();
      organ(.6,98,.055,7.5);
      shimmer(4.3); shimmer(5.7);
      organ(5.5,130.81,.05,5);
      impact(7.3); bell(7.35,1567.98,.07);
      organ(7.8,146.83,.06,7);
      pad(8.1,[587.33,880,1174.66],.028,6);
    },
    // Weather. This had two noise beds running at once -- rain and wind -- plus
    // three thunders inside six seconds, each four seconds long, so they piled
    // into one continuous wash. Now: one rain bed with movement in it, one
    // distant roll early, and the sky only truly breaking on the strike.
    storm(){
      subBass(); rain(.06);
      thunder(0,.13,false);           // far off, no crack
      pad(0,[97.99,146.83,185],.04,5);
      impact(2.85); thunder(2.81,.32,true); drum(2.87,60,.45);
      pad(3.45,[110,164.81,207.65,277.18],.042,6);
    },
    // A gate opening: gongs, a deep drum, and a pentatonic figure.
    dragongate(){
      subBass(); hallAir(); torchCrackle();
      gong(.8,110,.16);
      drum(3.3,62,.34);
      arpeggio(4.1,[293.66,349.23,440,523.25],.045,.34);
      gong(5.5,146.83,.13);
      impact(6.9); gong(6.9,98,.22); drum(6.95,55,.5);
      pad(7.6,[110,164.81,220,329.63],.04,6);
    },
    // A camp before a march: drums, wind, a horn.
    // Battle drums. This was a polite four-on-the-floor on the generic drum; it
    // is now an actual march -- a struck cadence with accents on the beat and
    // doubles between them, building until the horns answer it.
    warcamp(){
      subBass(); hallAir(); torchCrackle(); wind(.04);
      // slow roll opening
      warDrum(0.70,.42,true);
      warDrum(1.30,.26); warDrum(1.55,.20);
      warDrum(1.90,.44,true);
      // the cadence tightens
      warDrum(2.50,.30); warDrum(2.75,.22);
      warDrum(3.10,.48,true);
      warDrum(3.60,.30); warDrum(3.80,.24); warDrum(4.00,.24);
      brass(4.25,[146.83,220,293.66],.055,2.4);
      warDrum(4.40,.50,true);
      warDrum(4.90,.32); warDrum(5.10,.26); warDrum(5.30,.30); warDrum(5.50,.34);
      warDrum(5.70,.38); warDrum(5.82,.42);
      // and the whole camp comes down on the beat
      impact(5.95); warDrum(5.95,.85,true); warDrum(6.02,.34);
      brass(6.25,[174.61,261.63,349.23],.06,4.2);
      warDrum(6.90,.34,true); warDrum(7.50,.28,true);
    },
    // Above the world. Bells, no bass, nothing struck hard.
    // ...and this one keeps everything HIGH. No sub, no drone, nothing below the
    // stave. Where Moonlit is a dark room at night, this is open sky.
    celestial(){
      hallAir(); wind(.055); shimmer(1.0);
      pad(.6,[523.25,783.99,1046.5],.024,8);
      arpeggio(5.3,[783.99,987.77,1174.66,1567.98],.05,.42);
      shimmer(6.4);
      pad(7.1,[587.33,880,1174.66],.022,7);
      impact(9.1);
      arpeggio(9.2,[1046.5,1318.51,1567.98,2093],.055,.3);
      pad(9.8,[659.25,987.77,1318.51,1975.5],.024,8);
    },
  };

  // Wall-clock, not the audio clock: the audio clock is exactly what stops.
  const now = () => (window.performance && performance.now) ? performance.now() : Date.now();
  const play = theme => (SCORES[theme] || SCORES.sapphire)();
  let pending = null, pendingAt = 0;
  const watchers = [];
  const notify = () => watchers.forEach(f => { try { f(); } catch(_){} });
  function flush(){
    notify();
    if (!pending) return;
    const theme = pending; pending = null;
    skew = (now() - pendingAt) / 1000;
    play(theme);
  }

  return {
    // Browsers refuse to start audio without a user gesture. The old build met
    // that with a full-screen "click to begin" wall. This meets it invisibly:
    // try to start, and if the context is blocked, resume on the first
    // interaction that happens anyway -- a tap, a key, a scroll. Nobody is ever
    // asked to click before the film runs, and where a gesture already
    // happened (someone tapped a card to open this) sound simply starts.
    arm(){
      init();
      if (ac.state === 'running') return;
      const go = () => {
        ac.resume().then(() => {
          if (ac.state === 'running') { off.forEach(f => f()); flush(); }
        }).catch(() => {});
      };
      const evs = ['pointerdown','touchstart','keydown','wheel'];
      const off = evs.map(e => {
        // The sound button is excluded on purpose. It has its own handler that
        // resumes and unmutes, and this one fires first -- on pointerdown, before
        // the click lands -- so letting it through would make audio audible a
        // moment before the button asked "is it audible?", and the button would
        // answer yes and mute the sound the visitor just clicked to hear.
        const h = ev => { const t = ev && ev.target;
          if (t && t.closest && t.closest('#sound')) return;
          go(); };
        window.addEventListener(e, h, { passive: true });
        return () => window.removeEventListener(e, h);
      });
      go();
    },
    get muted(){ return !on },

    // Whether sound is actually coming out, which is not the same as whether it
    // is switched on. It is only true when the browser has released the context
    // AND nobody has muted it; the label on the button is driven from this, so
    // it can never claim SOUND ON over silence.
    audible(){ return !!(ac && ac.state === 'running' && on) },

    // Turn sound on for real: unmute, and ask the browser again -- this runs off
    // a click, so this is exactly the gesture it has been waiting for.
    enable(){
      init(); on = true;
      master.gain.linearRampToValueAtTime(.9, T()+.15);
      if (ac.state !== 'running') ac.resume().then(() => { flush(); notify(); }).catch(()=>{});
      else notify();
    },
    mute(){
      init(); on = false;
      master.gain.linearRampToValueAtTime(.0001, T()+.4);
      notify();
    },
    onchange(fn){ watchers.push(fn); },
    start(theme){
      init();
      if (ac.state === 'running') { skew = 0; play(theme); return; }
      // Held by the autoplay policy. Do not schedule against a frozen clock --
      // hold the score and note when it should have begun, so whatever is left
      // of it can be dropped into place if audio unblocks while the film runs.
      pending = theme;
      pendingAt = now();
      ac.resume().catch(()=>{});
    },
    // Leaving sounds like the hall you are leaving.
    fanfare(theme){
      if(!ac) return;
      if (theme==='embers'||theme==='dragongate'){ drum(0,46,.6); gong(.02,110,.2); }
      else if (theme==='storm'){ thunder(0,.34,true); drum(.02,58,.5); }
      else if (theme==='cathedral'){ organ(0,196,.075,3.2); bell(.05,1567.98,.08); }
      else if (theme==='celestial'||theme==='moonlit'){ arpeggio(0,[1046.5,1318.51,1567.98],.06,.16); }
      else if (theme==='warcamp'){ drum(0,64,.5); brass(.05,[196,293.66,392],.075,2.4); }
      else if (theme==='coronation'){ brass(0,[261.63,392,523.25],.09,2.6); bell(.05,1046.5,.09); impact(.05); }
      else { pad(0,[261.63,392,523.25,783.99],.09,2.6); impact(.05); }
    },
    toggle(){ init(); on=!on; master.gain.linearRampToValueAtTime(on?.9:.0001, T()+.4); return on; }
  };
})();

/* ===== sequence ===== */
const stage = document.getElementById('stage');
// Each hall now runs its own length -- Storm is done in 5.8s, Celestial takes
// 13.0s -- so SKIP INTRO has to jump to the right place for the hall it is in.
const SCRIPT_LENGTH = { sapphire:8.6, coronation:9.4, moonlit:11.4, embers:6.6, cathedral:12.4, storm:5.8, dragongate:10.4, warcamp:8.4, celestial:13.0 };
const INTRO_LENGTH = SCRIPT_LENGTH[CONFIG.theme] || 8.6;

function run(withAudio){
  stage.classList.remove('play','done');
  void stage.offsetWidth;
  stage.classList.add('play');
  BG.reveal();
  if (withAudio) Score.start(CONFIG.theme);
}

/* jump straight to the composed frame, keeping every looping animation alive */
function skipIntro(){
  stage.getAnimations({subtree:true}).forEach(a => {
    try { if (a.effect && a.playState !== 'finished') a.currentTime = INTRO_LENGTH * 1000; } catch(_){}
  });
  BG.skip(INTRO_LENGTH);
  stage.classList.add('done');
}

// FORCE_INTRO exists because skipIntroOnReturn was quietly breaking the one
// job the previews have. It is keyed to sessionStorage, so on a page that opens
// several gates in a row -- the voting page, the gallery -- the FIRST gate
// played its intro and every one after it jumped straight to the composed
// frame. Measured: opening sapphire, then coronation, then moonlit left the
// last two at stage.done after 1.5s. Anyone comparing the nine would have seen
// one of them animate. A preview always plays; only the real splash, where a
// returning visitor does not want eight seconds every time, still skips.
function begin(){
  const seen = !FORCE_INTRO && CONFIG.skipIntroOnReturn
            && (() => { try { return sessionStorage.getItem('k846_intro') === '1' } catch { return false } })();
  Score.arm();
  run(!seen);
  if (seen) requestAnimationFrame(skipIntro);
  try { sessionStorage.setItem('k846_intro','1'); } catch(_){}
}

// No gate, no "click to begin" -- the film starts itself.
if (document.readyState === 'complete') begin();
else window.addEventListener('load', begin, { once: true });
document.getElementById('skip').addEventListener('click', e => { e.stopPropagation(); skipIntro(); });
document.getElementById('replay').addEventListener('click', e => { e.stopPropagation(); Score.arm(); run(true); });
// The button said SOUND ON from the moment the page loaded, whatever the audio
// was actually doing -- and since a browser holds audio until you interact, that
// was usually a label over silence. Worse, it was wired as a plain toggle: the
// state behind it started ON, so the click you made *because* you could not hear
// anything flipped it to OFF and muted the thing you were trying to start. The
// click did wake the audio; the volume it woke into was zero.
//
// The label now reads the real state -- released by the browser AND not muted --
// and the click means "make sound happen": if there is nothing audible it
// unmutes and asks the browser again, and only mutes when sound is genuinely
// playing. It also re-labels itself when audio frees up on some other gesture,
// so it never sits on the wrong word.
const soundBtn = document.getElementById('sound');
const syncSound = () => { soundBtn.textContent = Score.audible() ? 'SOUND ON' : 'SOUND OFF'; };
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (Score.audible()) Score.mute(); else Score.enable();
  syncSound();
});
Score.onchange(syncSound);
syncSound();
document.querySelectorAll('.theme').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  document.body.dataset.theme = CONFIG.theme = b.dataset.theme;
  document.querySelectorAll('.theme').forEach(x => x.classList.toggle('on', x === b));
  BG.setTheme(b.dataset.theme);
  run(true);
}));
document.getElementById('enter').addEventListener('click', () => {
  Score.fanfare(CONFIG.theme);
  BG.push();
  document.body.classList.add('entering');
  // Same handoff as the first build: inside the app's splash iframe the site is
  // opened by posting k846-enter-realm to the parent, not by navigating. Same
  // origin asserted explicitly rather than '*' -- the message unlocks the site.
  // enterUrl still applies when opened standalone, which is how the gallery
  // and ?preview=1 are used.
  const inFrame = window.parent && window.parent !== window;
  if (inFrame) {
    setTimeout(() => {
      try { window.parent.postMessage({ type: 'k846-enter-realm' }, window.location.origin); } catch (e) {}
    }, 1400);
  } else if (CONFIG.enterUrl) {
    setTimeout(() => { location.href = CONFIG.enterUrl; }, 1500);
  }
});
</script>
</body>
</html>
