<!-- The hall of the week.
     There are nine of these rooms and only one of them was ever being shown.
     Now the kingdom moves through them: one hall per week, in order, and after
     Celestial Palace it comes back round to Sapphire and goes again. Nobody has
     to remember to change it, and it never lands on a hall at random -- every
     visitor in a given week walks into the same room, which is the whole point
     of a front door.

     The week turns at 00:00 UTC on Monday, the same moment the game resets its
     weekly quests, so "this week's hall" means the same thing here as it does
     in-game. Deriving it from the clock rather than storing it keeps this page
     a static file with no server and no state to drift.

     This runs in the head, before the preload above has an href, because that
     preload is fetchpriority=high: if the hall were chosen further down the
     page the browser would already have committed to fetching Sapphire, and
     eight weeks out of nine that is a full-size hall image downloaded at top
     priority and thrown away. The href is set the instant the element exists.

     An explicit ?theme= still wins -- the gallery and the voting page both pass
     one, and they must keep showing the hall they asked for.

     The filenames follow assets/hall-<id>.webp for all nine; THEMES further
     down is still the source of truth and re-points both the preload and the
     background from its own src, so a name that ever stopped matching would
     cost one wasted preload and show up the moment you loaded the page. -->
<script>
window.K846_HALLS = ['sapphire','coronation','moonlit','embers','cathedral',
                     'storm','dragongate','warcamp','celestial'];
/* Monday 24 Aug 2026, 00:00 UTC -- the week this rotation started, on Sapphire. */
window.K846_CYCLE_START = Date.UTC(2026, 7, 24);
window.K846_HALL = (function () {
  var asked = new URLSearchParams(location.search).get('theme');
  if (asked && window.K846_HALLS.indexOf(asked) !== -1) return asked;
  var n = window.K846_HALLS.length;
  var week = Math.floor((Date.now() - window.K846_CYCLE_START) / 604800000);
  /* Double modulo: a device whose clock is set before the start date gives a
     negative week, and -1 % 9 is -1 in JS, which would index nothing. */
  return window.K846_HALLS[((week % n) + n) % n];
})();
document.getElementById('pre-bg').href = 'assets/hall-' + window.K846_HALL + '.webp';
document.documentElement.style.setProperty('--bg-img', "url('assets/hall-" + window.K846_HALL + ".webp')");
</script>
<!-- Nine halls, nine voices -- and the faces ship with the build.
     These were on Google Fonts, which meant every visitor waited on a third
     party and, if it was slow or blocked, silently got the same fallback serif
     on all nine screens. That failure is invisible: the layout still renders,
     the nine just stop being different, which is the one thing they have to be.
     Self-hosted, they cannot fall back, they cost no third-party round trip,
     and no visitor's IP is handed to another host to read a wordmark.
     Latin subsets only; Cinzel, Cormorant and Bodoni are variable files that
     serve every weight from one download. 240KB for the set, and a browser
     only fetches the face its hall actually sets. -->

<style>
:root{
  --gold-hi:#fff4d0; --gold-1:#f7e6ae; --gold-2:#e6c266; --gold-3:#b98a30;
  --champagne:#efdfb4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;overflow:hidden;}
body{font-family:'Cinzel',serif;color:var(--champagne);-webkit-font-smoothing:antialiased;}

.stage{position:fixed;inset:0;overflow:hidden;background:#000;}

/* ---- LIVE BACKGROUND (WebGL) ---- */
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* still-image fallback if WebGL is unavailable */
.fallback{position:absolute;inset:-4%;background:var(--bg-img) center 52%/cover no-repeat;display:none;}
body.nogl .fallback{display:block;}
body.nogl #bg{display:none;}

/* Depth + drifting particles */
#dust{position:absolute;inset:0;pointer-events:none;opacity:0;}
.play #dust{animation:fadeIn 3.2s ease-out 2s forwards;}

.vignette{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(115% 82% at 50% 46%, rgba(0,0,0,0) 36%, rgba(0,0,0,.52) 74%, rgba(0,0,0,.94) 100%),
    linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0) 44%);}

.grain{position:absolute;inset:-100%;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.7'/></svg>");
  animation:grainShift .5s steps(3) infinite;}
@keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

.bar{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:35;pointer-events:none;}
.bar.top{top:0;transform:translateY(-100%);}
.bar.bot{bottom:0;transform:translateY(100%);}
.play .bar.top{animation:barIn 1.4s cubic-bezier(.16,.72,.24,1) .2s forwards, barOutT 1.8s cubic-bezier(.16,.72,.24,1) 6.6s forwards;}
.play .bar.bot{animation:barIn 1.4s cubic-bezier(.16,.72,.24,1) .2s forwards, barOutB 1.8s cubic-bezier(.16,.72,.24,1) 6.6s forwards;}
@keyframes barIn{to{transform:translateY(0)}}
@keyframes barOutT{to{transform:translateY(-100%)}}
@keyframes barOutB{to{transform:translateY(100%)}}

.blackout{position:absolute;inset:0;background:#000;z-index:30;pointer-events:none;}
.play .blackout{animation:fadeOut 2s ease-out 1.2s forwards;}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===================== CONTENT ===================== */
.content{position:relative;z-index:20;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(11px,1.9vh,24px);padding:clamp(26px,6vh,74px) 22px clamp(34px,7vh,86px);text-align:center;
  will-change:transform;transition:transform .9s cubic-bezier(.16,.72,.24,1);}

.eyebrow{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
  font-weight:500;font-size:clamp(10px,min(1.25vw,1.6vh),15px);letter-spacing:var(--eyebrow-track);opacity:0;white-space:nowrap;
  text-shadow:0 0 20px rgba(230,194,102,.4);}
.eyebrow b{font-weight:var(--eyebrow-w);}
.eyebrow s{text-decoration:none;display:block;width:clamp(24px,5vw,74px);height:1px;
  background:linear-gradient(90deg,rgba(230,194,102,0),rgba(230,194,102,.85));}
.eyebrow s:last-child{background:linear-gradient(90deg,rgba(230,194,102,.85),rgba(230,194,102,0));}
.eyebrow em{font-style:normal;color:var(--gold-2);font-size:0;}
.eyebrow em::before{content:var(--orn);font-size:11px;font-family:'Cinzel',serif;}
.play .eyebrow{animation:eyebrowIn 1.1s cubic-bezier(.22,.61,.36,1) 4.0s forwards;}
@keyframes eyebrowIn{from{opacity:0;letter-spacing:.18em;filter:blur(5px)}to{opacity:.95;letter-spacing:.40em;filter:blur(0)}}

.crest-stack{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0;
  margin-bottom:clamp(14px,3.2vh,44px);}
.crest-wrap{position:relative;height:var(--crest-h);aspect-ratio:1024/1536;
  opacity:0;transform:translateY(34px) scale(.86);filter:blur(20px);will-change:opacity,transform,filter;}
.play .crest-wrap{animation:crestIn 1.7s cubic-bezier(.16,.74,.22,1) 2.4s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestIn{from{opacity:0;transform:translateY(34px) scale(.86);filter:blur(20px)}
                   to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes crestFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* Separating the crest from a bright hall used to be a radial pool behind it.
   A rectangle of shade behind a shape this intricate never matches its
   silhouette -- on War Camp's sunset it read as a dark smudge sitting on the
   sky, which is what you saw. drop-shadow follows the crest's own alpha, so
   the darkening lands exactly behind the filigree and nowhere else.
   --crest-lift is how much a hall needs: most need none. */
.crest{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 50px rgba(230,194,102,.26))
         drop-shadow(0 22px 46px rgba(0,0,0,.8))
         drop-shadow(0 0 10px rgba(0,0,0,var(--crest-lift,0)))
         drop-shadow(0 0 26px rgba(0,0,0,var(--crest-lift,0)));}


.halo{position:absolute;left:50%;top:50%;width:190%;height:135%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:radial-gradient(closest-side, rgba(var(--acc),.20), rgba(var(--acc),0) 70%),
             radial-gradient(closest-side, rgba(var(--acc2),.14), rgba(var(--acc2),0) 62%);}
.play .halo{animation:fadeIn 2.2s ease-out 3.1s forwards, haloPulse 7s ease-in-out 5.4s infinite;}
@keyframes haloPulse{0%,100%{opacity:1}50%{opacity:.55}}

.title{display:flex;justify-content:center;flex-wrap:nowrap;position:relative;
  /* The crest image carries its own KINGDOM 846 ribbon along its foot, so a
     gap that measures fine still READS as touching -- the wordmark lands
     immediately under that ribbon and the two run together. This is space
     for the crest to end before the name begins. */
  margin-top:clamp(16px,3.6vh,46px);line-height:1;
  font-family:var(--disp);font-weight:var(--disp-w);
  font-size:var(--disp-size);letter-spacing:var(--disp-track);}
.title span{display:inline-block;opacity:0;transform:translateY(22px) scale(.94);
  background:linear-gradient(178deg,#fffaf0 0%,var(--gold-hi) 14%,var(--gold-1) 30%,var(--gold-2) 50%,var(--gold-3) 68%,#f5e6b5 86%,#c99f45 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,246,219,.4)) drop-shadow(0 4px 14px rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(230,194,102,.26));}
.title span.sp{width:.36em;}
.play .title span{animation:letterIn .85s cubic-bezier(.16,.74,.22,1) forwards;}
@keyframes letterIn{from{opacity:0;transform:translateY(22px) scale(.94);filter:blur(12px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:var(--title-lit);}}

/* ---------- how each hall composes itself ----------
   The nine used to share one entrance: crest drops, letters rise, done. That
   made the choice between them almost entirely a choice of wallpaper. The
   schedule below is deliberately unchanged -- the crest still lands at 2.4s
   and the letters still run from 4.85s, so the score still hits with the
   impact -- but the CHARACTER of the motion now belongs to the room.
   Sapphire keeps the composed default; it is the flagship and the baseline
   the others are read against. */

/* Coronation -- ceremonial. The crest is set down with weight, and the letters
   rise like a fanfare rather than settling. */
body[data-theme="coronation"] .play .crest-wrap{
  animation:crestSet 1.9s cubic-bezier(.2,.9,.24,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestSet{0%{opacity:0;transform:translateY(-46px) scale(1.08);filter:blur(18px)}
  62%{opacity:1;transform:translateY(6px) scale(.99);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
body[data-theme="coronation"] .play .title span{animation:letterRise 1s cubic-bezier(.16,.8,.24,1) forwards;}
@keyframes letterRise{from{opacity:0;transform:translateY(46px) scale(.9);filter:blur(14px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Moonlit -- mysterious. Nothing arrives; it resolves out of the mist. */
body[data-theme="moonlit"] .play .crest-wrap{
  animation:crestMist 2.5s cubic-bezier(.24,.6,.26,1) 2.0s forwards, crestFloat 10s ease-in-out 4.4s infinite;}
@keyframes crestMist{from{opacity:0;transform:translateY(8px) scale(.98);filter:blur(34px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="moonlit"] .play .title span{animation:letterMist 1.5s ease-out forwards;}
@keyframes letterMist{from{opacity:0;transform:none;filter:blur(20px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Ember Throne -- forceful. The crest arrives hot and the letters catch like
   fire taking hold, flickering before they hold steady. */
body[data-theme="embers"] .play .crest-wrap{
  animation:crestForge 1.4s cubic-bezier(.1,.9,.2,1) 2.5s forwards, crestFloat 7s ease-in-out 4.4s infinite;}
@keyframes crestForge{0%{opacity:0;transform:translateY(52px) scale(.8);filter:blur(24px) brightness(2.2)}
  55%{opacity:1;transform:translateY(-5px) scale(1.03);filter:blur(0) brightness(1.5)}
  100%{opacity:1;transform:none;filter:blur(0) brightness(1)}}
body[data-theme="embers"] .play .title span{animation:letterCatch .95s ease-out forwards;}
@keyframes letterCatch{0%{opacity:0;transform:translateY(20px);filter:blur(12px)}
  40%{opacity:1}52%{opacity:.45}62%{opacity:1}72%{opacity:.7}
  100%{opacity:1;transform:none;filter:var(--title-lit);}}

/* Ivory Cathedral -- sacred. Everything blooms open out of the light instead
   of moving through space. */
body[data-theme="cathedral"] .play .crest-wrap{
  animation:crestBloom 2.2s cubic-bezier(.2,.7,.24,1) 2.2s forwards, crestFloat 9s ease-in-out 4.4s infinite;}
@keyframes crestBloom{0%{opacity:0;transform:scale(.76);filter:blur(26px) brightness(2.4)}
  100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
body[data-theme="cathedral"] .play .title span{animation:letterBloom 1.2s ease-out forwards;}
@keyframes letterBloom{from{opacity:0;transform:scale(.88);filter:blur(16px) brightness(2)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Storm Fortress -- dramatic. The crest is revealed by the strike, and the
   letters snap in hard rather than easing. */
/* This used to drop the crest to .35 opacity and back up twice while arriving.
   Intended as a lightning stutter; it read as an image failing to load, which
   is the "looks funny" -- a badge blinking is a broken badge, not weather.
   The strike now happens ONCE: the crest is blown out by the flash and cools
   into place. Opacity never goes backwards. */
body[data-theme="storm"] .play .crest-wrap{
  animation:crestStrike 1.6s cubic-bezier(.12,.85,.2,1) 2.4s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestStrike{
  0%{opacity:0;transform:scale(1.05);filter:blur(16px) brightness(4)}
  9%{opacity:1;transform:scale(1.02);filter:blur(1px) brightness(3.4)}
  30%{opacity:1;filter:blur(0) brightness(1.7)}
  100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
body[data-theme="storm"] .play .title span{animation:letterSnap .55s cubic-bezier(.2,1.5,.3,1) forwards;}
@keyframes letterSnap{0%{opacity:0;transform:translateY(14px) scale(1.14);filter:blur(9px)}
  100%{opacity:1;transform:none;filter:var(--title-lit);}}

/* Dragon Gate -- monumental. The crest comes forward out of depth, so the
   entrance feels like crossing the gate rather than watching it. */
body[data-theme="dragongate"] .play .crest-wrap{
  animation:crestApproach 2.1s cubic-bezier(.22,.68,.24,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestApproach{from{opacity:0;transform:scale(1.42);filter:blur(28px)}
  to{opacity:1;transform:scale(1);filter:blur(0)}}
body[data-theme="dragongate"] .play .title span{animation:letterApproach 1.05s cubic-bezier(.2,.72,.24,1) forwards;}
@keyframes letterApproach{from{opacity:0;transform:scale(1.5);filter:blur(16px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Royal War Camp -- the standard going up. Everything is raised from below. */
body[data-theme="warcamp"] .play .crest-wrap{
  animation:crestRaise 2s cubic-bezier(.18,.78,.22,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestRaise{from{opacity:0;transform:translateY(76px) scale(.94);filter:blur(18px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="warcamp"] .play .title span{animation:letterRise 1s cubic-bezier(.16,.8,.24,1) forwards;}

/* Celestial Palace -- weightless. Everything drifts up and keeps drifting. */
body[data-theme="celestial"] .play .crest-wrap{
  animation:crestDrift 2.8s cubic-bezier(.26,.58,.28,1) 1.9s forwards, crestFloat 12s ease-in-out 4.4s infinite;}
@keyframes crestDrift{from{opacity:0;transform:translateY(64px) scale(.92);filter:blur(22px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="celestial"] .play .title span{animation:letterDrift 1.6s cubic-bezier(.24,.6,.26,1) forwards;}
@keyframes letterDrift{from{opacity:0;transform:translateY(38px);filter:blur(14px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}
  1%{opacity:.85}
  11%{opacity:.85}
  13%{opacity:0;background-position:220% 0}
  100%{opacity:0;background-position:-120% 0}}

.impact{position:absolute;inset:0;z-index:24;pointer-events:none;opacity:0;
  background:radial-gradient(58% 42% at 50% 50%, rgba(var(--acc),.32), rgba(var(--acc),0) 70%);}
.play .impact{animation:flash 900ms ease-out 5.95s forwards;}
@keyframes flash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}

/* The wordmark was landing 8px off the rule -- close enough that a descender
   or a heavy face made them read as one object. This is breathing room. */
.rule{display:flex;align-items:center;justify-content:center;gap:18px;width:min(560px,74vw);
  opacity:0;margin-top:clamp(8px,1.6vh,20px);margin-bottom:clamp(2px,.6vh,8px);}
.rule s{text-decoration:none;display:block;height:1px;flex:1;transform:scaleX(0);transform-origin:right center;
  background:linear-gradient(90deg,rgba(230,194,102,0),rgba(230,194,102,.9));}
.rule s:last-child{background:linear-gradient(90deg,rgba(230,194,102,.9),rgba(230,194,102,0));transform-origin:left center;}
.rule i{font-style:normal;color:var(--gold-2);font-size:0;text-shadow:0 0 14px rgba(230,194,102,.75);}
.rule i::before{content:var(--orn);font-size:13px;font-family:'Cinzel',serif;}
.play .rule{animation:fadeIn .8s ease-out 6.2s forwards;}
.play .rule s{animation:drawRule 1.1s cubic-bezier(.16,.74,.22,1) 6.2s forwards;}
@keyframes drawRule{to{transform:scaleX(1)}}

.tagline{font-family:var(--tag-fam);font-style:var(--tag-style);font-weight:var(--tag-w);
  font-size:clamp(16px,min(2.3vw,2.9vh),26px);letter-spacing:var(--tag-track);color:#ecdfc0;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.9);}
.play .tagline{animation:taglineIn 1.2s cubic-bezier(.22,.61,.36,1) 6.5s forwards;}
@keyframes taglineIn{from{opacity:0;transform:translateY(12px);filter:blur(7px)}
                     to{opacity:.96;transform:translateY(0);filter:blur(0)}}

.cta{position:relative;margin-top:clamp(10px,2.4vh,30px);
  /* inline-flex + line-height:1 rather than relying on the button's own text
     baseline: the halls now set nine different faces here, and a face with
     unusual vertical metrics drops its text to the bottom of the box. Grenze
     Gotisch did exactly that on War Camp -- ENTER THE REALM hanging half out of
     its own button. Centring the line box makes it independent of the face. */
  display:inline-flex;align-items:center;justify-content:center;line-height:1;
  /* Never let the column steal height from the button. .content is a flex
     column at height:100%, so on the halls that run tall -- Cathedral's
     520px crest, War Camp's 112px wordmark -- the default flex-shrink was
     compressing the CTA instead of the artwork. Measured: 28px and 31px
     against 41px everywhere else, with identical font size and padding.
     The button is the one thing on screen that must stay hittable. */
  flex-shrink:0;
  padding:clamp(13px,1.7vh,18px) clamp(28px,4.4vw,56px);
  font-family:var(--cta-fam);font-weight:var(--cta-w);font-size:clamp(12px,min(1.3vw,1.6vh),15px);letter-spacing:var(--cta-track);
  color:#241a08;background:linear-gradient(180deg,#fff5d6 0%,var(--gold-1) 26%,var(--gold-2) 52%,var(--gold-3) 82%,#f3e2ab 100%);
  border:1px solid rgba(255,246,214,.7);border-radius:var(--cta-radius);cursor:pointer;overflow:hidden;opacity:0;
  box-shadow:0 0 0 1px rgba(111,76,19,.6), 0 16px 46px rgba(0,0,0,.7), 0 0 34px rgba(230,194,102,.22);
  transition:transform .35s cubic-bezier(.16,.72,.24,1), filter .35s ease, letter-spacing .35s ease;}
.play .cta{animation:ctaIn 1s cubic-bezier(.16,.74,.22,1) 7.4s forwards, ctaGlow 4.5s ease-in-out 8.6s infinite;}
@keyframes ctaIn{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes ctaGlow{0%,100%{box-shadow:0 0 0 1px rgba(111,76,19,.6),0 16px 46px rgba(0,0,0,.7),0 0 26px rgba(230,194,102,.2)}
                   50%{box-shadow:0 0 0 1px rgba(111,76,19,.6),0 16px 46px rgba(0,0,0,.7),0 0 58px rgba(230,194,102,.48)}}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:42%;height:100%;transform:skewX(-18deg);
  background:linear-gradient(104deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0));
  animation:ctaSheen 5.5s ease-in-out 9s infinite;}
@keyframes ctaSheen{0%,74%{left:-60%}100%{left:135%}}
.cta{gap:clamp(9px,1vw,14px);}
.cta-mark{width:clamp(15px,1.5vw,20px);height:auto;flex:0 0 auto;
  color:#3a2a06;opacity:.85;transform:translateY(-1px);
  transition:transform .35s cubic-bezier(.16,.72,.24,1), opacity .35s ease;}
.cta:hover .cta-mark{transform:translateY(-2px) scale(1.06);opacity:1;}
.cta:hover{transform:translateY(-2px) scale(1.025);filter:brightness(1.07);letter-spacing:.34em;}
.cta:active{transform:translateY(0) scale(.99);}
.crown-mini{color:var(--gold-2);font-size:13px;letter-spacing:.5em;opacity:0;margin-top:6px;text-shadow:0 0 16px rgba(230,194,102,.7);}
.play .crown-mini{animation:fadeIn 1s ease-out 7.6s forwards;}

.frame{position:absolute;inset:clamp(14px,2.4vw,36px);pointer-events:none;opacity:0;z-index:18;}
.play .frame{animation:fadeIn 1.8s ease-out 4.6s forwards;}
.frame i{position:absolute;width:clamp(40px,5.4vw,82px);height:clamp(40px,5.4vw,82px);border:1px solid rgba(230,194,102,.42);}
.frame i::before{content:"";position:absolute;width:7px;height:7px;background:var(--gold-2);border-radius:50%;box-shadow:0 0 12px rgba(230,194,102,.9);}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.frame i:nth-child(1)::before{top:-4px;left:-4px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}.frame i:nth-child(2)::before{top:-4px;right:-4px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.frame i:nth-child(3)::before{bottom:-4px;left:-4px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}.frame i:nth-child(4)::before{bottom:-4px;right:-4px}

.hud{position:absolute;z-index:32;top:clamp(16px,3vw,38px);display:flex;gap:9px;opacity:0;}
.hud.left{left:clamp(16px,3vw,38px);}
.hud.right{right:clamp(16px,3vw,38px);}
.play .hud{animation:fadeIn 1s ease-out 4.6s forwards;}
.hud button{background:rgba(8,12,24,.5);border:1px solid rgba(230,194,102,.4);color:var(--champagne);
  font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.22em;padding:9px 15px;border-radius:2px;
  cursor:pointer;backdrop-filter:blur(8px);transition:.3s ease;}
.hud button:hover{background:rgba(230,194,102,.16);border-color:rgba(230,194,102,.85);}
.hud button.on{background:rgba(230,194,102,.28);border-color:rgba(230,194,102,.95);color:#fff6dc;}
.hud button:focus-visible,.cta:focus-visible,.gate:focus-visible{outline:2px solid rgba(255,238,190,.9);outline-offset:3px;}
.hud .theme{display:none;}
body.preview .hud .theme{display:inline-block;}
/* None of the HUD controls belong on the public screen. They are reviewing
   tools -- REPLAY to watch the film again, SKIP to get past it, SOUND to check
   the mix -- and they were only ever visible because they were never gated, the
   same way the nine hall buttons above once were. A visitor arriving at a front
   door should see the door, not the controls we judged it with.
   They all still exist under ?preview=1, which is where they are used.
   The trade: with SOUND gone there is no mute control, so the audio has to be
   something a visitor is happy to be given unasked -- it is short, it ends with
   the film, and the browser holds it until they interact with the page anyway. */
.hud button{display:none;}
body.preview .hud button{display:inline-block;}
body.preview .hud.right{max-width:min(680px,70vw);flex-wrap:wrap;justify-content:flex-end;}
body.preview .hud.right button{font-size:8px;padding:8px 10px;}
#skip{opacity:0;transition:opacity .5s ease;}
.play #skip{opacity:1;}
.stage.done #skip{opacity:0;pointer-events:none;}

/* ---------- each hall gets its own light ----------
   Every theme used to share one warm cream-and-gold treatment: the same
   entrance flash, the same crest halo, the same impact bloom, the same glow on
   the wordmark. In a gold hall that is right. On Sapphire, Moonlit, Storm and
   Celestial it was a warm flash going off in a cold room, which is what made
   the entrance read wrong. Each theme now carries its own accent, seeded from
   the ray colour its own shader already lights the scene with, so the flash
   belongs to the room it happens in.
   --acc is the light itself, --acc2 the deeper edge of it, --flash-pos where
   it originates: fire halls bloom up from the braziers, Cathedral and Storm
   come from above. */
/* ---------- nine voices ----------
   Everything below is a token the layout reads, so a hall changes its face,
   its weight, its tracking, its scale, its crest and its ornament without a
   single bespoke rule. The point is that no two of these should be mistakable
   for each other with the artwork removed -- the type alone should tell you
   which hall you are standing in.
   Ornaments carry U+FE0E so they render as typography, not as colour emoji. */
body{
  --disp:'Cinzel',serif; --disp-w:800; --disp-track:.1em;
  --disp-size:clamp(38px,min(8vw,8.6vh),80px);
  --crest-h:clamp(190px,42vh,470px);
  --eyebrow-track:.34em; --eyebrow-w:500;
  --tag-fam:'Cormorant Garamond',serif; --tag-style:italic; --tag-w:300; --tag-track:.055em;
  --cta-fam:'Cinzel',serif; --cta-w:600; --cta-track:.3em; --cta-radius:2px;
  --orn:'\2726\FE0E';

  --title-lit:drop-shadow(0 1px 0 rgba(255,246,219,.4)) drop-shadow(0 4px 14px rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(var(--acc),.30));}
body[data-theme="sapphire"]  {--acc:148,188,255;--acc2:94,140,232;}
body[data-theme="coronation"]{--acc:255,224,160;--acc2:255,182,88; --flash-pos:50% 74%;}
body[data-theme="moonlit"]   {--acc:196,222,255;--acc2:140,176,236;}
body[data-theme="embers"]    {--acc:255,150,64; --acc2:214,52,14;  --flash-pos:50% 80%;}
body[data-theme="cathedral"] {--acc:255,246,220;--acc2:255,214,140;--flash-pos:50% 24%;}
body[data-theme="storm"]     {--acc:214,232,255;--acc2:104,152,255;--flash-pos:50% 12%;}
body[data-theme="dragongate"]{--acc:255,176,88; --acc2:230,90,28;  --flash-pos:50% 72%;}
body[data-theme="warcamp"]   {--acc:255,190,104;--acc2:224,104,36; --flash-pos:50% 76%;}
body[data-theme="celestial"] {--acc:154,198,255;--acc2:170,124,255;}

/* 01 Sapphire Hall -- Roman inscriptional capitals. The state portrait, and
   the baseline the other eight are read against. Nothing to change. */

/* ================= NINE BORDERS =================
   The corner marks were one gilt L with a dot, identical on every hall -- the
   last piece of furniture the nine still shared. Each frame now belongs to its
   room: some are heavier, some are hairlines, one is only dots, one runs the
   full height like window mullions. */

/* Coronation -- doubled and heavy, the way a state document is ruled. */
body[data-theme="coronation"] .frame i{border-width:2px;width:clamp(52px,6.6vw,102px);height:clamp(52px,6.6vw,102px);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,0), 0 0 0 0 transparent;}
body[data-theme="coronation"] .frame i::before{width:10px;height:10px;}

/* Moonlit -- a hairline that barely commits, and no dot at all. */
body[data-theme="moonlit"] .frame i{border-color:rgba(196,222,255,.30);width:clamp(64px,8vw,128px);height:clamp(64px,8vw,128px);}
body[data-theme="moonlit"] .frame i::before{display:none;}

/* Ember Throne -- short heavy brackets, squared off, no ornament. */
body[data-theme="embers"] .frame i{border-width:3px;border-color:rgba(255,150,64,.5);
  width:clamp(26px,3vw,44px);height:clamp(26px,3vw,44px);}
body[data-theme="embers"] .frame i::before{display:none;}

/* Cathedral -- verticals only, running tall like window mullions. */
body[data-theme="cathedral"] .frame i{width:clamp(14px,1.4vw,22px);height:clamp(110px,16vw,240px);
  border-top:0!important;border-bottom:0!important;border-color:rgba(255,246,220,.34);}
body[data-theme="cathedral"] .frame i::before{width:5px;height:5px;}

/* Storm -- sharp little ticks. Nothing decorative, as everywhere in this hall. */
body[data-theme="storm"] .frame i{width:clamp(18px,2vw,30px);height:clamp(18px,2vw,30px);
  border-width:2px;border-color:rgba(214,232,255,.55);}
body[data-theme="storm"] .frame i::before{width:4px;height:4px;border-radius:0;}

/* Dragon Gate -- solid corner blocks, monumental. */
body[data-theme="dragongate"] .frame i{width:clamp(30px,3.6vw,56px);height:clamp(30px,3.6vw,56px);
  border-width:4px;border-color:rgba(255,176,88,.45);}
body[data-theme="dragongate"] .frame i::before{width:9px;height:9px;border-radius:2px;}

/* War Camp -- rope: a thick line with a heavy stud where it is pinned down. */
body[data-theme="warcamp"] .frame i{border-width:3px;border-color:rgba(255,190,104,.40);
  width:clamp(44px,5vw,76px);height:clamp(44px,5vw,76px);}
body[data-theme="warcamp"] .frame i::before{width:12px;height:12px;box-shadow:0 0 16px rgba(255,190,104,.9);}

/* Celestial -- no lines at all. Four points of light, and nothing joining them. */
body[data-theme="celestial"] .frame i{border:0;width:10px;height:10px;}
body[data-theme="celestial"] .frame i::before{width:6px;height:6px;
  box-shadow:0 0 18px rgba(154,198,255,1), 0 0 40px rgba(170,124,255,.7);}

/* ================= NINE MOTION LANGUAGES =================
   Seven of the nine beats were byte-identical on every hall: the eyebrow, the
   halo, the impact flash, the rule, the tagline, the button and the crown all
   ran the same keyframe at the same second for the same duration. Only the
   crest and the wordmark ever differed. Seven identical events against two
   varied ones is why the set still read as one screen -- the sameness
   outnumbered the difference seven to two.
   Each hall now has ONE motion language of its own and every beat speaks it,
   with its own rhythm underneath. The impact stays near 5.95s on all nine
   because the score's strike lands there and picture and sound have to agree;
   everything else moves. */

/* SAPPHIRE -- COMPOSED DESCENT -- everything settles downward into place, calm, no overshoot. */
@keyframes sapphireArrive{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sapphireCta{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sapphireFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
body[data-theme="sapphire"] .play .halo{animation:fadeIn 2.2s ease-out 3.1s forwards, haloPulse 7s ease-in-out 5.4s infinite;}
body[data-theme="sapphire"] .play .eyebrow{animation:sapphireArrive 1.1s cubic-bezier(.16,.74,.22,1) 4.0s forwards;}
body[data-theme="sapphire"] .play .impact{animation:sapphireFlash .9s ease-out 5.95s forwards;}
body[data-theme="sapphire"] .play .rule{animation:sapphireArrive .8s cubic-bezier(.16,.74,.22,1) 6.2s forwards;}
body[data-theme="sapphire"] .play .rule s{animation:drawRule .8s cubic-bezier(.16,.74,.22,1) 6.2s forwards;}
body[data-theme="sapphire"] .play .tagline{animation:sapphireArrive 1.2s cubic-bezier(.16,.74,.22,1) 6.5s forwards;}
body[data-theme="sapphire"] .play .cta{animation:sapphireCta 1s cubic-bezier(.16,.74,.22,1) 7.4s forwards, ctaGlow 4.5s ease-in-out 8.6s infinite;}
body[data-theme="sapphire"] .play .crown-mini{animation:sapphireArrive 1s cubic-bezier(.16,.74,.22,1) 7.6s forwards;}

/* CORONATION -- STRUCK -- weight and a short overshoot, as if each piece is set down. */
@keyframes coronationArrive{0%{opacity:0;transform:translateY(-22px) scale(1.06);filter:blur(10px)}64%{opacity:1;transform:translateY(3px) scale(.995);filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes coronationCta{0%{opacity:0;transform:translateY(-18px) scale(1.08)}62%{opacity:1;transform:translateY(2px) scale(.99)}100%{opacity:1;transform:none}}
@keyframes coronationFlash{0%{opacity:0}10%{opacity:1}42%{opacity:.45}56%{opacity:.8}100%{opacity:0}}
body[data-theme="coronation"] .play .halo{animation:fadeIn 2.2s ease-out 2.9s forwards, haloPulse 7s ease-in-out 5.199999999999999s infinite;}
body[data-theme="coronation"] .play .eyebrow{animation:coronationArrive .9s cubic-bezier(.2,1.05,.26,1) 3.7s forwards;}
body[data-theme="coronation"] .play .impact{animation:coronationFlash 1.5s ease-out 5.95s forwards;}
body[data-theme="coronation"] .play .rule{animation:coronationArrive .7s cubic-bezier(.2,1.05,.26,1) 6.35s forwards;}
body[data-theme="coronation"] .play .rule s{animation:drawRule .7s cubic-bezier(.2,1.05,.26,1) 6.35s forwards;}
body[data-theme="coronation"] .play .tagline{animation:coronationArrive 1s cubic-bezier(.2,1.05,.26,1) 6.75s forwards;}
body[data-theme="coronation"] .play .cta{animation:coronationCta .85s cubic-bezier(.2,1.05,.26,1) 7.5s forwards, ctaGlow 4.5s ease-in-out 8.7s infinite;}
body[data-theme="coronation"] .play .crown-mini{animation:coronationArrive .8s cubic-bezier(.2,1.05,.26,1) 7.9s forwards;}

/* MOONLIT -- DISSOLVE -- nothing travels; everything resolves out of blur, slowly. */
@keyframes moonlitArrive{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:blur(0)}}
@keyframes moonlitCta{from{opacity:0;filter:blur(16px)}to{opacity:1;filter:blur(0)}}
@keyframes moonlitFlash{0%{opacity:0}30%{opacity:.6}100%{opacity:0}}
body[data-theme="moonlit"] .play .halo{animation:fadeIn 2.2s ease-out 2.6s forwards, haloPulse 7s ease-in-out 4.9s infinite;}
body[data-theme="moonlit"] .play .eyebrow{animation:moonlitArrive 2s ease-out 3.6s forwards;}
body[data-theme="moonlit"] .play .impact{animation:moonlitFlash 1.9s ease-out 5.95s forwards;}
body[data-theme="moonlit"] .play .rule{animation:moonlitArrive 1.6s ease-out 6.0s forwards;}
body[data-theme="moonlit"] .play .rule s{animation:drawRule 1.6s ease-out 6.0s forwards;}
body[data-theme="moonlit"] .play .tagline{animation:moonlitArrive 2.2s ease-out 6.3s forwards;}
body[data-theme="moonlit"] .play .cta{animation:moonlitCta 1.8s ease-out 7.2s forwards, ctaGlow 4.5s ease-in-out 8.4s infinite;}
body[data-theme="moonlit"] .play .crown-mini{animation:moonlitArrive 1.8s ease-out 7.7s forwards;}

/* EMBERS -- IGNITE -- nothing moves. Everything comes up from dark to hot. */
@keyframes embersArrive{0%{opacity:0;filter:brightness(.1) blur(2px)}30%{opacity:1;filter:brightness(.5) blur(0)}62%{filter:brightness(1.9)}100%{opacity:1;filter:brightness(1)}}
@keyframes embersCta{0%{opacity:0;filter:brightness(.15)}28%{opacity:1;filter:brightness(.6)}60%{filter:brightness(2.1)}100%{opacity:1;filter:brightness(1)}}
@keyframes embersFlash{0%{opacity:0}8%{opacity:1}30%{opacity:.7}100%{opacity:0}}
body[data-theme="embers"] .play .halo{animation:fadeIn 2.2s ease-out 2.8s forwards, haloPulse 7s ease-in-out 5.1s infinite;}
body[data-theme="embers"] .play .eyebrow{animation:embersArrive 1.4s cubic-bezier(.3,.4,.2,1) 3.9s forwards;}
body[data-theme="embers"] .play .impact{animation:embersFlash 1.6s ease-out 5.95s forwards;}
body[data-theme="embers"] .play .rule{animation:embersArrive 1s cubic-bezier(.3,.4,.2,1) 6.15s forwards;}
body[data-theme="embers"] .play .rule s{animation:drawRule 1s cubic-bezier(.3,.4,.2,1) 6.15s forwards;}
body[data-theme="embers"] .play .tagline{animation:embersArrive 1.3s cubic-bezier(.3,.4,.2,1) 6.4s forwards;}
body[data-theme="embers"] .play .cta{animation:embersCta 1.2s cubic-bezier(.3,.4,.2,1) 7.1s forwards, ctaGlow 4.5s ease-in-out 8.299999999999999s infinite;}
body[data-theme="embers"] .play .crown-mini{animation:embersArrive 1s cubic-bezier(.3,.4,.2,1) 7.35s forwards;}

/* CATHEDRAL -- BLOOM -- everything opens outward from light, slowly and reverently. */
@keyframes cathedralArrive{from{opacity:0;transform:scale(.9);filter:blur(12px) brightness(2.2)}to{opacity:1;transform:none;filter:blur(0) brightness(1)}}
@keyframes cathedralCta{from{opacity:0;transform:scale(.88);filter:blur(12px) brightness(2)}to{opacity:1;transform:none;filter:blur(0) brightness(1)}}
@keyframes cathedralFlash{0%{opacity:0}34%{opacity:.85}100%{opacity:0}}
body[data-theme="cathedral"] .play .halo{animation:fadeIn 2.2s ease-out 2.5s forwards, haloPulse 7s ease-in-out 4.8s infinite;}
body[data-theme="cathedral"] .play .eyebrow{animation:cathedralArrive 1.8s cubic-bezier(.2,.7,.24,1) 4.2s forwards;}
body[data-theme="cathedral"] .play .impact{animation:cathedralFlash 2.2s ease-out 5.95s forwards;}
body[data-theme="cathedral"] .play .rule{animation:cathedralArrive 1.5s cubic-bezier(.2,.7,.24,1) 6.5s forwards;}
body[data-theme="cathedral"] .play .rule s{animation:drawRule 1.5s cubic-bezier(.2,.7,.24,1) 6.5s forwards;}
body[data-theme="cathedral"] .play .tagline{animation:cathedralArrive 2s cubic-bezier(.2,.7,.24,1) 6.9s forwards;}
body[data-theme="cathedral"] .play .cta{animation:cathedralCta 1.7s cubic-bezier(.2,.7,.24,1) 7.7s forwards, ctaGlow 4.5s ease-in-out 8.9s infinite;}
body[data-theme="cathedral"] .play .crown-mini{animation:cathedralArrive 1.6s cubic-bezier(.2,.7,.24,1) 8.1s forwards;}

/* STORM -- STRIKE -- no easing in. It is dark, then it is simply there, blown out. */
@keyframes stormArrive{0%{opacity:0;filter:brightness(5)}5%{opacity:1;filter:brightness(4)}22%{opacity:1;filter:brightness(1)}30%{opacity:.78}100%{opacity:1;filter:brightness(1)}}
@keyframes stormCta{0%{opacity:0;filter:brightness(4.5)}6%{opacity:1;filter:brightness(3.4)}24%{opacity:1;filter:brightness(1)}100%{opacity:1}}
@keyframes stormFlash{0%{opacity:0}3%{opacity:1}9%{opacity:.1}15%{opacity:.95}100%{opacity:0}}
body[data-theme="storm"] .play .halo{animation:fadeIn 2.2s ease-out 2.45s forwards, haloPulse 7s ease-in-out 4.75s infinite;}
body[data-theme="storm"] .play .eyebrow{animation:stormArrive .5s cubic-bezier(.1,.9,.2,1) 4.3s forwards;}
body[data-theme="storm"] .play .impact{animation:stormFlash 1.1s ease-out 5.95s forwards;}
body[data-theme="storm"] .play .rule{animation:stormArrive .35s cubic-bezier(.1,.9,.2,1) 6.05s forwards;}
body[data-theme="storm"] .play .rule s{animation:drawRule .35s cubic-bezier(.1,.9,.2,1) 6.05s forwards;}
body[data-theme="storm"] .play .tagline{animation:stormArrive .6s cubic-bezier(.1,.9,.2,1) 6.25s forwards;}
body[data-theme="storm"] .play .cta{animation:stormCta .5s cubic-bezier(.1,.9,.2,1) 7.0s forwards, ctaGlow 4.5s ease-in-out 8.2s infinite;}
body[data-theme="storm"] .play .crown-mini{animation:stormArrive .4s cubic-bezier(.1,.9,.2,1) 7.2s forwards;}

/* DRAGONGATE -- APPROACH -- everything comes forward out of depth, processionally. */
@keyframes dragongateArrive{from{opacity:0;transform:scale(1.5);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes dragongateCta{from{opacity:0;transform:scale(1.4);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes dragongateFlash{0%{opacity:0}22%{opacity:.9}100%{opacity:0}}
body[data-theme="dragongate"] .play .halo{animation:fadeIn 2.2s ease-out 2.7s forwards, haloPulse 7s ease-in-out 5.0s infinite;}
body[data-theme="dragongate"] .play .eyebrow{animation:dragongateArrive 1.5s cubic-bezier(.22,.68,.24,1) 4.1s forwards;}
body[data-theme="dragongate"] .play .impact{animation:dragongateFlash 1.7s ease-out 5.95s forwards;}
body[data-theme="dragongate"] .play .rule{animation:dragongateArrive 1.2s cubic-bezier(.22,.68,.24,1) 6.3s forwards;}
body[data-theme="dragongate"] .play .rule s{animation:drawRule 1.2s cubic-bezier(.22,.68,.24,1) 6.3s forwards;}
body[data-theme="dragongate"] .play .tagline{animation:dragongateArrive 1.6s cubic-bezier(.22,.68,.24,1) 6.7s forwards;}
body[data-theme="dragongate"] .play .cta{animation:dragongateCta 1.4s cubic-bezier(.22,.68,.24,1) 7.6s forwards, ctaGlow 4.5s ease-in-out 8.799999999999999s infinite;}
body[data-theme="dragongate"] .play .crown-mini{animation:dragongateArrive 1.3s cubic-bezier(.22,.68,.24,1) 8.0s forwards;}

/* WARCAMP -- RAISE -- everything comes up from below, in a marching rhythm. */
@keyframes warcampArrive{from{opacity:0;transform:translateY(42px);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes warcampCta{from{opacity:0;transform:translateY(38px);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes warcampFlash{0%{opacity:0}14%{opacity:.9}48%{opacity:.3}62%{opacity:.6}100%{opacity:0}}
body[data-theme="warcamp"] .play .halo{animation:fadeIn 2.2s ease-out 2.75s forwards, haloPulse 7s ease-in-out 5.05s infinite;}
body[data-theme="warcamp"] .play .eyebrow{animation:warcampArrive 1s cubic-bezier(.16,.8,.24,1) 3.8s forwards;}
body[data-theme="warcamp"] .play .impact{animation:warcampFlash 1.4s ease-out 5.95s forwards;}
body[data-theme="warcamp"] .play .rule{animation:warcampArrive .8s cubic-bezier(.16,.8,.24,1) 6.1s forwards;}
body[data-theme="warcamp"] .play .rule s{animation:drawRule .8s cubic-bezier(.16,.8,.24,1) 6.1s forwards;}
body[data-theme="warcamp"] .play .tagline{animation:warcampArrive 1.1s cubic-bezier(.16,.8,.24,1) 6.45s forwards;}
body[data-theme="warcamp"] .play .cta{animation:warcampCta .95s cubic-bezier(.16,.8,.24,1) 7.25s forwards, ctaGlow 4.5s ease-in-out 8.45s infinite;}
body[data-theme="warcamp"] .play .crown-mini{animation:warcampArrive .9s cubic-bezier(.16,.8,.24,1) 7.5s forwards;}

/* CELESTIAL -- DRIFT -- everything floats up weightlessly, nothing lands hard. */
@keyframes celestialArrive{from{opacity:0;transform:translateY(30px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes celestialCta{from{opacity:0;transform:translateY(26px);filter:blur(11px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes celestialFlash{0%{opacity:0}40%{opacity:.5}100%{opacity:0}}
body[data-theme="celestial"] .play .halo{animation:fadeIn 2.2s ease-out 2.4s forwards, haloPulse 7s ease-in-out 4.699999999999999s infinite;}
body[data-theme="celestial"] .play .eyebrow{animation:celestialArrive 2.2s cubic-bezier(.24,.6,.26,1) 3.5s forwards;}
body[data-theme="celestial"] .play .impact{animation:celestialFlash 2.4s ease-out 5.95s forwards;}
body[data-theme="celestial"] .play .rule{animation:celestialArrive 1.8s cubic-bezier(.24,.6,.26,1) 6.6s forwards;}
body[data-theme="celestial"] .play .rule s{animation:drawRule 1.8s cubic-bezier(.24,.6,.26,1) 6.6s forwards;}
body[data-theme="celestial"] .play .tagline{animation:celestialArrive 2.4s cubic-bezier(.24,.6,.26,1) 7.0s forwards;}
body[data-theme="celestial"] .play .cta{animation:celestialCta 2s cubic-bezier(.24,.6,.26,1) 7.8s forwards, ctaGlow 4.5s ease-in-out 9.0s infinite;}
body[data-theme="celestial"] .play .crown-mini{animation:celestialArrive 2s cubic-bezier(.24,.6,.26,1) 8.2s forwards;}

/* ================= NINE SCRIPTS =================
   The motion languages made each beat behave differently, but every hall still
   performed the SAME beats, in the same order, for the same length, saying the
   same words. Seven elements, one running order, 8.6 seconds, nine times. That
   is one script with nine accents, not nine experiences.
   So the script itself now differs. A hall may not have an eyebrow at all. It
   may show the wordmark before the crest, or the crest last of everything. It
   may run under six seconds or over thirteen. Element set, running order and
   length are all the hall's own -- only "centred" and "ends on ENTER THE
   REALM" are fixed, because one is your instruction and the other is the door.
   Delays below OVERRIDE the motion-language timings above; the languages still
   supply the manner. */

/* SAPPHIRE -- THE STATE PORTRAIT -- the complete formal ceremony, every element, in
   order, evenly. The reference the other eight depart from. */
body[data-theme="sapphire"] .play .eyebrow{animation-delay:4.0s;}
body[data-theme="sapphire"] .play .crest-wrap{animation-delay:2.4s;}
body[data-theme="sapphire"] .play .rule{animation-delay:6.2s;}
body[data-theme="sapphire"] .play .tagline{animation-delay:6.5s;}
body[data-theme="sapphire"] .play .crown-mini{animation-delay:7.6s;}
body[data-theme="sapphire"] .play .cta{animation-delay:7.4s;}
body[data-theme="sapphire"] .play .rule s{animation-delay:6.2s;}
body[data-theme="sapphire"] .play .impact{animation-delay:5.95s;}
body[data-theme="sapphire"] .play .halo{animation-delay:3.0s,5.3s;}
body[data-theme="sapphire"] .play .bar.top,body[data-theme="sapphire"] .play .bar.bot{animation-delay:.2s,6.6s;}

/* CORONATION -- THE CROWNING -- the crest arrives ALONE and is left to hold in silence
   for three full seconds. No eyebrow; the crest is the announcement. Then
   the rest follows it in a rush, and the crown is set BEFORE the invitation. */
body[data-theme="coronation"] .play .eyebrow{animation-delay:3.6s;}
body[data-theme="coronation"] .play .crest-wrap{animation-delay:2.0s;}
body[data-theme="coronation"] .play .rule{animation-delay:6.5s;}
body[data-theme="coronation"] .play .tagline{animation-delay:6.9s;}
body[data-theme="coronation"] .play .crown-mini{animation-delay:7.5s;}
body[data-theme="coronation"] .play .cta{animation-delay:8.3s;}
body[data-theme="coronation"] .play .rule s{animation-delay:6.5s;}
body[data-theme="coronation"] .play .impact{animation-delay:5.3s;}
body[data-theme="coronation"] .play .halo{animation-delay:2.6s,4.9s;}
body[data-theme="coronation"] .play .bar.top,body[data-theme="coronation"] .play .bar.bot{animation-delay:.2s,7.4s;}

/* MOONLIT -- THE SLOW REVEAL -- inverted and almost empty. The line of poetry comes
   FIRST, before anything is shown, and the kingdom resolves behind it. No
   rule, no crown. Four beats over eleven seconds, the quietest of the nine. */
body[data-theme="moonlit"] .rule{display:none;}
body[data-theme="moonlit"] .crown-mini{display:none;}
body[data-theme="moonlit"] .play .eyebrow{animation-delay:1.4s;}
body[data-theme="moonlit"] .play .crest-wrap{animation-delay:4.2s;}
body[data-theme="moonlit"] .play .tagline{animation-delay:2.2s;}
body[data-theme="moonlit"] .play .cta{animation-delay:9.2s;}
body[data-theme="moonlit"] .play .impact{animation-delay:6.7s;}
body[data-theme="moonlit"] .play .halo{animation-delay:4.8s,7.1s;}
body[data-theme="moonlit"] .play .bar.top,body[data-theme="moonlit"] .play .bar.bot{animation-delay:.2s,9.4s;}

/* EMBERS -- THE FORGE -- shortest and most violent. Three beats, nothing else: the
   WORD burns in first, out of nothing, then the crest drops onto it, then
   the door. No eyebrow, no rule, no tagline, no crown. Six seconds. */
body[data-theme="embers"] .rule{display:none;}
body[data-theme="embers"] .tagline{display:none;}
body[data-theme="embers"] .crown-mini{display:none;}
body[data-theme="embers"] .play .eyebrow{animation-delay:0.9s;}
body[data-theme="embers"] .play .crest-wrap{animation-delay:3.4s;}
body[data-theme="embers"] .play .cta{animation-delay:5.2s;}
body[data-theme="embers"] .play .impact{animation-delay:3.4s;}
body[data-theme="embers"] .play .halo{animation-delay:4.0s,6.3s;}
body[data-theme="embers"] .play .bar.top,body[data-theme="embers"] .play .bar.bot{animation-delay:.2s,4.6s;}

/* CATHEDRAL -- THE LITURGY -- longest and most ordered. The cross is set before the
   name: the rule draws BEFORE the wordmark. Long silences between beats.
   Twelve and a half seconds, the most patient of the nine. */
body[data-theme="cathedral"] .play .eyebrow{animation-delay:3.4s;}
body[data-theme="cathedral"] .play .crest-wrap{animation-delay:1.8s;}
body[data-theme="cathedral"] .play .rule{animation-delay:5.6s;}
body[data-theme="cathedral"] .play .tagline{animation-delay:9.0s;}
body[data-theme="cathedral"] .play .crown-mini{animation-delay:10.2s;}
body[data-theme="cathedral"] .play .cta{animation-delay:10.8s;}
body[data-theme="cathedral"] .play .rule s{animation-delay:5.6s;}
body[data-theme="cathedral"] .play .impact{animation-delay:7.3s;}
body[data-theme="cathedral"] .play .halo{animation-delay:2.4s,4.7s;}
body[data-theme="cathedral"] .play .bar.top,body[data-theme="cathedral"] .play .bar.bot{animation-delay:.2s,10.4s;}

/* STORM -- THE STRIKE -- two beats. Everything the hall has arrives in one instant
   on a single flash, then the door. Under six seconds; nothing builds. */
body[data-theme="storm"] .crown-mini{display:none;}
body[data-theme="storm"] .play .eyebrow{animation-delay:2.9s;}
body[data-theme="storm"] .play .crest-wrap{animation-delay:2.9s;}
body[data-theme="storm"] .play .rule{animation-delay:2.9s;}
body[data-theme="storm"] .play .tagline{animation-delay:2.9s;}
body[data-theme="storm"] .play .cta{animation-delay:4.5s;}
body[data-theme="storm"] .play .rule s{animation-delay:2.9s;}
body[data-theme="storm"] .play .impact{animation-delay:2.85s;}
body[data-theme="storm"] .play .halo{animation-delay:3.5s,5.8s;}
body[data-theme="storm"] .play .bar.top,body[data-theme="storm"] .play .bar.bot{animation-delay:.2s,3.8s;}

/* DRAGONGATE -- THE PROCESSION -- one thing at a time, evenly spaced, out of depth. The
   imperial mark leads and the crest comes late, so you are walked in rather
   than shown. No rule. */
body[data-theme="dragongate"] .rule{display:none;}
body[data-theme="dragongate"] .play .eyebrow{animation-delay:3.4s;}
body[data-theme="dragongate"] .play .crest-wrap{animation-delay:5.6s;}
body[data-theme="dragongate"] .play .tagline{animation-delay:8.2s;}
body[data-theme="dragongate"] .play .crown-mini{animation-delay:2.2s;}
body[data-theme="dragongate"] .play .cta{animation-delay:9.2s;}
body[data-theme="dragongate"] .play .impact{animation-delay:6.9s;}
body[data-theme="dragongate"] .play .halo{animation-delay:6.2s,8.5s;}
body[data-theme="dragongate"] .play .bar.top,body[data-theme="dragongate"] .play .bar.bot{animation-delay:.2s,8.4s;}

/* WARCAMP -- THE MUSTER -- everything arrives in PAIRS, on a drum. Eyebrow and rule
   together, then crest, then wordmark and tagline together, then the door.
   No crown; a camp does not display one. */
body[data-theme="warcamp"] .crown-mini{display:none;}
body[data-theme="warcamp"] .play .eyebrow{animation-delay:2.6s;}
body[data-theme="warcamp"] .play .crest-wrap{animation-delay:4.2s;}
body[data-theme="warcamp"] .play .rule{animation-delay:2.6s;}
body[data-theme="warcamp"] .play .tagline{animation-delay:6.0s;}
body[data-theme="warcamp"] .play .cta{animation-delay:7.6s;}
body[data-theme="warcamp"] .play .rule s{animation-delay:2.6s;}
body[data-theme="warcamp"] .play .impact{animation-delay:5.95s;}
body[data-theme="warcamp"] .play .halo{animation-delay:4.8s,7.1s;}
body[data-theme="warcamp"] .play .bar.top,body[data-theme="warcamp"] .play .bar.bot{animation-delay:.2s,6.4s;}

/* CELESTIAL -- THE CONSTELLATION -- nothing is where you expect it. The crown appears
   first out of empty sky, then the line, then the name, and the crest comes
   LAST of all, after everything it is supposed to introduce. Thirteen
   seconds, the slowest of the nine. */
body[data-theme="celestial"] .play .eyebrow{animation-delay:6.4s;}
body[data-theme="celestial"] .play .crest-wrap{animation-delay:9.2s;}
body[data-theme="celestial"] .play .rule{animation-delay:7.8s;}
body[data-theme="celestial"] .play .tagline{animation-delay:3.0s;}
body[data-theme="celestial"] .play .crown-mini{animation-delay:1.6s;}
body[data-theme="celestial"] .play .cta{animation-delay:11.2s;}
body[data-theme="celestial"] .play .rule s{animation-delay:7.8s;}
body[data-theme="celestial"] .play .impact{animation-delay:9.1s;}
body[data-theme="celestial"] .play .halo{animation-delay:9.8s,12.1s;}
body[data-theme="celestial"] .play .bar.top,body[data-theme="celestial"] .play .bar.bot{animation-delay:.2s,11.0s;}

/* ================= HOW THE WORDMARK ARRIVES =================
   Every hall spelled KINGDOM 846 out letter by letter, left to right, with a
   light pass over it afterwards. Nine times. That single piece of choreography
   did more than anything else to make the set feel like one screen wearing
   different clothes, and it is the thing that was disliked.
   It is gone from eight of the nine. The stagger is set per hall in JS, so the
   letters now land together and the WORD arrives, in a way that belongs to the
   room. Only Celestial keeps a per-letter reveal, and there it is randomised
   rather than sequential -- stars do not come out in reading order. */

/* Coronation -- struck, not typed. It comes down onto the page and stops. */
body[data-theme="coronation"] .play .title span{animation:titleStamp .82s cubic-bezier(.2,1.1,.26,1) forwards;}
@keyframes titleStamp{0%{opacity:0;transform:scale(1.24);filter:blur(14px) brightness(2.4)}
  62%{opacity:1;transform:scale(.985);filter:blur(0) brightness(1.35)}
  100%{opacity:1;transform:scale(1);filter:var(--title-lit)}}

/* Ember Throne -- it does not move at all. It comes up to heat, the way iron
   does in a forge: black, then red, then gold. */
body[data-theme="embers"] .play .title span{animation:titleHeat 2.1s cubic-bezier(.3,.4,.2,1) forwards;}
@keyframes titleHeat{
  0%{opacity:0;filter:brightness(.06) sepia(1) saturate(6) hue-rotate(-32deg) blur(3px)}
  18%{opacity:1;filter:brightness(.34) sepia(1) saturate(8) hue-rotate(-30deg) blur(1px)}
  55%{opacity:1;filter:brightness(1.5) sepia(.7) saturate(4) hue-rotate(-14deg) blur(0)}
  100%{opacity:1;filter:var(--title-lit)}}

/* Ivory Cathedral -- light opens across it from the centre, like a shutter
   being drawn back off an inscription. The wipe is on the word, not the
   letters, so it reads as one movement of light. */
body[data-theme="cathedral"] .play .title span{animation:fadeIn .6s ease-out forwards;}
body[data-theme="cathedral"] .play .title{animation:titleWipe 1.9s cubic-bezier(.24,.62,.24,1) 4.8s backwards;}
@keyframes titleWipe{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 -2% 0 -2%)}}

/* Storm -- there is no build. The strike happens and the word is simply
   there, blown out white for an instant and then cold. */
body[data-theme="storm"] .play .title span{animation:titleFlash 1.15s cubic-bezier(.1,.9,.2,1) forwards;}
@keyframes titleFlash{0%{opacity:0;filter:brightness(6) blur(6px)}
  4%{opacity:1;filter:brightness(5) blur(0)}
  16%{opacity:1;filter:brightness(1.1)}
  22%{opacity:.72}
  30%{opacity:1;filter:brightness(2.4)}
  100%{opacity:1;filter:var(--title-lit)}}

/* Celestial -- the only per-letter reveal left, and deliberately out of order.
   The delays are randomised in JS. */
body[data-theme="celestial"] .play .title span{animation:letterStar 1.9s ease-out forwards;}
@keyframes letterStar{from{opacity:0;transform:scale(.82);filter:blur(10px) brightness(2.6)}
  to{opacity:1;transform:none;filter:var(--title-lit)}}

/* 02 Coronation Hall -- ceremony. An ornate swashed cut, the heaviest weight
   in the set, tracking pulled in so the word sits like a struck medal, and the
   largest crest: this hall is about the crown, not the room. */
body[data-theme="coronation"]{--disp:'Cinzel Decorative',serif;--disp-w:900;--disp-track:.035em;
  --disp-size:clamp(34px,min(7.2vw,8.1vh),78px);--crest-h:clamp(200px,46vh,510px);
  --cta-track:.34em;--orn:'\2767\FE0E';}

/* 03 Moonlit Realm -- whispered, not announced. The thinnest weight, the
   widest tracking, the smallest wordmark and a reduced crest, so most of the
   frame is night. */
body[data-theme="moonlit"]{--crest-lift:.35;--disp:'Cormorant Garamond',serif;--disp-w:300;--disp-track:.3em;
  --disp-size:clamp(32px,min(6.8vw,7.8vh),72px);--crest-h:clamp(165px,37vh,410px);
  --eyebrow-track:.5em;--eyebrow-w:400;--tag-w:300;--orn:'\2727\FE0E';}

/* 04 Ember Throne -- no serifs, no grace, no restraint. A brutal condensed cut
   at nearly twice the baseline size with the crest cut back: here the WORD is
   the monument and the hall is only its furnace. */
body[data-theme="embers"]{--disp:'Bebas Neue',sans-serif;--disp-w:400;--disp-track:.045em;
  --disp-size:clamp(54px,min(12vw,13vh),138px);--crest-h:clamp(150px,32vh,350px);
  --eyebrow-track:.42em;--cta-fam:'Bebas Neue',sans-serif;--cta-w:400;--cta-track:.26em;
  --cta-radius:0;--orn:'\25C6\FE0E';}

/* 05 Ivory Cathedral -- carved into the wall rather than printed. Inscriptional
   small caps, generous tracking, the tallest crest, and a maltese cross for
   the ornament. */
body[data-theme="cathedral"]{--crest-lift:.55;--disp:'Marcellus SC',serif;--disp-w:400;--disp-track:.17em;
  --disp-size:clamp(35px,min(7.4vw,8.1vh),78px);--crest-h:clamp(205px,47vh,520px);
  --eyebrow-track:.4em;--orn:'\2720\FE0E';}

/* 06 Storm Fortress -- severe, not utilitarian.
   This was Oswald, chosen by reading "militaristic" too literally. A condensed
   grotesque read as a sports poster against eight screens that read as a realm;
   the tagline inherited it and lost every bit of its elegance; and the triangle
   ornament looked like a dropdown caret. The hall is not a barracks -- it is a
   black gothic cathedral in a lightning storm, so the type wants to be severe
   and dramatic, not functional.
   Bodoni Moda at 900: hairlines against heavy stems, which is the letterform
   equivalent of what the sky is doing. Cold, sharp, and the only high-contrast
   didone in the set, so it cannot be mistaken for the other eight. The square
   corners stay -- that part was right. The button keeps Cinzel, because
   Bodoni's hairlines vanish at 11px. */
body[data-theme="storm"]{--crest-lift:.30;--disp:'Playfair Display',serif;--disp-w:900;--disp-track:.09em;
  --disp-size:clamp(40px,min(8.4vw,8.6vh),82px);--crest-h:clamp(178px,38vh,420px);
  --eyebrow-track:.36em;--eyebrow-w:600;
  --tag-fam:'Playfair Display',serif;--tag-style:italic;--tag-w:500;--tag-track:.03em;
  --cta-w:600;--cta-track:.26em;--cta-radius:0;--orn:'\2739\FE0E';}

/* 07 Dragon Gate -- monumental. A heavy flared display with brutal thick/thin
   contrast, the kind of letterform that belongs carved above an arch. */
body[data-theme="dragongate"]{--disp:'Yeseva One',serif;--disp-w:400;--disp-track:.05em;
  --disp-size:clamp(39px,min(8.2vw,8.6vh),86px);--crest-h:clamp(200px,45vh,490px);
  --eyebrow-track:.38em;--orn:'\2756\FE0E';}

/* 08 Royal War Camp -- a standard stitched in the field, not set in a print
   shop. Rugged, blackletter-adjacent, still readable at a glance. */
body[data-theme="warcamp"]{--crest-lift:.72;--disp:'Bevan',serif;--disp-w:400;--disp-track:.085em;
  --disp-size:clamp(44px,min(9.4vw,9.9vh),100px);
  --cta-fam:'Cinzel',serif;--cta-w:600;--cta-track:.24em;--orn:'\2748\FE0E';}

/* 09 Celestial Palace -- weightless. The thinnest face in the set at the widest
   tracking, small against an enormous amount of nothing. */
body[data-theme="celestial"]{--disp:'Italiana',serif;--disp-w:400;--disp-track:.38em;
  --disp-size:clamp(30px,min(6.4vw,7.4vh),68px);--crest-h:clamp(165px,37vh,410px);
  --eyebrow-track:.54em;--eyebrow-w:400;--cta-track:.38em;--orn:'\2735\FE0E';}

/* This was a single enormous saturated radial covering most of the screen at
   full opacity -- a coloured blob, which is exactly why it read as crude.
   A real light burst is small, white at its core, and violent for a fraction of
   a second: the colour lives in the falloff, not in the middle, and the whole
   thing SCALES rather than just fading up. Three layers -- a white core, the
   hall's colour around it, and a wide dim wash -- over a much tighter radius. */
/* THE EXIT ONLY DARKENS.
   There was still a .flash here -- a bloom in the hall's own colour. It was
   recoloured, rescaled and softened over several rounds, but a bloom is a
   brightening, and a brightening is a flash however carefully it is done. It
   showed worst on the warm halls, where gold light over a gold room has the
   least to hide behind. Measured on whole-screen average the rise was still
   +7 on Coronation, +9 on Cathedral, +12 on Storm -- and an average understates
   a bloom that is concentrated in one part of the frame.
   Deleted, not tuned. The gate now does what The Approach does: the room
   pushes past, the content is pulled through it, and the screen closes to the
   site's own ground. Nothing on screen ever becomes brighter than it was. */
.entering .blackout{z-index:55;animation:gateVeil 1.05s cubic-bezier(.4,0,.6,1) .2s forwards;}
@keyframes gateVeil{from{opacity:0}to{opacity:1}}

.entering .content{animation:contentOut 1.6s cubic-bezier(.5,0,.2,1) forwards;}
@keyframes contentOut{to{opacity:0;transform:scale(1.34);filter:blur(20px)}}

@media (max-width:720px){
  .title{letter-spacing:.06em}.eyebrow{letter-spacing:.22em;font-size:8.5px}.eyebrow s{width:20px}
  .crest-wrap{height:32vh}.bar{height:8vh}
  .hud.right{flex-direction:column;align-items:flex-end;max-height:82vh;overflow:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-delay:0ms !important;}}
</style>
</head>

  <div class="bar bot"></div>

  <div class="hud left"><button id="replay" type="button">REPLAY</button><button id="skip" type="button">SKIP INTRO</button></div>
  <div class="hud right">
    <button class="theme on" data-theme="sapphire">SAPPHIRE HALL</button>
    <button class="theme" data-theme="coronation">CORONATION</button>
    <button class="theme" data-theme="moonlit">MOONLIT REALM</button>
    <button class="theme" data-theme="embers">EMBER THRONE</button>
    <button class="theme" data-theme="cathedral">IVORY CATHEDRAL</button>
    <button class="theme" data-theme="storm">STORM FORTRESS</button>
    <button class="theme" data-theme="dragongate">DRAGON GATE</button>
    <button class="theme" data-theme="warcamp">ROYAL WAR CAMP</button>
    <button class="theme" data-theme="celestial">CELESTIAL PALACE</button>
    <button id="sound">SOUND ON</button>
  </div>

  <div class="content" id="content">
    <div class="eyebrow"><s></s><b>ONE CROWN</b> <em>&#10022;</em> <b>FOUR ALLIANCES</b><s></s></div>

    <div class="crest-stack">
