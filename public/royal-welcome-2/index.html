<!-- Nine halls, nine voices -- and the faces ship with the build.
     These were on Google Fonts, which meant every visitor waited on a third
     party and, if it was slow or blocked, silently got the same fallback serif
     on all nine screens. That failure is invisible: the layout still renders,
     the nine just stop being different, which is the one thing they have to be.
     Self-hosted, they cannot fall back, they cost no third-party round trip,
     and no visitor's IP is handed to another host to read a wordmark.
     Latin subsets only; Cinzel, Cormorant and Oswald are variable files that
     serve every weight from one download. 240KB for the set, and a browser
     only fetches the face its hall actually sets. -->

<style>
:root{
  --gold-hi:#fff4d0; --gold-1:#f7e6ae; --gold-2:#e6c266; --gold-3:#b98a30;
  --champagne:#efdfb4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;overflow:hidden;}
body{font-family:'Cinzel',serif;color:var(--champagne);-webkit-font-smoothing:antialiased;}

.stage{position:fixed;inset:0;overflow:hidden;background:#000;}

/* ---- LIVE BACKGROUND (WebGL) ---- */
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* still-image fallback if WebGL is unavailable */
.fallback{position:absolute;inset:-4%;background:var(--bg-img) center 52%/cover no-repeat;display:none;}
body.nogl .fallback{display:block;}
body.nogl #bg{display:none;}

/* Depth + drifting particles */
#dust{position:absolute;inset:0;pointer-events:none;opacity:0;}
.play #dust{animation:fadeIn 3.2s ease-out 2s forwards;}

.vignette{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(115% 82% at 50% 46%, rgba(0,0,0,0) 36%, rgba(0,0,0,.52) 74%, rgba(0,0,0,.94) 100%),
    linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0) 44%);}

.grain{position:absolute;inset:-100%;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.7'/></svg>");
  animation:grainShift .5s steps(3) infinite;}
@keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

.bar{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:35;pointer-events:none;}
.bar.top{top:0;transform:translateY(-100%);}
.bar.bot{bottom:0;transform:translateY(100%);}
.play .bar.top{animation:barIn 1.4s cubic-bezier(.16,.72,.24,1) .2s forwards, barOutT 1.8s cubic-bezier(.16,.72,.24,1) 6.6s forwards;}
.play .bar.bot{animation:barIn 1.4s cubic-bezier(.16,.72,.24,1) .2s forwards, barOutB 1.8s cubic-bezier(.16,.72,.24,1) 6.6s forwards;}
@keyframes barIn{to{transform:translateY(0)}}
@keyframes barOutT{to{transform:translateY(-100%)}}
@keyframes barOutB{to{transform:translateY(100%)}}

.blackout{position:absolute;inset:0;background:#000;z-index:30;pointer-events:none;}
.play .blackout{animation:fadeOut 2s ease-out 1.2s forwards;}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===================== CONTENT ===================== */
.content{position:relative;z-index:20;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,1.1vh,16px);padding:clamp(26px,6vh,74px) 22px clamp(34px,7vh,86px);text-align:center;
  will-change:transform;transition:transform .9s cubic-bezier(.16,.72,.24,1);}

.eyebrow{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
  font-weight:500;font-size:clamp(8.5px,1.05vw,14px);letter-spacing:var(--eyebrow-track);opacity:0;white-space:nowrap;
  text-shadow:0 0 20px rgba(230,194,102,.4);}
.eyebrow b{font-weight:var(--eyebrow-w);}
.eyebrow s{text-decoration:none;display:block;width:clamp(24px,5vw,74px);height:1px;
  background:linear-gradient(90deg,rgba(230,194,102,0),rgba(230,194,102,.85));}
.eyebrow s:last-child{background:linear-gradient(90deg,rgba(230,194,102,.85),rgba(230,194,102,0));}
.eyebrow em{font-style:normal;color:var(--gold-2);font-size:0;}
.eyebrow em::before{content:var(--orn);font-size:11px;font-family:'Cinzel',serif;}
.play .eyebrow{animation:eyebrowIn 1.1s cubic-bezier(.22,.61,.36,1) 4.0s forwards;}
@keyframes eyebrowIn{from{opacity:0;letter-spacing:.18em;filter:blur(5px)}to{opacity:.95;letter-spacing:.40em;filter:blur(0)}}

.crest-stack{position:relative;display:flex;flex-direction:column;align-items:center;}
.crest-wrap{position:relative;height:var(--crest-h);aspect-ratio:1024/1536;
  opacity:0;transform:translateY(34px) scale(.86);filter:blur(20px);will-change:opacity,transform,filter;}
.play .crest-wrap{animation:crestIn 1.7s cubic-bezier(.16,.74,.22,1) 2.4s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestIn{from{opacity:0;transform:translateY(34px) scale(.86);filter:blur(20px)}
                   to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes crestFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.crest{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 50px rgba(230,194,102,.26)) drop-shadow(0 22px 46px rgba(0,0,0,.8));}

.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background-image:linear-gradient(103deg,rgba(255,240,200,0) 39%,rgba(255,242,208,.18) 46%,
    rgba(255,250,230,.66) 50%,rgba(255,242,208,.18) 54%,rgba(255,240,200,0) 61%);
  background-size:320% 100%;background-repeat:no-repeat;background-position:-130% 0;
  -webkit-mask:url('assets/crest.webp') center/contain no-repeat;mask:url('assets/crest.webp') center/contain no-repeat;}
.play .sheen{animation:lightPass 1.7s cubic-bezier(.4,0,.25,1) 3.4s forwards, lightPass 2.1s cubic-bezier(.4,0,.25,1) 12s infinite;}
@keyframes lightPass{0%{opacity:0;background-position:-130% 0}10%{opacity:1}88%{opacity:1}100%{opacity:0;background-position:230% 0}}

.halo{position:absolute;left:50%;top:50%;width:190%;height:135%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:radial-gradient(closest-side, rgba(var(--acc),.20), rgba(var(--acc),0) 70%),
             radial-gradient(closest-side, rgba(var(--acc2),.14), rgba(var(--acc2),0) 62%);}
.play .halo{animation:fadeIn 2.2s ease-out 3.1s forwards, haloPulse 7s ease-in-out 5.4s infinite;}
@keyframes haloPulse{0%,100%{opacity:1}50%{opacity:.55}}

.title{display:flex;justify-content:center;flex-wrap:nowrap;position:relative;
  margin-top:clamp(2px,1.2vh,16px);line-height:1;
  font-family:var(--disp);font-weight:var(--disp-w);
  font-size:var(--disp-size);letter-spacing:var(--disp-track);}
.title span{display:inline-block;opacity:0;transform:translateY(22px) scale(.94);
  background:linear-gradient(178deg,#fffaf0 0%,var(--gold-hi) 14%,var(--gold-1) 30%,var(--gold-2) 50%,var(--gold-3) 68%,#f5e6b5 86%,#c99f45 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,246,219,.4)) drop-shadow(0 4px 14px rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(230,194,102,.26));}
.title span.sp{width:.36em;}
.play .title span{animation:letterIn .85s cubic-bezier(.16,.74,.22,1) forwards;}
@keyframes letterIn{from{opacity:0;transform:translateY(22px) scale(.94);filter:blur(12px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:var(--title-lit);}}

/* ---------- how each hall composes itself ----------
   The nine used to share one entrance: crest drops, letters rise, done. That
   made the choice between them almost entirely a choice of wallpaper. The
   schedule below is deliberately unchanged -- the crest still lands at 2.4s
   and the letters still run from 4.85s, so the score still hits with the
   impact -- but the CHARACTER of the motion now belongs to the room.
   Sapphire keeps the composed default; it is the flagship and the baseline
   the others are read against. */

/* Coronation -- ceremonial. The crest is set down with weight, and the letters
   rise like a fanfare rather than settling. */
body[data-theme="coronation"] .play .crest-wrap{
  animation:crestSet 1.9s cubic-bezier(.2,.9,.24,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestSet{0%{opacity:0;transform:translateY(-46px) scale(1.08);filter:blur(18px)}
  62%{opacity:1;transform:translateY(6px) scale(.99);filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
body[data-theme="coronation"] .play .title span{animation:letterRise 1s cubic-bezier(.16,.8,.24,1) forwards;}
@keyframes letterRise{from{opacity:0;transform:translateY(46px) scale(.9);filter:blur(14px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Moonlit -- mysterious. Nothing arrives; it resolves out of the mist. */
body[data-theme="moonlit"] .play .crest-wrap{
  animation:crestMist 2.5s cubic-bezier(.24,.6,.26,1) 2.0s forwards, crestFloat 10s ease-in-out 4.4s infinite;}
@keyframes crestMist{from{opacity:0;transform:translateY(8px) scale(.98);filter:blur(34px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="moonlit"] .play .title span{animation:letterMist 1.5s ease-out forwards;}
@keyframes letterMist{from{opacity:0;transform:none;filter:blur(20px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Ember Throne -- forceful. The crest arrives hot and the letters catch like
   fire taking hold, flickering before they hold steady. */
body[data-theme="embers"] .play .crest-wrap{
  animation:crestForge 1.4s cubic-bezier(.1,.9,.2,1) 2.5s forwards, crestFloat 7s ease-in-out 4.4s infinite;}
@keyframes crestForge{0%{opacity:0;transform:translateY(52px) scale(.8);filter:blur(24px) brightness(2.2)}
  55%{opacity:1;transform:translateY(-5px) scale(1.03);filter:blur(0) brightness(1.5)}
  100%{opacity:1;transform:none;filter:blur(0) brightness(1)}}
body[data-theme="embers"] .play .title span{animation:letterCatch .95s ease-out forwards;}
@keyframes letterCatch{0%{opacity:0;transform:translateY(20px);filter:blur(12px)}
  40%{opacity:1}52%{opacity:.45}62%{opacity:1}72%{opacity:.7}
  100%{opacity:1;transform:none;filter:var(--title-lit);}}

/* Ivory Cathedral -- sacred. Everything blooms open out of the light instead
   of moving through space. */
body[data-theme="cathedral"] .play .crest-wrap{
  animation:crestBloom 2.2s cubic-bezier(.2,.7,.24,1) 2.2s forwards, crestFloat 9s ease-in-out 4.4s infinite;}
@keyframes crestBloom{0%{opacity:0;transform:scale(.76);filter:blur(26px) brightness(2.4)}
  100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
body[data-theme="cathedral"] .play .title span{animation:letterBloom 1.2s ease-out forwards;}
@keyframes letterBloom{from{opacity:0;transform:scale(.88);filter:blur(16px) brightness(2)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Storm Fortress -- dramatic. The crest is revealed by the strike, and the
   letters snap in hard rather than easing. */
body[data-theme="storm"] .play .crest-wrap{
  animation:crestStrike 1.5s cubic-bezier(.14,.86,.2,1) 2.4s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestStrike{0%{opacity:0;transform:scale(1.04);filter:blur(20px) brightness(3)}
  12%{opacity:1;filter:blur(2px) brightness(2.6)}22%{opacity:.35;filter:blur(6px) brightness(1)}
  34%{opacity:1;filter:blur(0) brightness(2)}48%{opacity:.8}
  100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
body[data-theme="storm"] .play .title span{animation:letterSnap .55s cubic-bezier(.2,1.5,.3,1) forwards;}
@keyframes letterSnap{0%{opacity:0;transform:translateY(14px) scale(1.14);filter:blur(9px)}
  100%{opacity:1;transform:none;filter:var(--title-lit);}}

/* Dragon Gate -- monumental. The crest comes forward out of depth, so the
   entrance feels like crossing the gate rather than watching it. */
body[data-theme="dragongate"] .play .crest-wrap{
  animation:crestApproach 2.1s cubic-bezier(.22,.68,.24,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestApproach{from{opacity:0;transform:scale(1.42);filter:blur(28px)}
  to{opacity:1;transform:scale(1);filter:blur(0)}}
body[data-theme="dragongate"] .play .title span{animation:letterApproach 1.05s cubic-bezier(.2,.72,.24,1) forwards;}
@keyframes letterApproach{from{opacity:0;transform:scale(1.5);filter:blur(16px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}

/* Royal War Camp -- the standard going up. Everything is raised from below. */
body[data-theme="warcamp"] .play .crest-wrap{
  animation:crestRaise 2s cubic-bezier(.18,.78,.22,1) 2.3s forwards, crestFloat 8s ease-in-out 4.4s infinite;}
@keyframes crestRaise{from{opacity:0;transform:translateY(76px) scale(.94);filter:blur(18px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="warcamp"] .play .title span{animation:letterRise 1s cubic-bezier(.16,.8,.24,1) forwards;}

/* Celestial Palace -- weightless. Everything drifts up and keeps drifting. */
body[data-theme="celestial"] .play .crest-wrap{
  animation:crestDrift 2.8s cubic-bezier(.26,.58,.28,1) 1.9s forwards, crestFloat 12s ease-in-out 4.4s infinite;}
@keyframes crestDrift{from{opacity:0;transform:translateY(64px) scale(.92);filter:blur(22px)}
  to{opacity:1;transform:none;filter:blur(0)}}
body[data-theme="celestial"] .play .title span{animation:letterDrift 1.6s cubic-bezier(.24,.6,.26,1) forwards;}
@keyframes letterDrift{from{opacity:0;transform:translateY(38px);filter:blur(14px)}
  to{opacity:1;transform:none;filter:var(--title-lit);}}
.title::after{content:"";position:absolute;inset:-10% -4%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,252,235,.65) 50%,rgba(255,255,255,0) 58%);
  background-size:300% 100%;background-position:-120% 0;}
.play .title::after{animation:titleSheen 1.6s ease-out 6.05s forwards, titleSheen 2.4s ease-in-out 13s infinite;}
@keyframes titleSheen{0%{opacity:0;background-position:-120% 0}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;background-position:220% 0}}

.impact{position:absolute;inset:0;z-index:24;pointer-events:none;opacity:0;
  background:radial-gradient(58% 42% at 50% 50%, rgba(var(--acc),.32), rgba(var(--acc),0) 70%);}
.play .impact{animation:flash 900ms ease-out 5.95s forwards;}
@keyframes flash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}

.rule{display:flex;align-items:center;justify-content:center;gap:14px;width:min(520px,72vw);opacity:0;}
.rule s{text-decoration:none;display:block;height:1px;flex:1;transform:scaleX(0);transform-origin:right center;
  background:linear-gradient(90deg,rgba(230,194,102,0),rgba(230,194,102,.9));}
.rule s:last-child{background:linear-gradient(90deg,rgba(230,194,102,.9),rgba(230,194,102,0));transform-origin:left center;}
.rule i{font-style:normal;color:var(--gold-2);font-size:0;text-shadow:0 0 14px rgba(230,194,102,.75);}
.rule i::before{content:var(--orn);font-size:13px;font-family:'Cinzel',serif;}
.play .rule{animation:fadeIn .8s ease-out 6.2s forwards;}
.play .rule s{animation:drawRule 1.1s cubic-bezier(.16,.74,.22,1) 6.2s forwards;}
@keyframes drawRule{to{transform:scaleX(1)}}

.tagline{font-family:var(--tag-fam);font-style:var(--tag-style);font-weight:var(--tag-w);
  font-size:clamp(14px,2vw,27px);letter-spacing:var(--tag-track);color:#ecdfc0;opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.9);}
.play .tagline{animation:taglineIn 1.2s cubic-bezier(.22,.61,.36,1) 6.5s forwards;}
@keyframes taglineIn{from{opacity:0;transform:translateY(12px);filter:blur(7px)}
                     to{opacity:.96;transform:translateY(0);filter:blur(0)}}

.cta{position:relative;margin-top:clamp(10px,2.4vh,30px);
  padding:clamp(13px,1.7vh,18px) clamp(28px,4.4vw,56px);
  font-family:var(--cta-fam);font-weight:var(--cta-w);font-size:clamp(10.5px,1.1vw,15px);letter-spacing:var(--cta-track);
  color:#241a08;background:linear-gradient(180deg,#fff5d6 0%,var(--gold-1) 26%,var(--gold-2) 52%,var(--gold-3) 82%,#f3e2ab 100%);
  border:1px solid rgba(255,246,214,.7);border-radius:var(--cta-radius);cursor:pointer;overflow:hidden;opacity:0;
  box-shadow:0 0 0 1px rgba(111,76,19,.6), 0 16px 46px rgba(0,0,0,.7), 0 0 34px rgba(230,194,102,.22);
  transition:transform .35s cubic-bezier(.16,.72,.24,1), filter .35s ease, letter-spacing .35s ease;}
.play .cta{animation:ctaIn 1s cubic-bezier(.16,.74,.22,1) 7.4s forwards, ctaGlow 4.5s ease-in-out 8.6s infinite;}
@keyframes ctaIn{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes ctaGlow{0%,100%{box-shadow:0 0 0 1px rgba(111,76,19,.6),0 16px 46px rgba(0,0,0,.7),0 0 26px rgba(230,194,102,.2)}
                   50%{box-shadow:0 0 0 1px rgba(111,76,19,.6),0 16px 46px rgba(0,0,0,.7),0 0 58px rgba(230,194,102,.48)}}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:42%;height:100%;transform:skewX(-18deg);
  background:linear-gradient(104deg,rgba(255,255,255,0),rgba(255,255,255,.8),rgba(255,255,255,0));
  animation:ctaSheen 5.5s ease-in-out 9s infinite;}
@keyframes ctaSheen{0%,74%{left:-60%}100%{left:135%}}
.cta:hover{transform:translateY(-2px) scale(1.025);filter:brightness(1.07);letter-spacing:.34em;}
.cta:active{transform:translateY(0) scale(.99);}
.crown-mini{color:var(--gold-2);font-size:13px;letter-spacing:.5em;opacity:0;margin-top:6px;text-shadow:0 0 16px rgba(230,194,102,.7);}
.play .crown-mini{animation:fadeIn 1s ease-out 7.6s forwards;}

.frame{position:absolute;inset:clamp(14px,2.4vw,36px);pointer-events:none;opacity:0;z-index:18;}
.play .frame{animation:fadeIn 1.8s ease-out 4.6s forwards;}
.frame i{position:absolute;width:clamp(40px,5.4vw,82px);height:clamp(40px,5.4vw,82px);border:1px solid rgba(230,194,102,.42);}

/* ---------- each hall gets its own light ----------
   Every theme used to share one warm cream-and-gold treatment: the same
   entrance flash, the same crest halo, the same impact bloom, the same glow on
   the wordmark. In a gold hall that is right. On Sapphire, Moonlit, Storm and
   Celestial it was a warm flash going off in a cold room, which is what made
   the entrance read wrong. Each theme now carries its own accent, seeded from
   the ray colour its own shader already lights the scene with, so the flash
   belongs to the room it happens in.
   --acc is the light itself, --acc2 the deeper edge of it, --flash-pos where
   it originates: fire halls bloom up from the braziers, Cathedral and Storm
   come from above. */
/* ---------- nine voices ----------
   Everything below is a token the layout reads, so a hall changes its face,
   its weight, its tracking, its scale, its crest and its ornament without a
   single bespoke rule. The point is that no two of these should be mistakable
   for each other with the artwork removed -- the type alone should tell you
   which hall you are standing in.
   Ornaments carry U+FE0E so they render as typography, not as colour emoji. */
body{
  --disp:'Cinzel',serif; --disp-w:800; --disp-track:.1em;
  --disp-size:clamp(30px,6.6vw,92px);
  --crest-h:clamp(190px,42vh,470px);
  --eyebrow-track:.34em; --eyebrow-w:500;
  --tag-fam:'Cormorant Garamond',serif; --tag-style:italic; --tag-w:300; --tag-track:.055em;
  --cta-fam:'Cinzel',serif; --cta-w:600; --cta-track:.3em; --cta-radius:2px;
  --orn:'\2726\FE0E';

  --title-lit:drop-shadow(0 1px 0 rgba(255,246,219,.4)) drop-shadow(0 4px 14px rgba(0,0,0,.85)) drop-shadow(0 0 30px rgba(var(--acc),.30));}
body[data-theme="sapphire"]  {--acc:148,188,255;--acc2:94,140,232;}
body[data-theme="coronation"]{--acc:255,224,160;--acc2:255,182,88; --flash-pos:50% 74%;}
body[data-theme="moonlit"]   {--acc:196,222,255;--acc2:140,176,236;}
body[data-theme="embers"]    {--acc:255,150,64; --acc2:214,52,14;  --flash-pos:50% 80%;}
body[data-theme="cathedral"] {--acc:255,246,220;--acc2:255,214,140;--flash-pos:50% 24%;}
body[data-theme="storm"]     {--acc:214,232,255;--acc2:104,152,255;--flash-pos:50% 12%;}
body[data-theme="dragongate"]{--acc:255,176,88; --acc2:230,90,28;  --flash-pos:50% 72%;}
body[data-theme="warcamp"]   {--acc:255,190,104;--acc2:224,104,36; --flash-pos:50% 76%;}
body[data-theme="celestial"] {--acc:154,198,255;--acc2:170,124,255;}

/* 01 Sapphire Hall -- Roman inscriptional capitals. The state portrait, and
   the baseline the other eight are read against. Nothing to change. */

/* 02 Coronation Hall -- ceremony. An ornate swashed cut, the heaviest weight
   in the set, tracking pulled in so the word sits like a struck medal, and the
   largest crest: this hall is about the crown, not the room. */
body[data-theme="coronation"]{--disp:'Cinzel Decorative',serif;--disp-w:900;--disp-track:.035em;
  --disp-size:clamp(27px,5.9vw,84px);--crest-h:clamp(200px,46vh,510px);
  --cta-track:.34em;--orn:'\2767\FE0E';}

/* 03 Moonlit Realm -- whispered, not announced. The thinnest weight, the
   widest tracking, the smallest wordmark and a reduced crest, so most of the
   frame is night. */
body[data-theme="moonlit"]{--disp:'Cormorant Garamond',serif;--disp-w:300;--disp-track:.3em;
  --disp-size:clamp(25px,5.4vw,74px);--crest-h:clamp(165px,37vh,410px);
  --eyebrow-track:.5em;--eyebrow-w:400;--tag-w:300;--orn:'\2727\FE0E';}

/* 04 Ember Throne -- no serifs, no grace, no restraint. A brutal condensed cut
   at nearly twice the baseline size with the crest cut back: here the WORD is
   the monument and the hall is only its furnace. */
body[data-theme="embers"]{--disp:'Bebas Neue',sans-serif;--disp-w:400;--disp-track:.045em;
  --disp-size:clamp(46px,10.4vw,146px);--crest-h:clamp(150px,32vh,350px);
  --eyebrow-track:.42em;--cta-fam:'Bebas Neue',sans-serif;--cta-w:400;--cta-track:.26em;
  --cta-radius:0;--orn:'\25C6\FE0E';}

/* 05 Ivory Cathedral -- carved into the wall rather than printed. Inscriptional
   small caps, generous tracking, the tallest crest, and a maltese cross for
   the ornament. */
body[data-theme="cathedral"]{--disp:'Marcellus SC',serif;--disp-w:400;--disp-track:.17em;
  --disp-size:clamp(28px,6.1vw,86px);--crest-h:clamp(205px,47vh,520px);
  --eyebrow-track:.4em;--orn:'\2720\FE0E';}

/* 06 Storm Fortress -- utilitarian. A hard condensed grotesque, tight and
   vertical, squared corners on the button. Nothing here is decorative. */
body[data-theme="storm"]{--disp:'Oswald',sans-serif;--disp-w:600;--disp-track:.15em;
  --disp-size:clamp(34px,7.6vw,106px);--crest-h:clamp(175px,37vh,410px);
  --eyebrow-track:.3em;--eyebrow-w:600;--tag-fam:'Oswald',sans-serif;--tag-style:normal;--tag-w:300;
  --cta-fam:'Oswald',sans-serif;--cta-w:600;--cta-track:.24em;--cta-radius:0;--orn:'\25BC\FE0E';}

/* 07 Dragon Gate -- monumental. A heavy flared display with brutal thick/thin
   contrast, the kind of letterform that belongs carved above an arch. */
body[data-theme="dragongate"]{--disp:'Yeseva One',serif;--disp-w:400;--disp-track:.05em;
  --disp-size:clamp(31px,6.8vw,94px);--crest-h:clamp(200px,45vh,490px);
  --eyebrow-track:.38em;--orn:'\2756\FE0E';}

/* 08 Royal War Camp -- a standard stitched in the field, not set in a print
   shop. Rugged, blackletter-adjacent, still readable at a glance. */
body[data-theme="warcamp"]{--disp:'Grenze Gotisch',serif;--disp-w:700;--disp-track:.07em;
  --disp-size:clamp(36px,8vw,112px);
  --cta-fam:'Grenze Gotisch',serif;--cta-w:700;--cta-track:.22em;--orn:'\2748\FE0E';}

/* 09 Celestial Palace -- weightless. The thinnest face in the set at the widest
   tracking, small against an enormous amount of nothing. */
body[data-theme="celestial"]{--disp:'Italiana',serif;--disp-w:400;--disp-track:.38em;
  --disp-size:clamp(23px,5vw,68px);--crest-h:clamp(165px,37vh,410px);
  --eyebrow-track:.54em;--eyebrow-w:400;--cta-track:.38em;--orn:'\2735\FE0E';}

.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(78% 66% at var(--flash-pos), rgba(var(--acc),.94), rgba(var(--acc2),.40) 46%, rgba(0,0,0,0) 78%);}

/* Storm does not bloom, it strikes: a double lightning pulse on the way out. */
body[data-theme="storm"].entering .flash{animation:enterStrike 1.7s linear forwards;}
@keyframes enterStrike{0%{opacity:0}5%{opacity:1}11%{opacity:.12}17%{opacity:.92}25%{opacity:.18}42%{opacity:.8}100%{opacity:0}}
/* Ember Throne flares rather than flashes -- it comes up out of the fire. */
body[data-theme="embers"].entering .flash{animation:enterFlare 1.9s cubic-bezier(.3,0,.3,1) forwards;}
@keyframes enterFlare{0%{opacity:0;transform:scale(.82)}30%{opacity:1}100%{opacity:0;transform:scale(1.18)}}

<!-- ============ LIVE BACKGROUND SHADER ============ -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform sampler2D uTex;
uniform vec2  uRes;
uniform vec2  uTexRes;
uniform vec2  uMouse;
uniform float uTime;
uniform float uExposure;   // 0 = black, 1 = fully lit
uniform float uBlur;       // 1 = soft dream blur (opening)
uniform float uZoom;       // camera push
uniform float uFire;       // strength of flame animation
uniform float uMist;       // ground mist amount
uniform float uRain;       // rain curtain strength
uniform float uStorm;      // lightning strength
uniform float uAurora;     // celestial aurora strength
uniform vec3  uRayCol;     // colour of the light shafts
uniform float uRayAmt;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){
    v += a * noise(p);
    p *= 2.03;
    a *= 0.5;
  }
  return v;
}

/* cover-fit the texture to the viewport */
vec2 coverUV(vec2 uv){
  float ta = uTexRes.x / uTexRes.y;
  float sa = uRes.x / uRes.y;
  if (sa > ta) uv.y = (uv.y - 0.5) * (ta / sa) + 0.5;
  else         uv.x = (uv.x - 0.5) * (sa / ta) + 0.5;
  return uv;
}

vec3 grab(vec2 uv){ return texture2D(uTex, clamp(uv, 0.001, 0.999)).rgb; }

/* soft blur used during the opening reveal */
vec3 grabBlur(vec2 uv, float r){
  if (r < 0.001) return grab(uv);
  vec3 c = vec3(0.0);
  c += grab(uv + vec2( r,  0.0));
  c += grab(uv + vec2(-r,  0.0));
  c += grab(uv + vec2(0.0,  r));
  c += grab(uv + vec2(0.0, -r));
  c += grab(uv + vec2( r,  r) * 0.7);
  c += grab(uv + vec2(-r,  r) * 0.7);
  c += grab(uv + vec2( r, -r) * 0.7);
  c += grab(uv + vec2(-r, -r) * 0.7);
  return c / 8.0;
}

/* how "flame-like" a pixel is: warm + bright */
float warmMask(vec3 c){
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  float warm = clamp((c.r - c.b) * 1.9, 0.0, 1.0);
  return warm * smoothstep(0.18, 0.72, l);
}

void main(){
  vec2 frag = gl_FragCoord.xy / uRes;
  float t = uTime;

  /* --- living camera: slow push + breathing drift + parallax --- */
  vec2 uv = coverUV(frag);
  vec2 drift = vec2(sin(t * 0.045) * 0.004, cos(t * 0.037) * 0.003);
  uv = (uv - 0.5) / uZoom + 0.5 + drift + uMouse * 0.012;

  /* --- atmospheric warp: haze breathing through the hall --- */
  vec2 w = vec2(fbm(uv * 3.1 + vec2(t * 0.035, -t * 0.05)),
                fbm(uv * 3.4 + 7.3 + vec2(-t * 0.04, t * 0.033))) - 0.5;
  vec2 uvw = uv + w * 0.0035;

  /* --- heat shimmer rising off the flames --- */
  vec3 probe = grab(uvw);
  float wm = warmMask(probe);
  float below = warmMask(grab(uvw - vec2(0.0, 0.06)));
  float heat = max(wm, below * 0.9);
  float shimmer = sin(uv.x * 190.0 + t * 5.0) * 0.5 + fbm(vec2(uv.x * 24.0, uv.y * 12.0 - t * 1.6)) - 0.5;
  uvw += vec2(shimmer * 0.0022, abs(shimmer) * 0.0016) * heat * uFire;

  /* --- base plate --- */
  vec3 col = grabBlur(uvw, uBlur * 0.010);

  /* subtle chromatic separation towards the edges (anamorphic feel) */
  float edge = length(frag - 0.5);
  float ca = 0.0016 * edge * edge;
  col.r = grabBlur(uvw + vec2(ca, 0.0), uBlur * 0.010).r;
  col.b = grabBlur(uvw - vec2(ca, 0.0), uBlur * 0.010).b;

  /* --- LIVE FIRE: flicker + bloom on every warm pixel --- */
  float m = warmMask(col);
  float flick = fbm(vec2(uv.x * 7.0, uv.y * 3.0 - t * 2.4)) * 0.9
              + fbm(vec2(uv.x * 21.0, -t * 5.2)) * 0.5
              + sin(t * 11.0 + uv.x * 30.0) * 0.10;
  flick = (flick - 0.72);
  col += vec3(1.0, 0.52, 0.16) * m * flick * 0.85 * uFire;

  /* warm bloom bleeding into the air around the flames */
  float bloom = 0.0;
#ifdef LOW_TIER
  for (int i = 0; i < 4; i++){
    float a = float(i) * 1.5707963;
    bloom += warmMask(grab(uvw + vec2(cos(a), sin(a)) * 0.022));
  }
  bloom /= 4.0;
#else
  for (int i = 0; i < 8; i++){
    float a = float(i) * 0.7853981;
    bloom += warmMask(grab(uvw + vec2(cos(a), sin(a)) * 0.022));
  }
  bloom /= 8.0;
#endif
  col += vec3(1.0, 0.55, 0.20) * bloom * (0.22 + 0.16 * flick) * uFire;

  /* --- LIVE GOD RAYS drifting across the hall --- */
  float shafts = fbm(vec2(uv.x * 5.0 - t * 0.035, uv.y * 0.8 + t * 0.02));
  shafts = pow(max(shafts - 0.34, 0.0), 1.6) * 3.2;
  shafts *= smoothstep(0.05, 0.85, 1.0 - frag.y) * (0.65 + 0.35 * sin(t * 0.4));
  col += uRayCol * shafts * uRayAmt;

  /* --- LIVE GROUND MIST rolling forward --- */
  float mist = fbm(vec2(uv.x * 2.3 - t * 0.025, uv.y * 5.0 + t * 0.05));
  mist *= smoothstep(0.42, 0.0, frag.y) * uMist;
  col = mix(col, col * 0.75 + vec3(0.36, 0.44, 0.60) * 0.55, clamp(mist * 0.55, 0.0, 0.55));

  /* --- STORM PROFILE: diagonal rain + intermittent lightning --- */
  vec2 rp = frag * vec2(uRes.x / max(uRes.y, 1.0), 1.0);
  rp.x += rp.y * 0.32;
  float rainCell = hash(vec2(floor(rp.x * 180.0), floor((rp.y + t * 1.8) * 90.0)));
  float rainLine = smoothstep(0.945, 1.0, rainCell) * smoothstep(0.0, 0.16, fract((rp.y + t * 1.8) * 90.0));
  col += vec3(0.48, 0.64, 0.82) * rainLine * uRain * 0.7;
  float strike = pow(max(sin(t * 0.43 - 1.1), 0.0), 40.0) + 0.5 * pow(max(sin(t * 1.17 + 2.5), 0.0), 80.0);
  col += vec3(0.66, 0.78, 1.0) * strike * uStorm;

  /* --- CELESTIAL PROFILE: living violet-blue aurora ribbons --- */
  float ribbon = sin(uv.x * 8.0 + fbm(vec2(uv.x * 2.0 - t * 0.025, t * 0.035)) * 5.0 + t * 0.12);
  ribbon = pow(max(ribbon * 0.5 + 0.5 - uv.y * 0.22, 0.0), 3.0);
  ribbon *= smoothstep(0.32, 0.95, frag.y) * uAurora;
  col += mix(vec3(0.12,0.48,0.82), vec3(0.52,0.20,0.82), fbm(uv * 2.0 + t * 0.02)) * ribbon * 0.55;

  /* --- dark-to-light cinematic reveal --- */
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum) * 0.35, col, clamp(uExposure * 1.15, 0.0, 1.0));
  col *= mix(0.12, 1.0, uExposure);
  col = pow(max(col, 0.0), vec3(mix(1.35, 1.0, uExposure)));

  /* filmic contrast + gentle vignette (the CSS layer adds the rest) */
  col = (col - 0.5) * 1.06 + 0.5;
  col *= 1.0 - 0.35 * edge * edge;

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

/* ===== WebGL live background ===== */
const BG = (function(){
  const canvas = document.getElementById('bg');
  const gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});
  if (!gl){ document.body.classList.add('nogl'); return {setTheme(){}, reveal(){}, push(){}, skip(){}}; }

  function compile(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  const fsSrc = (LOW_TIER ? '#define LOW_TIER 1\n' : '') + document.getElementById('fs').textContent;
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const u = {res:U('uRes'),texRes:U('uTexRes'),mouse:U('uMouse'),time:U('uTime'),exp:U('uExposure'),
             blur:U('uBlur'),zoom:U('uZoom'),fire:U('uFire'),mist:U('uMist'),rain:U('uRain'),storm:U('uStorm'),
             aurora:U('uAurora'),ray:U('uRayCol'),rayAmt:U('uRayAmt')};

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  let texRes = [1,1], theme = THEMES.sapphire;
  const cache = {};

  function useImage(img){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    texRes = [img.naturalWidth, img.naturalHeight];
  }

  function setTheme(name){
    theme = THEMES[name];
    document.documentElement.style.setProperty('--bg-img', `url('${theme.src}')`);
    if (cache[name]) { useImage(cache[name]); return; }
    const img = new Image();
    img.onload = () => { cache[name] = img; useImage(img); };
    img.src = theme.src;
  }
  setTheme(CONFIG.theme);

  const dpr = Math.min(devicePixelRatio || 1, LOW_TIER ? 1.2 : 1.75);
  function resize(){
    canvas.width  = Math.floor(innerWidth  * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);

  let mx = 0, my = 0, tmx = 0, tmy = 0;
  addEventListener('pointermove', e => {
    tmx = (e.clientX / innerWidth  - 0.5) * 2;
    tmy = (e.clientY / innerHeight - 0.5) * 2;
  });

  let t0 = performance.now() / 1000;
  let zoomTarget = 1.0, zoom = 1.14, pushing = false;

  function reveal(){ t0 = performance.now() / 1000; zoom = 1.14; zoomTarget = 1.0; pushing = false; }
  function skip(sec){ t0 -= sec; zoom = 1.0; }
  function push(){ pushing = true; zoomTarget = 1.5; }

  (function frame(){
    const now = performance.now() / 1000;
    const el  = now - t0;

    // matches the DOM timeline: black until 1.2s, fully lit by 3.6s
    const exposure = Math.min(Math.max((el - 1.2) / 2.4, 0), 1);
    const blur = 1 - exposure;

    zoom += (zoomTarget - zoom) * (pushing ? 0.05 : 0.012);
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;

    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform2f(u.texRes, texRes[0], texRes[1]);
    gl.uniform2f(u.mouse, mx, my);
    gl.uniform1f(u.time, now - t0 + 40.0);
    gl.uniform1f(u.exp, exposure);
    gl.uniform1f(u.blur, blur);
    gl.uniform1f(u.zoom, zoom);
    gl.uniform1f(u.fire, theme.fire);
    gl.uniform1f(u.mist, theme.mist);
    gl.uniform1f(u.rain, theme.rain);
    gl.uniform1f(u.storm, theme.storm);
    gl.uniform1f(u.aurora, theme.aurora);
    gl.uniform3f(u.ray, theme.ray[0], theme.ray[1], theme.ray[2]);
    gl.uniform1f(u.rayAmt, theme.rayAmt);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  })();

  return {setTheme, reveal, push, skip};
})();

/* ===== embers + dust ===== */
(function(){
  const c = document.getElementById('dust'), ctx = c.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w, h, dust = [], embers = [];
  function resize(){
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const n = Math.round(innerWidth * innerHeight / 24000);
    dust = Array.from({length:n}, () => ({x:Math.random()*w,y:Math.random()*h,
      r:(Math.random()*1.4+.35)*dpr,s:(Math.random()*.2+.04)*dpr,d:Math.random()*6.28,a:Math.random()*.4+.1}));
    embers = Array.from({length:Math.round(n/3)}, () => ({x:Math.random()*w,y:h*(0.55+Math.random()*0.5),
      r:(Math.random()*1.6+.6)*dpr,s:(Math.random()*.5+.18)*dpr,d:Math.random()*6.28,a:Math.random()*.55+.25,life:Math.random()}));
  }
  resize(); addEventListener('resize', resize);
  function glow(p, col, t, boost){
    const tw = p.a * (0.6 + 0.4*Math.sin(t/850 + p.d*5)) * boost;
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4.5);
    g.addColorStop(0, col.replace('A', tw)); g.addColorStop(1, col.replace('A', 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4.5,0,6.2832); ctx.fill();
  }
  (function loop(t){
    ctx.clearRect(0,0,w,h);
    for (const p of dust){
      p.y -= p.s; p.x += Math.sin(t/2800 + p.d)*.2*dpr;
      if (p.y < -10){ p.y = h+10; p.x = Math.random()*w; }
      glow(p,'rgba(255,234,186,A)',t,1);
    }
    for (const p of embers){
      p.y -= p.s; p.x += Math.sin(t/1500 + p.d)*.45*dpr; p.life -= .0016;
      if (p.y < h*0.12 || p.life <= 0){
        p.y = h*(0.9+Math.random()*0.15);
        p.x = (Math.random()<.5 ? Math.random()*w*.28 : w - Math.random()*w*.28);
        p.life = 1;
      }
      glow(p,'rgba(255,168,72,A)',t,Math.max(p.life,0));
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* ===== cinematic score ===== */
const Score = (() => {
  let ac, master, on = true;
  const T = () => ac.currentTime;
  function init(){
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  function noiseBuf(sec){
    const len = sec*ac.sampleRate, b = ac.createBuffer(1,len,ac.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return b;
  }
  function subBass(){
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001,T());
    g.gain.exponentialRampToValueAtTime(.26, T()+3.5);
    [34,51].forEach(hz=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=hz;o.connect(f);o.start();});
    const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.07; lg.gain.value=.06;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    f.connect(g); g.connect(master);
  }
  function hallAir(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(5); s.loop=true;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380; f.Q.value=.55;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,T()); g.gain.exponentialRampToValueAtTime(.03,T()+4.5);
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function torchCrackle(){
    const s=ac.createBufferSource(); s.buffer=noiseBuf(3); s.loop=true;
    const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=2400;
    const g=ac.createGain(); g.gain.value=.0001;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    (function crack(){
      if (!ac) return;
      const t=T()+Math.random()*1.4+.25;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.012+Math.random()*.01,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.09);
      setTimeout(crack, 500+Math.random()*1500);
    })();
  }
  function pad(at, freqs, vol, dur){
    const t=T()+at;
    freqs.forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type = i%2 ? 'triangle':'sine'; o.frequency.value=hz; o.detune.value=Math.random()*10-5;
      f.type='lowpass'; f.frequency.value=2200;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+dur*.35);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1);
    });
  }
  function shimmer(at){
    const t=T()+at;
    [1568,2093,2637,3136].forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz;
      const s=t+i*.1;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.045,s+.13);
      g.gain.exponentialRampToValueAtTime(.0001,s+1.7);
      o.connect(g); g.connect(master); o.start(s); o.stop(s+1.9);
    });
  }
  function impact(at){
    const t=T()+at;
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(36,t+.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t+2.8);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+2.9);
    const s=ac.createBufferSource(); s.buffer=noiseBuf(2);
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
    const ng=ac.createGain();
    ng.gain.setValueAtTime(.0001,Math.max(t-1.1,T()));
    ng.gain.exponentialRampToValueAtTime(.06,t);
    ng.gain.exponentialRampToValueAtTime(.0001,t+.6);
    s.connect(f); f.connect(ng); ng.connect(master); s.start(Math.max(t-1.1,T())); s.stop(t+.7);
    pad(at,[98,196,293.66,392,587.33],.085,4.2);
  }
  /* ---------- the voices each hall is scored with ----------
     All of this is synthesised on the fly; there are no audio files to ship.
     The primitives above (pad, shimmer, impact) were one palette used nine
     times. These are the instruments that let a hall sound like itself. */

  // Brass: stacked detuned saws through a sweeping lowpass. Ceremony.
  function brass(at, freqs, vol, dur){
    const t=T()+at;
    freqs.forEach((hz,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=hz; o.detune.value=(i-1)*7;
      f.type='lowpass'; f.Q.value=6;
      f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur*.3);
      f.frequency.exponentialRampToValueAtTime(900,t+dur);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+.12);
      g.gain.setValueAtTime(vol,t+dur*.6);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1);
    });

  // Pipe organ: a root with its fifth and octaves, square-ish, no attack.
  function organ(at, root, vol, dur){
    const t=T()+at;
    [1,1.5,2,3,4].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type = i%2 ? 'square' : 'sine'; o.frequency.value=root*m; o.detune.value=Math.random()*6-3;
      const v = vol/(1+i*.9);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+.5);
      g.gain.setValueAtTime(v,t+dur*.7);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);

    });

  // Gong: inharmonic partials with a long metallic decay.
  function gong(at, base, vol){
    const t=T()+at;
    [1,2.37,3.41,4.63,5.9,7.2].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();

      const v = vol/(1+i*1.5), d = 7 - i*.6;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+.02+i*.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.1);
    });

  // A struck skin -- pitch drops fast, body is filtered noise.
  function drum(at, hz, vol){
    const t=T()+at;
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
    o.frequency.setValueAtTime(hz,t); o.frequency.exponentialRampToValueAtTime(hz*.4,t+.28);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.75);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.8);
    const n=ac.createBufferSource(); n.buffer=noiseBuf(.4);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
    const ng=ac.createGain(); ng.gain.setValueAtTime(vol*.5,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.22);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+.3);
  }
  // A small struck bell.
  function bell(at, hz, vol){
    const t=T()+at;
    [1,2.76,5.4].forEach((m,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=hz*m;
      const v=vol/(1+i*2), d=4-i*.9;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.006);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
    });
  }
  // Thunder: a filtered noise swell with a hard crack on the front.
  function thunder(at, vol){
    const t=T()+at;
    const n=ac.createBufferSource(); n.buffer=noiseBuf(4);
    const f=ac.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(90,t+2.6);
    const g=ac.createGain();
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.05);
    g.gain.exponentialRampToValueAtTime(vol*.35,t+.5);
    g.gain.exponentialRampToValueAtTime(.0001,t+2.9);
    n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+3);
  }
  // Steady rain, held under everything.
  function rain(vol){
    const n=ac.createBufferSource(); n.buffer=noiseBuf(5); n.loop=true;
    const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,T());
    g.gain.exponentialRampToValueAtTime(vol,T()+3.5);
    n.connect(f); f.connect(g); g.connect(master); n.start();

    const lfo=ac.createOscillator(), lg=ac.createGain();

  const SCORES = {

    sapphire(){
      subBass(); hallAir(); torchCrackle();

      brass(6.2,[261.63,392,523.25],.08,4.4);
    },
    // Almost nothing: air, a far-off bell, one low breath.
    moonlit(){
      hallAir(); wind(.05);
      pad(.8,[110,164.81,220],.036,7);
      bell(2.6,880,.05); bell(5.0,1174.7,.042);
      pad(4.2,[130.81,196,246.94],.03,6);
      impact(6.0); bell(6.15,1318.5,.06);
      pad(6.6,[98,146.83,220,293.66],.033,7);
    },
    // A forge. Low, dirty, and struck.
    embers(){
      subBass(); torchCrackle(); torchCrackle();
      drum(1.1,58,.34); drum(2.3,58,.3); drum(3.5,52,.36);
      pad(1.0,[65.41,98,130.81],.06,5);
      drum(4.6,49,.42); drum(5.3,49,.46);
      impact(6.0); drum(6.0,44,.6); drum(6.42,58,.34);
      pad(6.6,[73.42,110,146.83],.055,6);
    },
    // Stone and organ. Reverent, slow, enormous.
    cathedral(){
      hallAir();
      organ(.6,98,.055,7.5);
      shimmer(3.0); shimmer(4.4);
      organ(4.2,130.81,.05,5);
      impact(6.0); bell(6.05,1567.98,.07);
      organ(6.5,146.83,.06,7);
      pad(6.8,[587.33,880,1174.66],.028,6);
    },
    // Weather. Rain under everything, and the sky answering.
    storm(){
      subBass(); rain(.05); wind(.045);
      thunder(1.4,.16);
      pad(2.0,[97.99,146.83,185],.04,5);
      thunder(4.3,.2);
      impact(6.0); thunder(6.0,.3); drum(6.05,64,.4);
      pad(6.6,[110,164.81,207.65,277.18],.042,6);
    },
    // A gate opening: gongs, a deep drum, and a pentatonic figure.
    dragongate(){
      subBass(); hallAir(); torchCrackle();
      gong(.8,110,.16);
      drum(2.4,62,.34);
      arpeggio(3.2,[293.66,349.23,440,523.25],.045,.34);
      gong(4.6,146.83,.13);
      impact(6.0); gong(6.0,98,.22); drum(6.05,55,.5);
      pad(6.7,[110,164.81,220,329.63],.04,6);
    },
    // A camp before a march: drums, wind, a horn.
    warcamp(){
      subBass(); hallAir(); torchCrackle(); wind(.04);
      drum(1.0,70,.3); drum(1.5,70,.22); drum(2.0,58,.34);
      drum(3.0,70,.3); drum(3.5,70,.22); drum(4.0,58,.36);
      brass(4.3,[146.83,220,293.66],.055,2.4);
      drum(5.0,70,.32); drum(5.5,70,.26);
      impact(6.0); drum(6.0,52,.55);
      brass(6.3,[174.61,261.63,349.23],.06,4.2);
    },
    // Above the world. Bells, no bass, nothing struck hard.
    celestial(){
      hallAir(); wind(.055);
      pad(.6,[261.63,392,523.25],.03,7);
      arpeggio(2.2,[783.99,987.77,1174.66,1567.98],.05,.42);
      pad(4.0,[293.66,440,587.33],.028,6);
      impact(6.0);
      arpeggio(6.1,[1046.5,1318.51,1567.98,2093],.055,.3);
      pad(6.7,[329.63,493.88,659.25,987.77],.03,7);
    },
  };

  return {
    // Browsers refuse to start audio without a user gesture. The old build met
    // that with a full-screen "click to begin" wall. This meets it invisibly:
    // try to start, and if the context is blocked, resume on the first
    // interaction that happens anyway -- a tap, a key, a scroll. Nobody is ever
    // asked to click before the film runs, and where a gesture already
    // happened (someone tapped a card to open this) sound simply starts.
    arm(){
      init();
      if (ac.state === 'running') return;
      const go = () => {
        ac.resume().then(() => {
          if (ac.state === 'running') off.forEach(f => f());
        }).catch(() => {});
      };
      const evs = ['pointerdown','touchstart','keydown','wheel'];
      const off = evs.map(e => {
        const h = () => go();
        window.addEventListener(e, h, { passive: true });
        return () => window.removeEventListener(e, h);
      });
      go();
    },
    get muted(){ return !on },
    start(theme){
      init(); if (ac.state!=='running') ac.resume().catch(()=>{});
      (SCORES[theme] || SCORES.sapphire)();
    },
    // Leaving sounds like the hall you are leaving.
    fanfare(theme){
      if(!ac) return;
      if (theme==='embers'||theme==='dragongate'){ drum(0,46,.6); gong(.02,110,.2); }
      else if (theme==='storm'){ thunder(0,.34); drum(.02,58,.5); }
      else if (theme==='cathedral'){ organ(0,196,.075,3.2); bell(.05,1567.98,.08); }
      else if (theme==='celestial'||theme==='moonlit'){ arpeggio(0,[1046.5,1318.51,1567.98],.06,.16); }
      else if (theme==='warcamp'){ drum(0,64,.5); brass(.05,[196,293.66,392],.075,2.4); }
      else if (theme==='coronation'){ brass(0,[261.63,392,523.25],.09,2.6); bell(.05,1046.5,.09); impact(.05); }
      else { pad(0,[261.63,392,523.25,783.99],.09,2.6); impact(.05); }
    },
    toggle(){ init(); on=!on; master.gain.linearRampToValueAtTime(on?.9:.0001, T()+.4); return on; }
  };
})();

/* ===== sequence ===== */
const stage = document.getElementById('stage');
const INTRO_LENGTH = 8.6; // seconds until the screen is fully composed

function run(withAudio){
  stage.classList.remove('play','done');
  void stage.offsetWidth;
  stage.classList.add('play');
  BG.reveal();
  if (withAudio) Score.start(CONFIG.theme);
}

/* jump straight to the composed frame, keeping every looping animation alive */
function skipIntro(){
  stage.getAnimations({subtree:true}).forEach(a => {
    try { if (a.effect && a.playState !== 'finished') a.currentTime = INTRO_LENGTH * 1000; } catch(_){}
  });
  BG.skip(INTRO_LENGTH);
  stage.classList.add('done');
}

// FORCE_INTRO exists because skipIntroOnReturn was quietly breaking the one
// job the previews have. It is keyed to sessionStorage, so on a page that opens
// several gates in a row -- the voting page, the gallery -- the FIRST gate
// played its intro and every one after it jumped straight to the composed
// frame. Measured: opening sapphire, then coronation, then moonlit left the
// last two at stage.done after 1.5s. Anyone comparing the nine would have seen
// one of them animate. A preview always plays; only the real splash, where a
// returning visitor does not want eight seconds every time, still skips.
function begin(){
  const seen = !FORCE_INTRO && CONFIG.skipIntroOnReturn
            && (() => { try { return sessionStorage.getItem('k846_intro') === '1' } catch { return false } })();
  Score.arm();
  run(!seen);
  if (seen) requestAnimationFrame(skipIntro);
  try { sessionStorage.setItem('k846_intro','1'); } catch(_){}
}

// No gate, no "click to begin" -- the film starts itself.
if (document.readyState === 'complete') begin();
else window.addEventListener('load', begin, { once: true });
document.getElementById('skip').addEventListener('click', e => { e.stopPropagation(); skipIntro(); });
document.getElementById('replay').addEventListener('click', e => { e.stopPropagation(); Score.arm(); run(true); });
document.getElementById('sound').addEventListener('click', e => {
  e.stopPropagation();
  e.currentTarget.textContent = Score.toggle() ? 'SOUND ON' : 'SOUND OFF';
});
// The button is now a mute switch, not the way sound gets turned on.
document.getElementById('sound').textContent = 'SOUND ON';
document.querySelectorAll('.theme').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  document.body.dataset.theme = CONFIG.theme = b.dataset.theme;
  document.querySelectorAll('.theme').forEach(x => x.classList.toggle('on', x === b));
  BG.setTheme(b.dataset.theme);
  run(true);
}));
document.getElementById('enter').addEventListener('click', () => {
  Score.fanfare(CONFIG.theme);
  BG.push();
  document.body.classList.add('entering');
  // Same handoff as the first build: inside the app's splash iframe the site is
  // opened by posting k846-enter-realm to the parent, not by navigating. Same
  // origin asserted explicitly rather than '*' -- the message unlocks the site.
  // enterUrl still applies when opened standalone, which is how the gallery
  // and ?preview=1 are used.
  const inFrame = window.parent && window.parent !== window;
  if (inFrame) {
    setTimeout(() => {
      try { window.parent.postMessage({ type: 'k846-enter-realm' }, window.location.origin); } catch (e) {}
    }, 1400);
  } else if (CONFIG.enterUrl) {
    setTimeout(() => { location.href = CONFIG.enterUrl; }, 1500);
  }
});
</script>
