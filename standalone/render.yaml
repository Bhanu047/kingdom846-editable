services:
  - type: web
    name: kingdom791-war-room
    runtime: node
    rootDir: standalone
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/kingdom791.db
    disk:
      name: kingdom791-state
      mountPath: /var/data
      sizeGB: 1
